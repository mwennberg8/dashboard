<!DOCTYPE html>
<html lang="sv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Huset · strömflöden (prov)</title>
<style>
/* FÖRHANDSVISNING 1.1 – toppen av startsidan med huset ovanifrån. Fyra fält
   nere till höger (Elnät, Förbrukning, Sol, Batteri) och vinkelräta ledningar
   till dem: solpanelerna i en kedja till solfältet, nätet från elcentralen,
   batteriet från husbatteriet, och förbrukningen ut till stora huset.
   Demodata, tre lägen. Inget här läser från Homey ännu. */
:root{--bg:#2e3440;--panel-a:#353d4b;--panel-b:#2f3643;--line:rgba(216,222,233,.12);
  --ink:#eceff4;--dim:#cdd6e2;--faint:#8b93a3;--inset:#3b4252;
  --sol:#d9a521;--batt:#3f9fb8;--nat:#c8683f;--last:#5e7fa8;--ok:#5f8f4e;
  --sans:"Inter Tight","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;padding:12px;background:var(--bg);color:var(--ink);font:14px/1.42 var(--sans)}
.wrap{max-width:560px;margin:0 auto}
.panel{background:linear-gradient(180deg,var(--panel-a),var(--panel-b));border:1px solid var(--line);
  border-radius:26px;padding:12px;display:flex;flex-direction:column;gap:10px}
.lagen{display:flex;gap:6px}
.lagen button{flex:1 1 0;appearance:none;border:1px solid var(--line);background:var(--inset);color:var(--dim);
  font:700 12.5px var(--sans);padding:8px 6px;border-radius:12px;cursor:pointer}
.lagen button.on{background:#4c566a;color:var(--ink);border-color:rgba(216,222,233,.25)}

/* Kartan. Bilden, SVG:n och fälten delar koordinater (1040 × 1120): fälten
   sätts i procent av samma mått, så ledningarna träffar dem i alla storlekar.
   Texten i fälten skalas med kartans bredd (cqw). */
.karta{position:relative;width:100%;aspect-ratio:1040/1120;border-radius:20px;overflow:hidden;
  background:#dfe6ee;container-type:inline-size}
.karta img{position:absolute;inset:0;width:100%;height:100%;display:block}
.karta svg{position:absolute;inset:0;width:100%;height:100%}
.ledn-bas{fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.85;transition:stroke-width .4s,opacity .4s}
/* Prickarna ovanpå den färgade ledningen: vita, runda, och de rör sig åt det
   håll strömmen går. */
.ledn{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:0 16;opacity:.95;
  animation:flod 1.1s linear infinite}
.ledn.bak{animation-direction:reverse}
.ledn.av{animation:none;stroke-dasharray:none;opacity:0}
@keyframes flod{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.ledn{animation:none;stroke-dasharray:none}}

.falt{position:absolute;display:flex;flex-direction:column;justify-content:center;gap:.2cqw;
  background:rgba(255,255,255,.94);color:#2e3440;border:2px solid var(--f);border-radius:2.2cqw;
  padding:0 1.5cqw;box-shadow:0 6px 16px -10px rgba(46,52,64,.55);transition:opacity .3s}
.falt .rub{display:flex;align-items:center;gap:1cqw;font:750 2.6cqw/1.1 var(--sans);
  color:#4c566a;white-space:nowrap;overflow:hidden}
.falt .rub i{width:1.6cqw;height:1.6cqw;border-radius:50%;background:var(--f);flex:0 0 auto}
.falt .v{font:800 5.2cqw/1.05 var(--sans);letter-spacing:-.02em;white-space:nowrap}
.falt .v small{font-size:2.9cqw;font-weight:700;color:#4c566a}
.falt .u{font:650 2.35cqw/1.15 var(--sans);color:#4c566a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.falt.noll .v{color:#8b93a3}
.fot{font-size:11.5px;color:var(--faint);line-height:1.45;margin:0 4px}
.fot b{color:var(--dim)}
</style></head><body>
<div class="wrap">
  <div class="panel">
    <div class="lagen" id="lagen"></div>
    <div class="karta" id="karta">
      <img src="bild/hus-ovanifran.webp" alt="Huset ovanifrån med uterum, altan, Breveden, Snickarboa och bilarna">
      <svg viewBox="0 0 1040 1120" aria-hidden="true" id="svg"></svg>
    </div>
  </div>
  <p class="fot"><b>Förhandsvisning med demodata.</b> Solpanelerna är kopplade i en kedja till
    solfältet, nätet går från elcentralen, batteriet från husbatteriet och förbrukningen ut till
    stora huset. Tjockleken följer effekten och prickarna rör sig åt det håll strömmen går.</p>
</div>
<script>
'use strict';
/* FÄLTEN, nere till höger, i bildens koordinater: x, y, bredd, höjd.
   Två kolumner, två rader. */
const F={
  sol:  {x:500,y:822, w:252,h:134, typ:'sol'},
  nat:  {x:776,y:822, w:246,h:134, typ:'nat'},
  last: {x:500,y:966, w:252,h:134, typ:'last'},
  batt: {x:776,y:966, w:246,h:134, typ:'batt'},
};

/* LEDNINGARNA, i bildens koordinater (1040 × 1120). Ritade i den riktning
   strömmen normalt går; negativ effekt vänder prickarna.
   Solpanelerna: vänster tak → mitten nedre → mitten övre → höger tak, och
   därifrån ned till solfältet. Varje sträcka bär summan av panelerna före. */
const L=[
  {id:'sol1', typ:'sol', d:'M428,680 H512',                 v:s=>s.solD},
  {id:'sol2', typ:'sol', d:'M600,632 V612',                 v:s=>s.solD+s.solC},
  {id:'sol3', typ:'sol', d:'M684,582 H730 V500 H780',       v:s=>s.solD+s.solC+s.solB},
  {id:'sol4', typ:'sol', d:'M800,552 V575 H740 V822',       v:s=>s.solD+s.solC+s.solB+s.solA},
  /* nätet från elcentralen, runt huset och ned i elnätsfältet; positivt = köper */
  {id:'nat',  typ:'nat', d:'M910,396 V380 H1000 V822',      v:s=>s.nat},
  /* husbatteriet på väggen, ned och genom mellanrummet mellan fälten till
     batterifältet; positivt = laddar ur */
  {id:'batt', typ:'batt',d:'M910,522 V790 H764 V1033 H776', v:s=>s.batt},
  /* förbrukningen ut till stora huset */
  {id:'last', typ:'last',d:'M500,1033 H480 V745',           v:s=>s.last},
];
const FARG={sol:'var(--sol)',batt:'var(--batt)',nat:'var(--nat)',last:'var(--last)'};

/* DEMODATA. Varje läge går jämnt upp: sol + batteri ur + nät köpt = förbrukning. */
const LAGEN=[
  {namn:'Dag · sol',    solA:2.1,solB:1.3,solC:1.2,solD:1.4, batt:-2.5, nat:-1.5, soc:62, last:2.0},
  {namn:'Kväll',        solA:0,solB:0,solC:0,solD:0,         batt:1.9,  nat:1.0,  soc:41, last:2.9},
  {namn:'Natt · bilen', solA:0,solB:0,solC:0,solD:0,         batt:-2.5, nat:10.7, soc:28, last:8.2},
];

function kw(v){return (Math.round(v*10)/10).toFixed(1).replace('.',',');}
/* Högst 14: batteriets ledning går i ett 24 enheter brett mellanrum. */
function bredd(v){return Math.max(5,Math.min(14,5+Math.abs(v)*1.4));}

const svg=document.getElementById('svg'),karta=document.getElementById('karta');
const NS='http://www.w3.org/2000/svg';
const ritade={};
L.forEach(function(l){
  const bas=document.createElementNS(NS,'path');bas.setAttribute('d',l.d);bas.setAttribute('class','ledn-bas');bas.style.stroke=FARG[l.typ];
  const fl=document.createElementNS(NS,'path');fl.setAttribute('d',l.d);fl.setAttribute('class','ledn');
  svg.appendChild(bas);svg.appendChild(fl);ritade[l.id]={bas:bas,fl:fl};
});
const falt={};
Object.keys(F).forEach(function(k){
  const f=F[k],e=document.createElement('div');
  e.className='falt';e.style.setProperty('--f',FARG[f.typ]);
  e.style.left=(f.x/1040*100)+'%';e.style.top=(f.y/1120*100)+'%';
  e.style.width=(f.w/1040*100)+'%';e.style.height=(f.h/1120*100)+'%';
  karta.appendChild(e);falt[k]=e;
});
function fyll(e,rub,v,under){
  e.innerHTML='<div class="rub"><i></i>'+rub+'</div><div class="v">'+kw(Math.abs(v))+'<small> kW</small></div>'
    +'<div class="u">'+under+'</div>';
  e.classList.toggle('noll',!(Math.abs(v)>=0.05));
}

let valt=0;
function rita(){
  const s=LAGEN[valt];
  L.forEach(function(l){
    const v=l.v(s),r=ritade[l.id],w=bredd(v),tom=Math.abs(v)<0.05;
    r.bas.style.strokeWidth=tom?2.5:w;r.bas.style.opacity=tom?0.25:0.85;
    r.fl.style.strokeWidth=Math.max(2.5,w*0.55);
    r.fl.setAttribute('class','ledn'+(tom?' av':'')+(v<0?' bak':''));
    r.fl.style.animationDuration=(tom?0:Math.max(0.45,1.5-Math.abs(v)*0.12))+'s';
  });
  const sol=s.solA+s.solB+s.solC+s.solD;
  const eget=Math.round(Math.max(0,1-Math.max(0,s.nat)/s.last)*100);
  fyll(falt.sol,'Sol',sol,sol>=0.05?'4 tak':'ingen sol');
  fyll(falt.batt,'Batteri',s.batt,s.soc+' % · '+(s.batt>0.05?'laddar ur':s.batt<-0.05?'laddar':'vilar'));
  fyll(falt.last,'Förbrukning',s.last,eget+' % egen el');
  fyll(falt.nat,'Elnät',s.nat,s.nat>0.05?'köper':s.nat<-0.05?'säljer':'–');
  document.querySelectorAll('#lagen button').forEach(function(x,i){x.classList.toggle('on',i===valt);});
}
document.getElementById('lagen').innerHTML=LAGEN.map(function(s,i){return '<button type="button" data-i="'+i+'">'+s.namn+'</button>';}).join('');
document.getElementById('lagen').addEventListener('click',function(e){const b=e.target.closest('button');if(!b)return;valt=+b.dataset.i;rita();});
rita();
</script>
</body></html>
