.kr-rh{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:850;
  letter-spacing:-.01em;line-height:1.3;margin:0 0 10px;padding-bottom:9px;
  border-bottom:1px solid var(--line)}
.kr-rhi{font-size:19px;line-height:1;flex:0 0 auto}
/* En rad per ämne. Emojin i egen kolumn med fast bredd — annars börjar raderna
   på olika ställen beroende på om tecknet är brett eller smalt. */
/* Ingressen bär tonen — större, ljusare, lite luft under. */
.kr-ing{margin:0 0 12px;font-size:14.5px;line-height:1.6;color:var(--ink);font-weight:650}
/* Brödtext i stycken, som i en artikel. Heter kr-txt eftersom kr-p redan var
   upptagen av listans chevron — en namnkrock som gav 12 px breda stycken. */
.kr-txt{margin:0 0 11px;font-size:13.5px;line-height:1.68;color:var(--dim)}
.kr-txt:last-child{margin-bottom:0}
/* Höjdpunkt. Ingen list, ingen ram — den skiljer sig genom att vara något
   mörkare i tonen och ha sin emoji hängande i vänsterkanten. En rad med streck
   framför läses som en punktlista, och det var precis vad texten inte skulle
   vara. */
.kr-rr{display:block;position:relative;padding:2px 0 2px 27px;margin:0 0 11px;
  font-size:13.5px;line-height:1.68;color:var(--ink);font-weight:600}
.kr-rri{position:absolute;left:0;top:2px;width:19px;text-align:left;
  font-size:14px;line-height:1.55}
.kr-rrt{display:inline}
/* Den gamla flex-varianten borttagen. Den låg SENARE i filen och vann över den
   nya, så emojin fortsatte sitta i en centrerad kolumn — och raden såg ut som
   en punktlista trots att stilen bytts. */
.kr-n2{font-weight:800;color:var(--ink)}
.kr-t.saknas{color:var(--faint);font-style:italic}
/* Nyss skriven post. Notisen säger bara ATT den finns; markeringen visar VAR. */
.kr-r.ny .kr-n::after{content:'NY';margin-left:7px;padding:1px 5px;border-radius:5px;
  background:var(--gold);color:#1c1f24;font-size:8.5px;font-weight:850;
  letter-spacing:.06em;vertical-align:1px}
.prog-b{display:flex;align-items:stretch;gap:3px;height:96px;margin:10px 0 4px}
.prog-c{flex:1 1 0;display:flex;flex-direction:column;min-width:0}
.prog-w{flex:1 1 auto;position:relative;border-top:0;border-bottom:0;
  background:linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat}
.prog-s{position:absolute;left:12%;right:12%;border-radius:3px}
.prog-s.upp{bottom:50%;background:var(--ok)}
.prog-s.ner{top:50%;background:var(--hot)}
.prog-d{flex:0 0 auto;text-align:center;font-size:9px;color:var(--faint);padding-top:3px}
/* Listen följer vinkällarens eget tema, inte dashboardens – annars möts två
   olika färgvärldar i samma bild. Värdena är hämtade ur vinkallare.html:s
   :root, och ligger som egna variabler så de går att rätta på ett ställe. */
.extfr{--vk-ink:#0F1214;--vk-stone:#191E21;--vk-line:#2F383D;--vk-chalk:#E8E4DA;
  position:fixed;inset:0;z-index:450;background:var(--vk-ink);display:none;flex-direction:column}
.extfr.open{display:flex}
.extfr-bar{flex:0 0 auto;position:relative;display:flex;align-items:center;
  padding:10px 14px;background:var(--vk-stone);border-bottom:1px solid var(--vk-line)}
/* Rubriken centreras mot LISTEN, inte mot ytan bredvid knappen – därav den
   absoluta placeringen. Den tar inte emot tryck, så knappen når hela vägen. */
.extfr-t{position:absolute;left:0;right:0;text-align:center;pointer-events:none;
  font-family:"Fraunces",Georgia,"Times New Roman",serif;font-weight:600;font-size:19px;

/* jämför-navknapp bredvid självförsörjning */

/* RATTAT v180: kioskslage gor .wrap till flex-kolumn, och da ligger vyerna som flexobjekt.
   Basregeln ovan ger dem margin:0 auto for att centrera 560px-spalten pa en bred skarm.
   I en flex-KOLUMN ar horisontalled tvarsaxeln, och auto-marginaler pa tvarsaxeln
   STANGER AV stretch - objektet krymper till sitt innehalls bredd och centreras.
   Kiosk lyfte max-width men aldrig marginalen, sa bada undersidorna krympte till
   innehallet i stallet for att fylla. Startsidan har ingen marginal och fyllde alltid.
   Att det syntes mest pa Jamfor ar en innehallsfraga: Insikters texter och tabeller ar
   breda nog att na kanten anda, Jamfors diagram och korta etiketter ar det inte. */
body.kiosk.cmp-open{height:auto;overflow:auto}
body.tabprev.cmp-open{overflow:auto}
.kiosk.cmp-open .wrap{height:auto;overflow:visible}
.kiosk.cmp-open .view{overflow:visible;height:auto;min-height:0}
.kiosk.cmp-open #view-jamfor,.kiosk.cmp-open #view-insikter{height:auto;overflow:visible}

#cmp-body>.panel,#ins-body>.panel,#vdr-body>.panel,#not-body>.panel{margin-bottom:var(--pg-gap-y);padding:clamp(16px,2vw,21px)}
.kiosk #cmp-body>.panel,.kiosk #ins-body>.panel,.kiosk #vdr-body>.panel,.kiosk #not-body>.panel{padding:11px 13px}
.kiosk #view-jamfor>.panel,.kiosk #view-insikter>.panel{padding:11px 13px}
#cmp-body>.panel:last-child,#ins-body>.panel:last-child,#vdr-body>.panel:last-child,#not-body>.panel:last-child{margin-bottom:0}

/* ===== v21: storlek, glow, status, väder, config ===== */
body{--solar:#ffc21f;--glowmul:1}
.seg.sol{background:#ffc21f}
/* storleksskalor */
.en-chip-ic{width:calc(var(--ch-ic-b,24px)*var(--ch-ic,1));height:calc(var(--ch-ic-b,24px)*var(--ch-ic,1))}
.en-chip-w{font-size:calc(var(--ch-v-b,18px)*var(--ch-v,1));color:var(--ink)}
.en-chip-l{font-size:calc(var(--ch-name-b,11px)*var(--ch-name,1))}
.en-chip-s{font-size:calc(var(--ch-desc-b,9px)*var(--ch-desc,1))}
.stat .stat-ic{width:calc(var(--tl-ic-b,26px)*var(--tl-ic,1));height:calc(var(--tl-ic-b,26px)*var(--tl-ic,1))}
.stat .v{font-size:calc(var(--tl-v-b,24px)*var(--tl-v,1))}
.stat .label{font-size:calc(var(--tl-name-b,10px)*var(--tl-name,1))}
.stat .meta{font-size:calc(var(--tl-desc-b,11px)*var(--tl-desc,1))}
/* glow: intensitet (gi=händelsestyrka) × global styrka (glowmul), skärpa styr suddighet/spridning */
.stat.is-on,.en-chip.is-on{box-shadow:0 0 calc((46px - 38px*var(--glowsharp,.75))*var(--gi,1)*var(--glowmul,1)) calc((9px - 3px*var(--glowsharp,.75))*var(--gi,1)*var(--glowmul,1)) var(--glow)}
/* glow */
.en-chip{position:relative;transition:all .16s,box-shadow .8s ease}
.chip-st{position:absolute;top:7px;right:9px;width:14px;height:14px;display:inline-flex}.chip-st .ic{width:100%;height:100%}
/* status i energi-rutan */
.en-status{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);flex:0 0 auto}
/* live-indikatorn i samma pill-stil som Insikter/Jämför */
.en-status-btn{position:relative;border:1px solid rgba(129,161,193,.28);background:rgba(129,161,193,.16);padding:6px 11px;border-radius:999px;gap:6px}
.en-hem{cursor:pointer}
.en-cmp.active{background:var(--blue);border-color:var(--blue);color:#0e1726}
.en-cmp.active .ic{color:#0e1726}
.en-status .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.en-status .dot.live{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.en-status .dot.dead,.en-status .dot.stale{background:var(--hot);box-shadow:0 0 0 3px color-mix(in srgb,var(--hot) 22%,transparent)}
.en-status .dot.dead~#status-text,.en-status .dot.stale~#status-text{color:var(--hot)}
.en-status .rel{font-size:10px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--faint)}
.en-status .rel.stale{color:var(--warm)}
/* väder centrerat över chipsen, väder & vind samma stil */
.wx-now{flex:1 1 0;justify-content:center}
.wx-hl{flex:1 1 0;justify-content:center}
.wx-windblock{flex:1 1 0;justify-content:center}
/* högre solgångsskala, ligger redan under energi */
.daystrip{padding:17px 22px}
.ds-track{height:6px}
.ds-sun{width:14px;height:14px}
/* jämn radmarginal mellan alla rutor (icke-kiosk) */
#view-flode>.panel,#view-flode>.grid,#view-flode>.warnwrap{margin-top:0;margin-bottom:var(--pg-gap-y)}
#view-flode>*:last-child{margin-bottom:0}
/* config-meny */
.cfg{display:flex;flex-direction:column}
.cfg-sec{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin:15px 2px 7px}
.cfg-sec:first-child{margin-top:0}
.cfg-btns{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.cfg-btns.synced{margin-bottom:9px}
.cfg-btns .cfg-opt{flex:1 1 auto}
.cfg-opt{flex:1 1 auto;min-width:74px;background:var(--inset);border:1px solid var(--line);border-radius:11px;padding:9px 10px;color:var(--ink);font:inherit;font-weight:650;font-size:12px;cursor:pointer}
.cfg-opt.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.cfg-prev{display:flex;justify-content:center;padding:14px;background:var(--inset);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.cfg-prev .en-chip{flex:0 0 140px;cursor:default}
.cfg-prev .stat{flex:0 0 180px;cursor:default}
.cfg-row{display:flex;align-items:center;gap:11px;padding:5px 2px;min-width:0}
/* Etiketten fick bara 92px och radbröts i tre rader på smala skärmar. Nu får
   den ta den plats som blir över, med 92px som minsta bredd. */
.cfg-row-l{flex:1 1 92px;min-width:0;font-size:12px;font-weight:600;color:var(--dim);overflow-wrap:anywhere}
.cfg-row input[type=range]{flex:1 1 auto;min-width:0;accent-color:var(--blue)}
.cfg-num{flex:0 0 40px;text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.cfg-sel{flex:1 1 auto;background:var(--inset);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink);font:inherit;font-size:12.5px}
.cfg-reset{margin-top:16px}
.cfg-savebtn{width:100%;background:var(--ok);color:#10331a;border:none;border-radius:11px;padding:11px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.cfg-savebtn:active{filter:brightness(.92)}
.cfg-savedmsg{font-size:10.5px;color:var(--faint);text-align:center;margin:7px 0 12px}
.learn-info{background:var(--inset);border:1px solid var(--line);border-radius:12px;padding:8px 11px}
.learn-row{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
.learn-row:last-child{border-bottom:none}
.learn-l{flex:0 0 84px;font-size:12px;font-weight:650}
.learn-b{flex:1 1 auto;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--blue)}
.learn-n{flex:0 0 auto;font-size:10px;color:var(--faint);font-weight:600}
.learn-hint{font-size:10px;color:var(--faint);margin:7px 2px 10px;line-height:1.35}
.te-numin{flex:1 1 auto;min-width:0;background:var(--inset);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--ink);font:inherit;font-size:14px}
#nightdim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 2s ease;z-index:300}
#nightclock{position:fixed;inset:0;background:#04040a;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:400;cursor:pointer}
#nightclock.on{display:flex}
#nc-time{font-size:min(26vw,150px);font-weight:750;letter-spacing:.02em;color:#3b3f54;font-variant-numeric:tabular-nums;line-height:1}

#nc-temp{font-size:19px;font-weight:700;color:#343850}
#nc-info{margin-top:22px;display:flex;flex-direction:column;gap:9px;width:min(88%,520px);max-width:88vw}

#nc-info .nc-warn,#nc-info .nc-ok{display:flex;align-items:center;justify-content:center;text-align:center;gap:10px;font-size:15px;font-weight:600;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:11px 14px;color:#5a5f78;width:100%;box-sizing:border-box}
#nc-info .nc-wi{width:19px;height:19px;flex:0 0 auto;display:inline-flex}#nc-info .nc-wi .ic,#nc-info .nc-ok .ic{width:19px;height:19px}
#nc-info .nc-warn.crit{color:#8a4a52}#nc-info .nc-warn.crit .nc-wi{color:#a05561}
#nc-info .nc-warn.warn{color:#84623a}#nc-info .nc-warn.warn .nc-wi{color:#9a7343}
#nc-info .nc-ok{color:#3f6a4a}#nc-info .nc-ok .ic{color:#3f6a4a}
.pbar{height:7px;border-radius:5px;background:var(--inset);border:1px solid var(--line);overflow:hidden;margin-top:11px}
.pbar i{display:block;height:100%;background:var(--cyan);border-radius:5px}
.dbars{display:flex;gap:9px;align-items:flex-end;justify-content:center;margin-top:14px}
.dbar{display:flex;flex-direction:column;align-items:center;gap:4px}
.dbar i{display:block;width:22px;border-radius:5px 5px 2px 2px}
.dbar-v{font-size:9px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
.dbar-d{font-size:9px;font-weight:600;color:var(--faint);text-transform:uppercase}
.dbar-cap{text-align:center;font-size:10px;color:var(--faint);margin-top:6px}
.pcurve{margin-bottom:12px}

/* ===== v33 ===== */
/* Rapportraden ska ALLTID vara exakt en rad hög. Två regler slog tidigare av
   avkortningen på telefonen (white-space:normal), så raden växte med textens
   längd och rutan hoppade i höjd när meddelandet byttes. Nu är radhöjden låst
   till en textrad – lång text slutar med … och hela texten läses i popupen. */
.warns.tick{display:flex;align-items:center;gap:10px;padding:11px 15px;min-height:44px;
  cursor:pointer;overflow:hidden}
.rep-list{display:flex;flex-direction:column;gap:0}
.rep-row{display:flex;align-items:flex-start;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line)}
.rep-row:last-child{border-bottom:0}
.rep-ic{width:18px;height:18px;flex:0 0 auto;margin-top:1px;display:inline-flex}.rep-ic .ic{width:100%;height:100%}
.rep-ic.acc-hot{color:var(--hot)}.rep-ic.acc-warm{color:var(--warm)}.rep-ic.acc-green{color:var(--ok)}
.rep-tx{flex:1 1 auto;font-size:13px;font-weight:600;line-height:1.35}
.rep-lv{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--dim);margin-top:1px}
.warns.tick .wi{width:17px;height:17px;flex:0 0 auto;display:inline-flex}.warns.tick .wi .ic{width:100%;height:100%}
.warns.tick .wt{flex:1 1 auto;min-width:0;font-size:12.5px;font-weight:600;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.warns.tick .lvl{font-size:11px;font-weight:700;color:var(--dim);flex:0 0 auto;white-space:nowrap}
.warns.tick .wdots{display:flex;gap:4px;flex:0 0 auto}
.warns.tick .wdots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.warns.tick .wdots i.on{background:var(--dim)}
.warns.tick.crit .wi{color:var(--hot)}.warns.tick.warnc .wi{color:var(--warm)}.warns.tick.okc .wi{color:var(--ok)}
body{background-image:radial-gradient(900px 420px at 50% -8%,rgba(129,161,193,.05),transparent)}
.kiosk .hd{margin-bottom:8px}
.kiosk .warns.tick{padding:8px 13px;min-height:36px}.kiosk .warns.tick .wt{font-size:11.5px}
/* viz i popuper */
.viz{margin:2px 0 14px}
.viz svg{width:100%;height:74px;display:block}
.viz-cap{text-align:center;font-size:10px;color:var(--faint);font-weight:600;margin-top:5px}
.viz-empty{padding:16px;text-align:center;font-size:11.5px;color:var(--faint);background:var(--inset);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
.te-glow.gr{flex:1}

.stat{display:flex;align-items:center;gap:14px;text-align:left;--ind:0}

/* Köpt/sålt-slide: spåret delas köpt|sålt vid proportionen; beloppen rider på var sin sida. */

/* flex-grow 1: krymper man spotpris eller köpt/sålt måste den frigjorda höjden
   tas upp av något, annars blir det en lucka mot skärmens underkant. Rapporten
   ligger sist och är den enda ruta som tål att bli högre utan att se konstig ut.
   --repgrow låter en styra det: 0 = som förr, ligger kvar i sin storlek. */
.kiosk .warnwrap{flex:var(--repgrow,1) 0 auto;min-height:0;display:flex;margin:0}
.kiosk .warns.tick{flex:1 1 auto;width:100%;align-items:center}

.kiosk #view-flode>.panel,.kiosk #view-flode>.grid{flex:0 0 auto}
/* Fast höjd, styrd av --ewh. Förut svalde den här raden allt överblivet
   utrymme, vilket gjorde det omöjligt att sätta dess höjd själv — och lämnade
   rapporten med en lucka under sig när spotpris krympts. Nu är rapporten den
   enda som växer. */
.kiosk .ew-row{flex:0 0 auto;min-height:0;margin:0;height:calc(var(--ewh,1)*38vh)}
.kiosk .ew-row>.panel{min-height:0;padding:11px 13px}

.kiosk .en-body{gap:10px}

.kiosk .wx{gap:9px}
.kiosk .wx-temp{font-size:25px}
.kiosk .wx-compass{width:64px;height:64px}.kiosk .wx-arrow{width:38px;height:38px}.kiosk .wx-hl-v{font-size:16px}
/* min-height är BORTTAGET. Det låste rutan vid 64 px och gjorde att inget hände
   när man drog storleken under noll — höjden räknades ut men golvet vann.
   Höjden styrs av --spbox, och overflow:hidden håller innehållet innanför. */
.kiosk .pband{flex:0 0 auto;padding:10px 15px 8px;margin:0;display:flex;flex-direction:column;justify-content:center}
.kiosk .pband-slim{padding:0 15px}

.kiosk .stat .v{margin:1px 0 0}.kiosk .stat-st{width:13px;height:13px}
/* Knapprutans innerkant är samma mått som mellanrummet mellan knapparna —
   7 px runt och 15 px emellan såg ut som ett misstag. */
.kiosk .controls{flex:0 0 auto;margin:0;padding:var(--pg-gap);gap:var(--pg-gap)}
/* Knapparna skalas med --knhojd (1 = som förut). Måtten står HÄR och inte i ett
   eget block högre upp: den här raden kommer sist i filen och hade annars
   skrivit över det. */
.kiosk .ctl{min-height:calc(48px*var(--knhojd,1));padding:calc(6px*var(--knhojd,1));gap:3px}

.kiosk .ctl-s{font-size:calc(8.5px*var(--knhojd,1)*var(--kntext,1))}
.kiosk .foot{margin-top:0}

/* ===== v48: telefon-/småskärmsanpassning (påverkar aldrig kiosk) ===== */
@media (max-width:600px){
  body:not(.kiosk){--tl-ic-b:24px;--tl-v-b:19px;--tl-name-b:10px;--tl-desc-b:10px;--ch-ic-b:22px;--ch-v-b:16px;--ch-name-b:10px;--ch-desc-b:9px}
  body:not(.kiosk) .wrap{padding:12px}
  body:not(.kiosk) .stat{padding:12px 13px;gap:11px}
  body:not(.kiosk) .stat-txt{min-width:0}
  body:not(.kiosk) .stat .label,body:not(.kiosk) .stat .v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body:not(.kiosk) .stat .meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  body:not(.kiosk) .en-chip{padding:10px 9px}
  body:not(.kiosk) .en-chip-txt{min-width:0}
  body:not(.kiosk) .en-chip-l,body:not(.kiosk) .en-chip-w,body:not(.kiosk) .en-chip-s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  body:not(.kiosk) .en-kw{font-size:23px}
  body:not(.kiosk) .en-top{flex-wrap:nowrap;justify-content:flex-end}
  body:not(.kiosk) .wx-temp{font-size:21px}
  body:not(.kiosk) .wx-hl-v{font-size:14px}
  body:not(.kiosk) .wx-now,body:not(.kiosk) .wx-windblock{gap:8px}
  body:not(.kiosk) .wx-hl{padding:0 8px}
}
/* Här stod tidigare att .st2 blir EN kolumn under 410px. Pixeln har 412px och
   klarade sig precis; en telefon med 360px – eller med förstorad skärmtext, som
   krymper CSS-bredden – hamnade under och fick rutorna staplade på höjden.
   Två kolumner ryms gott och väl även på 320px, så gränsen är borttagen. */

/* ===== Mobil: tightare, tydligare rutor och flikar ===== */
@media (max-width:600px){
  /* --- Topbar: allt får plats på en rad, inget kapas ---
     Hem visas som enbart husikon och live-läget som en enda prick. Det frigör
     precis den bredd som behövdes för att slippa både skroll och avklippning. */
  body:not(.kiosk) .statusbar{padding:10px 12px;align-items:center}
  body:not(.kiosk) .statusbar .en-top{flex-wrap:nowrap;overflow:visible;align-items:center;gap:6px;width:100%}
  body:not(.kiosk) .en-cmp{flex:0 1 auto;min-width:0;margin-left:0;padding:0 11px;font-size:12px;gap:5px;
    height:34px;box-sizing:border-box;align-items:center;justify-content:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body:not(.kiosk) .en-cmp-ic{width:15px;height:15px;flex:0 0 auto}
  /* Hem: bara huset. font-size:0 döljer texten, ikonen är en SVG och påverkas inte. */
  /* Huset ensamt: nollställ gapet så ikonen hamnar mitt i knappen */
  body:not(.kiosk) .en-hem{font-size:0;padding:0;gap:0;flex:0 0 auto;width:38px;height:34px;
    display:inline-flex;align-items:center;justify-content:center}
  body:not(.kiosk) .en-hem .en-cmp-ic{width:18px;height:18px;margin:0}
  /* Live-läget: bara en prick, grön när det är live och röd/gul annars */
  body:not(.kiosk) .statusbar .en-notis{margin-left:auto!important}
  body:not(.kiosk) .statusbar .en-status{margin-left:0!important;flex:0 0 auto;padding:0;border:0;background:none;
    width:24px;height:34px;display:inline-flex;align-items:center;justify-content:center}
  body:not(.kiosk) .statusbar .en-status>button,
  body:not(.kiosk) .statusbar .en-status>span:not(.dot){display:none!important}
  body:not(.kiosk) .statusbar .en-status .dot{width:13px;height:13px;border-radius:50%;margin:0;flex:0 0 auto;
    background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
  body:not(.kiosk) .statusbar .en-status .dot.stale{background:var(--warm);box-shadow:0 0 0 3px color-mix(in srgb,var(--warm) 22%,transparent)}
  body:not(.kiosk) .statusbar .en-status .dot.dead{background:var(--hot);box-shadow:0 0 0 3px color-mix(in srgb,var(--hot) 22%,transparent)}

  /* Statusrutorna (Sol/Batteri/Elnät + luft/regn m.fl.): stående layout, inget kapat */
  /* Rubriken ligger på samma rad som ikonen, värdet under i hela textkolumnen */
  body:not(.kiosk) .stat{flex-direction:row;align-items:flex-start;gap:8px;padding:12px 11px;text-align:left}
  body:not(.kiosk) .stat .stat-ic{width:19px;height:19px;flex:0 0 auto;margin-top:0}
  body:not(.kiosk) .stat-txt{flex:1 1 auto;min-width:0;gap:1px}
  body:not(.kiosk) .stat .label{font-size:10px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body:not(.kiosk) .stat .v{font-size:19px;white-space:nowrap;overflow:visible}
  body:not(.kiosk) .stat .v small{font-size:11px}
  body:not(.kiosk) .stat .meta{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body:not(.kiosk) .stat-st{position:absolute;top:10px;right:10px;margin:0;width:15px;height:15px}



  /* --- Väderkortet: text ska radbryta, inte kapas --- */
  body:not(.kiosk) .wx2-now,body:not(.kiosk) .wx2-wind{min-width:0}
  body:not(.kiosk) .wx2-line{flex-wrap:wrap;row-gap:1px;align-items:baseline}
  body:not(.kiosk) .wx2-sub,body:not(.kiosk) .wx2-wl{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.25}
  body:not(.kiosk) .wx2-feels{flex-wrap:wrap;min-width:0}
  body:not(.kiosk) .wx2-ic{flex:0 0 auto}
  /* --- Knapparna: namnet får två rader i stället för att spilla ut --- */
  body:not(.kiosk) .ctl{min-width:0;overflow:hidden;padding:12px 6px;gap:6px;min-height:78px}
  /* Knappen krymper med hur många som delar raden – se --cs nedan. */
  body:not(.kiosk) .ctl-row .ctl{padding:calc(12px*var(--cs,1)) calc(6px*var(--cs,1));
    gap:calc(6px*var(--cs,1));min-height:calc(78px*var(--cs,1));border-radius:calc(18px*var(--cs,1))}
  body:not(.kiosk) .ctl-row .ctl-ic{width:calc(24px*var(--cs,1));height:calc(24px*var(--cs,1))}

  /* --- Startsidan: text ska aldrig spilla ut ur sin ruta --- */
  /* Effekt, självförsörjning och dom ryms på en rad tack vare den korta domtexten */
  body:not(.kiosk) .en-hero{flex-wrap:nowrap;gap:8px;align-items:center}

/* ===== App-känsla i Chrome (PWA/standalone) ===== */
html{overscroll-behavior:none}                         /* ingen gummibands-studs / pull-to-refresh */
body{overscroll-behavior-y:contain;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
/* Säkra marginaler runt notch/hörn när appen körs helskärm */
/* Säkra marginaler flyttade längst ned och scopade till telefon – de får aldrig röra platt-/kioskläget. */
/* Standalone: appen är installerad och startad utan webbläsar-UI */
@media (display-mode:standalone){
  body{--app-standalone:1}
  /* lite extra luft upptill mot statusfältet, och dölj ev. "öppna i webbläsare"-hjälptext */
  body.mobile .statusbar{padding-top:max(10px,env(safe-area-inset-top))}
  .browser-only{display:none!important}
}
/* Text ska fortfarande gå att markera i fält och dialoger */
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* Smal skärm: dra ihop mellanrum och innerkanter i stället för att dölja
   knappnamnen. Uppmätt på riktigt — med de här måtten ryms hela raden med text
   ner till 360 px, och namnen är mer värda än några pixlars luft. */
@media (max-width:480px){
  .en-top,.statusbar .en-top,body.mobile .en-top{gap:5px}
  .en-top .en-cmp{padding:6px 9px;gap:4px;font-size:11.5px}
  .en-top .en-status-btn{padding:6px 9px;gap:5px}
  .en-top #status-text{letter-spacing:.03em}
}
/* Under 380 px räcker inte utrymmet ens med minsta luft. Då klipps texten
   INNE i sin egen pill i stället för att lägga sig över grannen — det såg ut
   som att knapparna satt i varandra. */
@media (max-width:380px){
  .en-top .en-cmp{overflow:hidden;text-overflow:ellipsis}
  .en-top,.statusbar .en-top,body.mobile .en-top{gap:4px}
  .en-top .en-cmp{padding:5px 7px;gap:3px;font-size:11px}
  .en-top .en-cmp-ic{width:13px;height:13px}
  .en-top .en-status-btn{padding:5px 8px}
}
</style>

function solar(date,lat,lon,tzMin){const rad=Math.PI/180,deg=180/Math.PI;
  const start=new Date(date.getFullYear(),0,0),day=Math.floor((date-start)/86400000);
  const hours=date.getHours()+date.getMinutes()/60+date.getSeconds()/3600;
  const g=(2*Math.PI/365)*(day-1+(hours-12)/24);
  const eqt=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const decl=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const tst=hours*60+eqt+4*lon-tzMin,ha=(tst/4)-180;
  const cosZ=Math.sin(lat*rad)*Math.sin(decl)+Math.cos(lat*rad)*Math.cos(decl)*Math.cos(ha*rad);
  const elevation=90-Math.acos(Math.min(1,Math.max(-1,cosZ)))*deg;
  const cosH=(Math.cos(90.833*rad)/(Math.cos(lat*rad)*Math.cos(decl)))-Math.tan(lat*rad)*Math.tan(decl);
  let sunrise=null,sunset=null;if(cosH>=-1&&cosH<=1){const h0=Math.acos(cosH)*deg;sunrise=(720-4*(lon+h0)-eqt+tzMin)/60;sunset=(720-4*(lon-h0)-eqt+tzMin)/60;}
  const azimuth=(Math.atan2(Math.sin(ha*rad),Math.cos(ha*rad)*Math.sin(lat*rad)-Math.tan(decl)*Math.cos(lat*rad))*deg+180+360)%360;
  return{elevation,azimuth,sunrise,sunset};}

/* ===== Vilka enheter ingar i ett mood? =====

   enhets-id:na grävs fram ur den.

   Formatet pa mood-objektet ar inte dokumenterat och har sett olika ut mellan
   Homey-versioner (ibland {devices:{id:{...}}}, ibland en lista med device-falt).
   I stallet for att gissa struktur gar vi igenom hela objektet och plockar ut
   allt som BADE ser ut som ett Homey-id OCH finns bland de inlasta enheterna.
   Det tal att formatet andras. */
var MOOD_DEV_KEY='mooddev_v1', _moodDev=null, _moodDevBusy={}, _moodDevFail={};
var UUID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function moodDevAll(){
  if(_moodDev)return _moodDev;

/* Djupsokning: samlar id:n som finns i DATA, oavsett var i objektet de star. */
function moodDevScan(o,ut,djup){
  if(!o||djup>6)return ut;
  if(typeof o==='string'){if(UUID_RE.test(o)&&DATA[o]&&ut.indexOf(o)<0)ut.push(o);return ut;}
  if(Array.isArray(o)){for(var i=0;i<o.length;i++)moodDevScan(o[i],ut,djup+1);return ut;}
  if(typeof o==='object'){
    for(var k in o){

      moodDevScan(o[k],ut,djup+1);}}
  return ut;}
async function moodDevFetch(id){
  if(!id||_moodDevBusy[id])return null;
  if(_moodDevFail[id]&&Date.now()-_moodDevFail[id]<10*60000)return null;
  if(!apiBase()||!CONFIG.TOKEN||CONFIG.TOKEN.indexOf('DIN_API')>=0)return null;
  _moodDevBusy[id]=true;
  try{
    var tk=CONFIG.WRITE_TOKEN||CONFIG.TOKEN, ut=[];
    /* Forst hela listan – den innehaller oftast allt som behovs. Racker den inte
       till hamtas det enskilda moodet, som brukar vara mer utforligt. */
    for(var steg=0;steg<2&&!ut.length;steg++){
      var url=apiBase()+'/api/manager/moods/mood/'+(steg?encodeURIComponent(id):'');
      var t=withTimeout(7000);

        var arr=Array.isArray(j)?j:Object.values(j||{});

        if(!mo&&j&&j[id])mo=j[id];}

    moodDevSave();

    if(!ut.length)_moodDevFail[id]=Date.now();

  }catch(e){_moodDevBusy[id]=false;_moodDevFail[id]=Date.now();return null;}}

   Ambilight räknas ALDRIG med – den lyser ofta när huset i övrigt är släckt. */
var MOOD_ZONES=['vardagsrum','kontor','uterum'];

function moodZoneIds(){
  var vill={},har=false;

    if(MOOD_ZONES.indexOf(((Z.name||'')+'').toLowerCase().trim())>=0)vill[z]=1;}
  /* Underzoner ärver: en lampa i "Vardagsrum > Läshörna" hör till vardagsrummet.
     Loopas tills inget nytt tillkommer, med tak så en trasig zonkedja inte hänger sig. */
  for(var varv=0;varv<8;varv++){var nytt=false;
    for(var z2 in ZONES){var P=ZONES[z2]&&ZONES[z2].parent;

  for(const p of a){if(p.t>=t0&&p.v!=null&&isFinite(p.v)){if(mn==null||p.v<mn)mn=p.v;if(mx==null||p.v>mx)mx=p.v;}}

  return {min:mn,max:mx};}
/* Startsidans Max vind / Max by: högsta värde dashboarden SETT idag. Nollställs

function windExtremes(ws,gs){const day=dayKey();let o={};try{o=JSON.parse(localStorage.getItem('windEx_v1')||'{}');}catch(e){}
  if(o.day!==day)o={day:day,w:null,g:null,wt:null,gt:null};

/* ===== Dygnets vindtoppar direkt ur Insights =====

var WIND_INS_KEY='windins_v1';
var _windSeries=null, _windInsAt=0, _windInsBusy=false, _windInsFel=null;

/* ===== Produktionsprognos =====

   urvalet lutar mot soliga helger. Da ser prognosen battre ut an den ar.

   prognos ar samre an ingen. */
var _prog=null,_progAt=0,_progFel=null;
async function progHamta(force){

function progIdag(){

/* Prognoskurvan som svag yta bakom dagens faktiska. Timvarden mot en
   effektkurva: prognosen ar Wh per timme, den faktiska ar W vid en tidpunkt —
   over en timme ar de samma tal, sa de gar att lagga i samma diagram. */
function progKurvaSVG(){
  var e=progIdag();if(!e||!e.timmar||e.timmar.length!==24)return '';
  var W=1000,H=132,pT=10,pB=18;
  var fakt=(HIST['solar']||[]).filter(function(p){return p&&p.t>=dayStart()&&p.v!=null&&isFinite(p.v);});
  var max=Math.max.apply(null,e.timmar.concat(fakt.map(function(p){return p.v;})).concat([1]));
  max=max*1.1;
  var t0=dayStart();
  var X=function(ms){return ((ms-t0)/86400000)*W;};
  var Y=function(v){return pT+(1-Math.max(0,Math.min(1,v/max)))*(H-pT-pB);};
  /* Prognosen ritas som en yta: den ar en uppskattning, inte en matning, och
     ska inte se lika bestamd ut som den faktiska kurvan. */
  var d='M0 '+Y(0).toFixed(1);
  for(var h=0;h<24;h++)d+=' L'+X(t0+(h+0.5)*3600000).toFixed(1)+' '+Y(e.timmar[h]).toFixed(1);
  d+=' L'+W+' '+Y(0).toFixed(1)+' L'+W+' '+(H-pB)+' L0 '+(H-pB)+' Z';
  var b='<path d="'+d+'" fill="var(--gold)" opacity=".16"/>';
  for(var g=0;g<=2;g++){var gy=pT+(H-pT-pB)*g/2;
    b+='<line class="grid-l" x1="0" y1="'+gy.toFixed(1)+'" x2="'+W+'" y2="'+gy.toFixed(1)+'"/>';}
  if(fakt.length>1){
    var fd='';
    for(var i=0;i<fakt.length;i++)fd+=(i?'L':'M')+X(fakt[i].t).toFixed(1)+' '+Y(fakt[i].v).toFixed(1)+' ';
    b+='<path d="'+fd+'" fill="none" stroke="var(--solar)" stroke-width="2.4" '
      +'stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
  }
  return '<div class="chart-wrap" style="margin-top:8px">'
    +'<div class="chart-y top">'+num(max/1000,1)+' kW</div><div class="chart-y bot">0</div>'
    +'<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" '
    +'aria-label="Prognos och faktisk produktion idag">'+b+'</svg>'
    +'<div class="chart-x l">00</div><div class="chart-x r">24</div></div>'
    +'<div class="isub" style="margin-top:5px;opacity:.7">'
    +'<span style="color:var(--gold)">▬</span> prognos &nbsp; '
    +'<span style="color:var(--solar)">▬</span> faktiskt</div>';}

/* Staplar for de senaste 14 dygnen. Avvikelsen i procent sager mer an kWh:
   ett fel pa 5 kWh betyder helt olika saker i juni och i december. */
function progStaplarHTML(){
  if(!_prog||!_prog.dagar)return '';
  var k=Object.keys(_prog.dagar).sort().filter(function(d){
    var e=_prog.dagar[d];return e&&e.summa_prognos!=null&&e.summa_utfall!=null;});
  k=k.slice(-14);
  if(!k.length)return '';
  var maxA=1;
  k.forEach(function(d){var a=_prog.dagar[d].avvikelse;
    if(a!=null&&Math.abs(a)>maxA)maxA=Math.abs(a);});
  maxA=Math.min(100,Math.max(20,maxA));
  var h='<div class="prog-b">';
  k.forEach(function(d){
    var e=_prog.dagar[d],a=e.avvikelse;
    var hpct=(a==null)?0:Math.min(50,Math.abs(a)/maxA*50);
    var upp=(a!=null&&a>=0);
    h+='<div class="prog-c" title="'+esc(d)+'">'
      +'<div class="prog-w">'
      +'<div class="prog-s'+(upp?' upp':' ner')+'" style="height:'+hpct.toFixed(1)+'%"></div>'
      +'</div><div class="prog-d">'+esc(d.slice(8))+'</div></div>';
  });
  h+='</div>';
  return h;}

function progAvsnitt(){

        +dRow('Systematiskt',(m.bias>=0?'+':'')+num(m.bias/1000,1)+' kWh'
          +(m.biasPct!=null?(' · '+(m.biasPct>=0?'+':'')+num(m.biasPct,0)+' %'):''));
      h+='<div class="isub" style="margin-top:6px;opacity:.65">Medelfel är hur mycket prognosen '
        +'missar i genomsnitt, oavsett håll. Systematiskt visar om den genomgående ligger för '
        +'högt eller lågt — är det tydligt åt ett håll ska molnkoefficienten k justeras i appens '
        +'inställningar. Nu: k='+num(_prog.k,2)+'.</div>';
    }

async function appState(force){

/* Poolens siffror hör inte ihop med vindens. Låg de i samma funktion föll de

function appStatePool(st){

async function windAppFetch(){

var _appPool=null,_appPoolV=null;
async function windInsFetch(force){
  if(_windInsBusy)return false;
  if(!force&&_windInsAt&&Date.now()-_windInsAt<5*60000)return false;
  if(!windInsKan()){_windInsFel='ingen direktkoppling till Homey';return false;}
  _windInsBusy=true;_windInsAt=Date.now();
  /* Appen först. Lyckas den behöver vi inte läsa Insights själva. */
  try{ if(await windAppFetch()){_windInsFel=null;_windInsBusy=false;return true;} }catch(e){}
  try{
    var logs=await homeyGet('/api/manager/insights/log/');
    if(!logs)throw new Error('Insights svarade inte');
    var vill={wind:[DEV.windMs,['measure_wind_strength']],
              gust:[DEV.windMs,['measure_gust_strength']],
              winddir:[DEV.windNet,['measure_wind_angle']]};
    var ny={},hittade=0;
    for(var k in vill){
      var lg=findLog(logs,vill[k][0],vill[k][1]); if(!lg)continue;
      var e=await homeyGet('/api/manager/insights/log/'+lg.uri+'/'+lg.id+'/entry?resolution=today');
      var p=parseEntries(e);
      if(p.length){ny[k]=p.sort(function(a,b){return a.t-b.t;});hittade++;}}
    if(!hittade)throw new Error('hittade ingen logg för '+((DATA[DEV.windMs]||{}).name||'vindmätaren'));
    _windSeries=ny;_windInsFel=null;

       hamtas anda om vid nasta oppning – men topparna ska synas direkt. */

    ['wind','gust'].forEach(function(k2){spara[k2]=windMaxFrom(k2,dayStart());});
    try{localStorage.setItem(WIND_INS_KEY,JSON.stringify(spara));}catch(e2){}

/* Dygnets matpunkter: Insights sa langt den racker, egna matningar darefter.
   Ingen dubblering – HIST anvands bara for tiden EFTER sista Insights-punkten. */
function windPoints(k){
  var t0=dayStart(), ins=(_windSeries&&_windSeries[k])||[], ut=[];
  for(var i=0;i<ins.length;i++){var p=ins[i];
    if(p&&p.t>=t0&&p.v!=null&&isFinite(p.v))ut.push(p);}
  var senast=ut.length?ut[ut.length-1].t:0;
  var h=HIST[k]||[];
  for(var j=0;j<h.length;j++){var q=h[j];
    if(q&&q.t>=t0&&q.t>senast&&q.v!=null&&isFinite(q.v))ut.push(q);}
  ut.sort(function(a,b){return a.t-b.t;});
  return ut;}
/* Högsta värde från en given tidpunkt, ur dygnets mätpunkter. */
function windMaxFrom(k,t0){
  const a=windPoints(k);
  let v=null,t=null;
  for(let i=0;i<a.length;i++){const p=a[i];
    if(p.t<t0)continue;
    if(v==null||p.v>v){v=p.v;t=p.t;}}
  return {v:v,t:t};}
var WIND_NU_H=3;                                  /* "nu" = senaste tre timmarna */
function windNowMax(k){return windMaxFrom(k,Date.now()-WIND_NU_H*3600000);}
function windDayMax(k){
  const m=windMaxFrom(k,dayStart()), c=windInsCache();
  /* Direkt efter en omladdning, innan Insights hunnit svara, kan den sparade
     toppen vara högre än något vi har i minnet. Då gäller den. */
  if(c&&c[k]&&c[k].v!=null&&(m.v==null||c[k].v>m.v))return c[k];
  return m;}
/* Tidpunkt för ett sparat toppvärde. Data från tidigare versioner saknar
   tidsstämpel – då letas värdet upp i dygnets mätserie i stället. */
function windExWhen(t,v,k){
  if(t)return t;
  if(v==null)return null;
  const a=HIST[k]||[], t0=dayStart();
  for(let i=0;i<a.length;i++)if(a[i].t>=t0&&Math.abs(a[i].v-v)<0.05)return a[i].t;
  return null;}
function windWhenTxt(t){return t?hhmm(new Date(t)):'okänt klockslag';}
/* ===== Vindgrafen i popupen =====
   Vind och byvind delar vansteraxeln (m/s). Riktningen far en EGEN hogeraxel
   (0-360 grader) och ritas streckad. Skalorna har inget med varandra att gora:
   lades riktningen pa samma axel skulle dess varden platta ut hastighets-
   kurvorna helt, och grafen bli oanvandbar. Allt ligger anda i samma graf. */
var WIND_SER=[['wind','Vind','var(--cyan)','ms'],
              ['gust','Byvind','var(--gold)','ms'],
              ['winddir','Riktning','var(--ok)','deg']];
function windSerOn(){
  var v=CFG&&CFG.windSer;
  if(!Array.isArray(v))return ['wind','gust'];
  var ut=v.filter(function(k){return WIND_SER.some(function(s){return s[0]===k;});});
  return ut;}
function windSerTog(k){
  var pa=windSerOn().slice(), i=pa.indexOf(k);
  if(i<0)pa.push(k); else pa.splice(i,1);
  CFG.windSer=pa;saveCfg();
  var e=document.getElementById('wind-chart');
  if(e)e.innerHTML=windChartHTML();}
function windChartHTML(){
  var t0=dayStart(), pa=windSerOn(), W=1000,H=170,pT=12,pB=22;
  var ser=[];
  for(var i=0;i<WIND_SER.length;i++){var S=WIND_SER[i];
    if(pa.indexOf(S[0])<0)continue;
    var p=windPoints(S[0]);
    if(p.length>1)ser.push({k:S[0],namn:S[1],farg:S[2],axel:S[3],p:p});}
  var chips='<div class="wind-chips">';
  for(var q=0;q<WIND_SER.length;q++){var C=WIND_SER[q],av=(pa.indexOf(C[0])>=0);
    chips+='<button class="wxm-b'+(av?' on':'')+'" onclick="windSerTog(\''+C[0]+'\')">'
      +'<i style="background:'+C[2]+'"></i>'+C[1]+'</button>';}
  chips+='</div>';
  if(!ser.length)return chips+'<div class="chart-empty">'
    +(pa.length?'samlar data… grafen fylls på medan sidan är öppen':'välj vad som ska visas')+'</div>';
  var tMin=t0, tMax=Date.now();
  ser.forEach(function(s){var l=s.p[s.p.length-1].t;if(l>tMax)tMax=l;});
  var msMax=0,harMs=false,harDeg=false;
  ser.forEach(function(s){
    if(s.axel==='deg'){harDeg=true;return;}
    harMs=true;s.p.forEach(function(x){if(x.v>msMax)msMax=x.v;});});
  msMax=Math.max(1,msMax*1.12);
  var X=function(t){return ((t-tMin)/((tMax-tMin)||1))*W;};
  var Y=function(v,ax){var f=(ax==='deg')?(v/360):(v/msMax);
    return pT+(1-Math.max(0,Math.min(1,f)))*(H-pT-pB);};
  var b='';
  for(var g=0;g<=2;g++){var gy=pT+(H-pT-pB)*g/2;
    b+='<line class="grid-l" x1="0" y1="'+gy.toFixed(1)+'" x2="'+W+'" y2="'+gy.toFixed(1)+'"/>';}
  ser.forEach(function(s){
    var d='';
    for(var j=0;j<s.p.length;j++)d+=(j?'L':'M')+X(s.p[j].t).toFixed(1)+' '+Y(s.p[j].v,s.axel).toFixed(1)+' ';
    b+='<path d="'+d+'" fill="none" stroke="'+s.farg+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"'
      +(s.axel==='deg'?' stroke-dasharray="5 4" opacity=".85"':'')+'/>';
    var sist=s.p[s.p.length-1];
    b+='<circle cx="'+X(sist.t).toFixed(1)+'" cy="'+Y(sist.v,s.axel).toFixed(1)+'" r="3" fill="'+s.farg+'"/>';});
  return chips+'<div class="chart-wrap">'
    +(harMs?'<div class="chart-y top">'+num(msMax,0)+' m/s</div><div class="chart-y bot">0</div>':'')
    +(harDeg?'<div class="chart-y top r">360°</div><div class="chart-y bot r">0°</div>':'')
    +'<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Vind idag">'+b+'</svg>'
    +'<div class="chart-x l">'+hhmm(new Date(tMin))+'</div>'
    +'<div class="chart-x r">'+hhmm(new Date(tMax))+'</div></div>';}

function gridPowerSVG(pts){
  const now=Date.now();
  if(!pts||pts.length<3)return '<div class="viz-empty">Samlar in data… grafen fylls på efter hand.</div>';
  const cut=now-24*3600000;let seg=pts.filter(p=>p.t>=cut);if(seg.length<3)seg=pts.slice(-48);
  const P=PAL[curTheme]||PAL.dark, BLA=P.blue||'#81a1c1', GRO=P.green||'#a3be8c';
  const W2=300,H2=74,pad=5;
  const t0=seg[0].t,t1=seg[seg.length-1].t||now,tr=(t1-t0)||1;
  // symmetrisk y-skala runt noll så nollinjen hamnar där den ska
  const ys=seg.map(p=>p.v),ylo=Math.min.apply(null,ys),yhi=Math.max.apply(null,ys);
  const amax=Math.max(Math.abs(ylo),Math.abs(yhi),1), y0=-amax, y1v=amax, yr=(y1v-y0)||1;
  const X=t=>pad+(t-t0)/tr*(W2-2*pad), Y=v=>H2-pad-(v-y0)/yr*(H2-2*pad);
  const zeroY=Y(0);
  // bygg en punktlista med insatta nollgenomgångar
  const pl=[];
  for(let i=0;i<seg.length;i++){
    const cur=seg[i]; pl.push({t:cur.t,v:cur.v});
    const nx=seg[i+1];
    if(nx&&((cur.v<0&&nx.v>0)||(cur.v>0&&nx.v<0))){
      const f=Math.abs(cur.v)/(Math.abs(cur.v)+Math.abs(nx.v));
      pl.push({t:cur.t+(nx.t-cur.t)*f, v:0, cross:true});
    }
  }
  // dela i färgade sträckor: en sträcka är antingen köp (>=0) eller sälj (<0)
  let paths=[], curPts=[], curSign=null;
  const flush=()=>{ if(curPts.length>=2){const col=curSign>=0?BLA:GRO;
    paths.push('<path d="'+smoothPath(curPts)+'" fill="none" stroke="'+col+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>');} };
  for(let i=0;i<pl.length;i++){
    const pt=pl[i], xy=[X(pt.t),Y(pt.v)];
    const sign=pt.v>0?1:pt.v<0?-1:(curSign==null?1:curSign);
    if(curSign==null){curSign=sign;curPts=[xy];}
    else if(pt.cross){curPts.push(xy);flush();curPts=[xy];curSign=(pl[i+1]&&pl[i+1].v<0)?-1:1;}
    else if(sign!==curSign&&pt.v!==0){curPts.push(xy);flush();curPts=[xy];curSign=sign;}
    else curPts.push(xy);
  }
  flush();
  // fyllning per sträcka mot nollinjen
  let fills=[]; let fPts=[], fSign=null;
  const flushF=()=>{ if(fPts.length>=2){const col=fSign>=0?BLA:GRO;const g=areaGrad(col,0.22);
    const area=smoothPath(fPts)+' L'+fPts[fPts.length-1][0].toFixed(1)+' '+zeroY.toFixed(1)+' L'+fPts[0][0].toFixed(1)+' '+zeroY.toFixed(1)+' Z';
    fills.push('<defs>'+g.def+'</defs><path d="'+area+'" fill="url(#'+g.id+')"/>');} };
  for(let i=0;i<pl.length;i++){
    const pt=pl[i], xy=[X(pt.t),Y(pt.v)];
    const sign=pt.v>0?1:pt.v<0?-1:(fSign==null?1:fSign);
    if(fSign==null){fSign=sign;fPts=[xy];}
    else if(pt.cross){fPts.push(xy);flushF();fPts=[xy];fSign=(pl[i+1]&&pl[i+1].v<0)?-1:1;}
    else if(sign!==fSign&&pt.v!==0){fPts.push(xy);flushF();fPts=[xy];fSign=sign;}
    else fPts.push(xy);
  }
  flushF();
  const spanH=Math.round(tr/3600000);
  const pkKop=Math.max(0,yhi), pkSal=Math.max(0,-ylo);
  return '<div class="viz"><svg viewBox="0 0 '+W2+' '+H2+'" preserveAspectRatio="none">'
    +fills.join('')
    +'<line x1="'+pad+'" y1="'+zeroY.toFixed(1)+'" x2="'+(W2-pad)+'" y2="'+zeroY.toFixed(1)+'" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3"/>'
    +paths.join('')
    +'</svg><div class="viz-cap"><span style="color:'+BLA+'">köper</span> · <span style="color:'+GRO+'">säljer</span> · senaste '+(spanH>=1?spanH+' h':'stunden')
    +(pkKop>0?' · max köp '+W(pkKop):'')+(pkSal>0?' · max sälj '+W(pkSal):'')+'</div></div>';}

  const P=PAL[curTheme]||PAL.dark,col=P[colKey]||P.blue,W2=300,H2=74,pad=5;

   v198. Mixen ar sol / batteri / kopt av forbrukningen. Fram till nu byggdes den bara
   ur SEED_MONTHS (manadsvis), sa "idag" och "denna manad hittills" gick inte. Men
   Insights har allt som behovs, timme for timme:
     solar meter_power.day/month/year  - kumulativ solproduktion
     pulse meter_power.imported        - kumulativ kopt
     pulse meter_power.exported        - kumulativ salt (sol som INTE anvandes hemma)
     battery measure_power             - batteriets EFFEKT (+ laddar, - urladdar)
   Ur de kumulativa matarna: differens mellan tva tidpunkter = energi under perioden.
   Sol egenanvand = solproduktion - export. Kopt = importdifferensen. Bada exakta.
   BATTERIET ar undantaget och det ska sagas rakt ut: det har ingen kumulativ kWh-
   matare, bara momentan effekt. Urladdad energi maste darfor INTEGRERAS ur effekt-

/* namn -> vad rutan faktiskt visar. Klartext, inget "Nu"/"Totalt"-gissande. */
var MIX_MODES=[['day','I dag'],['month','Denna månad'],['months','Året per månad'],['year','Hela år']];
var AOA_MODES=[['wholemonth','Färdiga månader'],['ytd','I år hittills'],['total','Hela år']];
var KR_MODES=[['day','I dag'],['week','Denna vecka'],['month','Denna månad'],['year','I år']];
/* v196: fyra globala knappar i stallet for tre. De styr BADE arsjamforelserna och
   kronorutan - forut hade kronorutan en egen rad, och tva periodrader pa samma sida
   gick inte att lasa ihop.
   Ingen knapp passar bada rutorna perfekt, och det ska sagas rakt ut i stallet for
   att doljas: DAG finns inte i arsdatan (SEED_MONTHS ar manadsvis), och NU ar samma
   sak som AR for kronorutan (dess "i ar" raknas redan fram till i dag). Bada fallen
   skriver ut en rad i den ruta det galler. */
/* Ar-mot-ar-lagena mappas till metricDiff-strangarna. 'ytd' = year to date. */
function aoaDiffMode(){return _aoaMode==='total'?'total':(_aoaMode==='ytd'?'period':'wholemonth');}
function cmpAr(){return aoaDiffMode();}
function cmpKr(){return _krMode;}
/* mixens interna lagen: day, month(=denna manad hittills), months(=aret per manad), year */
function cmpMix(){return {day:'dayLive',month:'monthTD',months:'months',year:'year'}[_mixMode]||'monthTD';}
/* Perioden ar global for jamforsidan sedan v194. Forut satt knapparna nere i "Ar mot
   ar" och styrde bara den rutan - Energimix visade alltid helar. Tva rutor pa samma
   sida med olika period gar inte att lasa ihop. */
function mixModeSet(m){_mixMode=m;try{localStorage.setItem('mixmode_v2',m);}catch(e){}renderCompare();}
function aoaModeSet(m){_aoaMode=m;try{localStorage.setItem('aoamode_v2',m);}catch(e){}renderCompare();}
function krModeSet(m){_krMode=m;try{localStorage.setItem('krmode_v2',m);}catch(e){}renderCompare();}
try{var _lm;
  /* v203: Denna månad / Färdiga månader ar forvalt. Nycklarna bumpade till _v2 sa
     ett gammalt sparat val (t.ex. Hela år) inte langre overrider forvalet - forst
     nar du sjalv byter sparas det igen. */
  if((_lm=localStorage.getItem('mixmode_v2'))&&MIX_MODES.some(function(x){return x[0]===_lm;}))_mixMode=_lm;
  if((_lm=localStorage.getItem('aoamode_v2'))&&AOA_MODES.some(function(x){return x[0]===_lm;}))_aoaMode=_lm;
  if((_lm=localStorage.getItem('krmode_v2'))&&KR_MODES.some(function(x){return x[0]===_lm;}))_krMode=_lm;
}catch(e){}

function donutSVG(segs,total,yearLbl,partial){
  var r=38,cx=50,cy=50,sw=13,gap=2.2;
  var tot=total||segs.reduce(function(a,s){return a+(s.val||0);},0)||1;
  function polar(ang){var a=(ang-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
  var body='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--inset)" stroke-width="'+sw+'"/>';
  var ang=0;
  segs.forEach(function(s){var frac=(s.val||0)/tot;if(frac<=0)return;var a0=ang*360,a1=(ang+frac)*360;var g=Math.min(gap,(a1-a0)/2);var s0=polar(a0+g),s1=polar(a1-g);var large=((a1-g)-(a0+g))>180?1:0;body+='<path d="M'+s0[0].toFixed(2)+' '+s0[1].toFixed(2)+' A'+r+' '+r+' 0 '+large+' 1 '+s1[0].toFixed(2)+' '+s1[1].toFixed(2)+'" fill="none" stroke="'+s.col+'" stroke-width="'+sw+'" stroke-linecap="round"/>';ang+=frac;});
  var ctr='<text x="'+cx+'" y="'+(cy-1)+'" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink)">'+String(Math.round(tot)).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0')+'</text><text x="'+cx+'" y="'+(cy+11)+'" text-anchor="middle" font-size="7.5" fill="var(--faint)">kWh</text>';
  return '<div class="donut-cell"><svg viewBox="0 0 100 100" class="donut">'+body+ctr+'</svg><div class="donut-y">'+yearLbl+(partial?' <span class="donut-p">delår</span>':'')+'</div></div>';
}

  h+=yearOverlayChart(mt.mk, yc, 'cmp-chart');
  h+='</section>';
  h+=kronorPanel();   /* kopt/salt over energimixen */

  var SOLC=(P.sun||'#ebcb8b'),BATC=(P.cyan||'#88c0d0'),KOPC=(P.warm||'#d08770');
  var mix=cmpMix(), cyM=String(cy);
  var mkNow=dayKey().slice(0,7).slice(5);

  var rows=[], mixTit='', partialTag=false, _emixLive=false, mixBatt=false;

    /* I dag: dagens egna mix ur Insights, mot i går. Faller tillbaka på månaden

      var eIgar=emixAgg(dayKeyAgo(1),dayKeyAgo(1)); if(eIgar)rows.push(['I går',{forbr:eIgar.forbr,sol:eIgar.sol,batt:eIgar.batt,kopt:eIgar.kopt},cy-1]);

  rows.forEach(function(r){

      +(pB>0?'<div class="sb-seg" style="width:'+pB+'%;background:'+BATC+'">'+(pB>=9?pB+'%':'')+'</div>':'')
      +(pK>0?'<div class="sb-seg" style="width:'+pK+'%;background:'+KOPC+'">'+(pK>=9?pK+'%':'')+'</div>':'')

  h+='<div class="donut-lg" style="margin-top:9px"><span><i style="background:'+SOLC+'"></i>Sol</span>'
    +'<span><i style="background:'+BATC+'"></i>Batteri</span><span><i style="background:'+KOPC+'"></i>Köpt</span></div>';

  h+='</section>';
  // Kronor: köpt och sålt per period

  // Staplar per värde — följer den globala periodraden
  var cyMs=SEED_MONTHS.filter(function(m){return m.m.slice(0,4)===String(cy);}).map(function(m){return m.m.slice(5);});
  var completeMs=cyMs.filter(function(mm){return (+mm)<=lastFullMonth();});
  var isTot=(_aoaMode==='total');

  var msLbl=function(ms){return ms.length?(MABBR[+ms[0]-1]+'–'+MABBR[+ms[ms.length-1]-1]):'perioden';};
  var perLbl=isTot?'hela år':msLbl(useMs);

  h+=cmpHead('År mot år',perLbl+' · kWh',

    [cy-2,cy-1,cy].forEach(function(y,i){var v=vals[i],w=(v?Math.max(3,Math.round(v/max*100)):0),isC=(y===cy);

/* Kopt och salt i kronor per period. Bygger pa money_v1 - se kommentaren dar for

/* v196: kronorutan har ingen egen periodrad langre - de globala knapparna styr.
   Priset for det ar att VECKA foll bort; de fyra globala ar Ar, Manad, Dag, Nu. */
function _krPerNu(){return _krMode;}
/* Kronor i mixrutans form: en 100%-stapel, kopt mot salt, procentsatt mot totalen.
   Perioden valjs med knappar. Underlaget: se money_v1 och monBackfill(). */
var _mixNote='';
/* Delaret ar inte jamforbart med helar - varken i kWh eller i andel. Andelen ar den
   lomska: manaderna som fattas ar arets morkaste i forhallande till forbrukningen, sa
   solens del ser battre ut an den blir. Vi gissar inte hur mycket - vi mater det pa
   fjolaret, som har bade samma manader och ett facit. */
function mixNoteBygg(stats,cy){
  _mixNote='';
  /* Med hela manader eller till idag star lika mot lika - inget att varna for. */
  /* Delarsnoten galler bara nar mixen visar HELA AR - da ar i ar ett delar mot helar. */
  if(_mixMode!=='year'){_mixNote='';return;}
  var cyS=stats[2]; if(!cyS||!cyS.partial)return;
  var msNow=SEED_MONTHS.filter(function(m){return m.m.slice(0,4)===String(cy);}).map(function(m){return m.m.slice(5);});
  var pa=periodAgg(cy-1,msNow), fa=stats[1];
  var shr=function(x){if(!x)return null;var tt=(x.sol||0)+(x.batt||0)+(x.kopt||0);return tt>0?(x.sol||0)/tt*100:null;};
  var a=shr(pa), b=shr(fa);
  var n=cy+' är inte färdigt. '+periodLabel(cyS)+' står mot hela '+(cy-2)+' och '+(cy-1)+', så varken totalen eller andelarna går att jämföra rakt av.';
  if(a!=null&&b!=null&&fa&&!fa.partial){
    n+=' Så mycket lurar det: samma månader '+(cy-1)+' gav solen '+Math.round(a)+' % av förbrukningen, men hela '+(cy-1)+' bara '+Math.round(b)+' %. Räkna med att '+cy+' faller på samma sätt när mörkret kommer.';
  }
  n+=' Vill du jämföra lika mot lika – välj Denna månad eller Året per månad.';
  _mixNote=n;}

/* Läser riktiga capabilities; varje generator returnerar null om data saknas. */
function insSeason(m){ if(m>=3&&m<=5)return 'spring'; if(m>=6&&m<=8)return 'summer'; if(m>=9&&m<=11)return 'autumn'; return 'winter'; }
function insDaypart(h){ if(h>=5&&h<10)return 'morning'; if(h>=10&&h<16)return 'midday'; if(h>=16&&h<22)return 'evening'; return 'night'; }
var INS_MON=['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];
function insNum(v,d){ return (v==null||isNaN(v))?null:Number(v).toFixed(d==null?0:d).replace('.',','); }
function insKwh(v){ return (v==null||!isFinite(v))?'–':String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0'); }

function buildInsState(){
  var now=new Date(),S={};
  S.now=now; S.hour=now.getHours(); S.month=now.getMonth()+1; S.dow=now.getDay();
  S.season=insSeason(S.month); S.time=insDaypart(S.hour);
  S.weekend=(S.dow===0||S.dow===6);
  S.monName=INS_MON[S.month-1];
  /* effekt & sol */
  var hW=houseNowW(); S.powerKw=(hW==null?null:hW/1000);
  var sW=cap(DEV.solar,'measure_power'); S.solarKw=(sW==null?null:sW/1000);
  S.solDay=cap(DEV.solar,'meter_power.day');
  S.solMonth=cap(DEV.solar,'meter_power.month');
  S.solYear=cap(DEV.solar,'meter_power.year');
  S.solTotal=cap(DEV.solar,'meter_power');
  /* batteri */
  S.battSoc=cap(DEV.battery,'measure_battery');
  var bW=cap(DEV.battery,'measure_power'); S.battKw=(bW==null?null:bW/1000);
  S.battState=cap(DEV.battery,'battery_charging_state');
  /* nät (Pulse: export = negativt) */
  var pW=cap(DEV.pulse,'measure_power');
  S.gridKw=(pW==null?null:pW/1000);
  S.exportKw=(pW==null?null:(pW<0?Math.abs(pW)/1000:0));
  /* självförsörjning – samma logik som energipanelen */
  S.ownFrac=null;
  if(hW!=null&&hW>0){
    var solW=sW||0, disch=(S.battState==='discharging'&&bW!=null)?Math.abs(bW):0;
    S.ownFrac=Math.max(0,Math.min(hW,solW+disch))/hW;
  }else if(S.exportKw!=null&&S.exportKw>0){S.ownFrac=1;}
  S.selfPct=(S.ownFrac==null?null:Math.round(S.ownFrac*100));
  /* pris */
  S.priceNow=elprisNow();
  S.priceMin=elprisLo();
  S.priceMax=elprisHi();
  S.priceLevel=cap(DEV.tibber,'price_level')||cap(DEV.tibber,'measure_price_level');
  /* väder */
  S.tempOut=cap(DEV.outdoor,'measure_temperature'); if(S.tempOut==null)S.tempOut=cap(DEV.vader,'measure_temperature');
  S.feels=cap(DEV.smhi,'air_temperature_feels_like_cp');
  S.humOut=cap(DEV.outdoor,'measure_humidity');
  S.wind=cap(DEV.windMs,'measure_wind_strength'); if(S.wind==null)S.wind=cap(DEV.smhi,'measure_wind_speed_cp');
  S.gust=cap(DEV.windMs,'measure_gust_strength');
  S.rain24=cap(DEV.rain,'measure_rain.24h'); if(S.rain24==null)S.rain24=cap(DEV.rain,'measure_rain');
  S.thunder=cap(DEV.smhi,'measure_thunder_probability_cp');
  S.press=cap(DEV.vader,'measure_pressure'); if(S.press==null)S.press=cap(DEV.smhi,'measure_air_pressure_cp');
  var ex=tempExtremes(S.tempOut); S.tMin=ex.min; S.tMax=ex.max;
  /* inne / uterum / pool */
  S.tempIn=cap(DEV.vard,'measure_temperature'); if(S.tempIn==null)S.tempIn=cap(DEV.vader,'measure_temperature');
  S.co2=cap(DEV.vader,'measure_co2');
  S.humIn=cap(DEV.vader,'measure_humidity');
  S.uterum=cap(DEV.uterum,'measure_temperature');
  S.uterumCo2=cap(DEV.uterum,'measure_co2');
  S.pool=cap(DEV.pooltemp,'measure_temperature');
  S.poolHeat=cap(DEV.poolheat,'onoff');
  /* bil & laddbox */
  S.evCharging=cap(DEV.laddbox,'evcharger_charging');
  S.evKw=(function(){var w=chargerW();return w==null?null:w/1000;})();
  S.carSoc=cap(DEV.car,'measure_battery'); if(S.carSoc==null)S.carSoc=cap(DEV.car2,'measure_battery');
  /* markis + disk */
  S.awning=cap(DEV.awning,'windowcoverings_state');
  S.dish=cap(DEV.dish,'onoff');
  /* batteri-uthållighet */
  S.battKwh=(S.battSoc==null?null:Math.round(S.battSoc/100*9.8*10)/10);
  S.battHours=(S.battKwh!=null&&S.powerKw!=null&&S.powerKw>0.2)?Math.round(S.battKwh/S.powerKw*10)/10:null;
  return S;
}

/* ===== Kul-fakta: rotationsmotor =====
   Kul-fakta är per definition likvärdiga - ingen är "viktigare". Därför roterar de
   i stället för att rangordnas: fröet är dagsbaserat så urvalet ligger stilla hela
   dygnet (ingen flimmer vid refresh) men byts till nästa dag. */
function insRot(id){var k=dayKey()+'|'+id,h=2166136261;
  for(var i=0;i<k.length;i++){h^=k.charCodeAt(i);h=Math.imul(h,16777619);}
  return ((h>>>0)%1000)/1000;}

/* Hur stor del av dygnets modellerade solenergi som redan hunnit intraffa, 0..1.
   Klockan duger inte - i december ar dagen slut kl 15, i juni pagar den till 22.
   Modellen vet, sa fraga den. Anvands for att halla tillbaka insikter som jamfor
   DAGENS produktion med ett dygnssnitt: kl 07 har vi 1 kWh mot ett snitt pa 80 och
   "Svag soldag -99%" ar tekniskt sant men rent brus. */
function dagAndel(){

    var nu=nowHour(), tot=0, so=0;
    for(var h=0;h<24;h++){var w=solTheoWAt(h); if(!(w>0))continue; tot+=w; if(h<=nu)so+=w;}
    return tot>0?Math.max(0,Math.min(1,so/tot)):1;

function sunPeak(){var now=new Date(),tz=-now.getTimezoneOffset(),best=null;
  for(var m=0;m<1440;m+=10){var a=solar(new Date(now.getFullYear(),now.getMonth(),now.getDate(),0,m),CONFIG.LAT,CONFIG.LON,tz);
    if(a&&a.elevation!=null&&(best==null||a.elevation>best))best=a.elevation;}
  return (best==null||!isFinite(best))?null:best;}

function sunShift(){var now=new Date(),tz=-now.getTimezoneOffset();

/* ===== Hjälpare för rekord/jämförelser/extremer ===== */
function dayLbl(k){var q=String(k).split('-');return (q.length<3)?String(k):((+q[2])+' '+INS_MON[+q[1]-1]);}
/* Färgen ska följa BETYDELSEN, inte räknetecknet.
   hib = högre är bättre · lib = lägre är bättre · neu = varken bra eller dåligt */
function dlt(v,u,pol,dec){
  if(v==null||!isFinite(v))return null;
  var t=(v>0?'+':(v<0?'\u2212':'\u00b1'))+insNum(Math.abs(v),dec==null?1:dec)+(u||'');
  var cls=(pol==='neu')?'ze':(pol==='lib'?(v>0?'dn':(v<0?'up':'ze')):(v>0?'up':(v<0?'dn':'ze')));
  return {t:t,cls:cls};}
/* Årets bästa/lägsta notering ur årsrekordet + dagsloggen.
   Säger "i år" BARA om loggen täcker året – annars "på N dygn". */
var REC_MIN_DAYS=7;  /* minsta antal avslutade dygn för att ett rekord ska vara meningsfullt */
function bestOf(field,lower,live){
  var o=daysGet(),R=recsGet(),tk=dayKey(),yr=tk.slice(0,4);
  var now=new Date(),doy=Math.floor((now-new Date(now.getFullYear(),0,0))/86400000);
  var best=null,n=0,extra=0;
  if(R&&R.y===+yr&&R[field]){best={v:R[field].v,d:R[field].d};n=R.n;}
  Object.keys(o).forEach(function(k){
    if(k.slice(0,4)!==yr)return;var e=o[k];if(!e||e[field]==null||!isFinite(e[field]))return;
    if(k!==tk&&(!R||!R.last||k>R.last))extra++;         /* täckning: bara avslutade dygn */
    if(!best||(lower?e[field]<best.v:e[field]>best.v))best={v:e[field],d:k};
  });
  /* dagens värde kan mycket väl VARA rekordet – annars blir rutan inaktuell */
  if(live!=null&&isFinite(live)&&(!best||(lower?live<best.v:live>best.v)))best={v:live,d:tk};
  if(!best)return null;
  var cov=n+extra,full=cov>=Math.max(60,(doy-1)*0.9);
  /* ett "rekord" utan avslutade dygn att slå har ingen jämf.grund - visa inte raden alls */
  if(cov<REC_MIN_DAYS)return null;
  return {v:best.v,d:best.d,n:cov,scope:full?'i år':('på '+cov+' dygn'),full:full,today:(best.d===tk)};}
/* Senast avslutade månaden mot samma månad i fjol (aldrig halva månader) */
function monthPair(){
  var lm=lastFullMonth();if(lm<1)return null;
  var y=new Date().getFullYear(),mm=('0'+lm).slice(-2);
  var a=null,b=null;
  SEED_MONTHS.forEach(function(x){if(x.m===y+'-'+mm)a=x;if(x.m===(y-1)+'-'+mm)b=x;});
  return (a&&b)?{cur:a,prev:b,mon:INS_MON[lm-1]}:null;}
/* Året hittills mot samma månader i fjol – bara hela månader */
function yearPair(){
  var lm=lastFullMonth();if(lm<1)return null;
  var y=new Date().getFullYear(),set=[];
  for(var i=1;i<=lm;i++)set.push(('0'+i).slice(-2));
  var a=periodAgg(y,set),b=periodAgg(y-1,set);
  if(!(a&&b&&a.n===lm&&b.n===lm))return null;
  /* periodAgg ger forbr/kopt/sald/prod/sol/batt – normalisera till samma korta
     nycklar som SEED_MONTHS (f/k/sa/p/so/b) så monthPair och yearPair läses lika */
  var norm=function(x){return {f:x.forbr,k:x.kopt,sa:x.sald,p:x.prod,so:x.sol,b:x.batt};};
  return {cur:norm(a),prev:norm(b),n:lm,lbl:(lm===1?'januari':('jan\u2013'+INS_MON[lm-1].slice(0,3)))};}
function pct(a,b){return (b>0)?Math.round((a/b-1)*100):null;}
/* Dagens längd + hur den ändrats sedan igår */
function dayLen(){
  var now=new Date(),tz=-now.getTimezoneOffset();
  var a=solar(now,CONFIG.LAT,CONFIG.LON,tz);
  if(!a||a.sunrise==null||a.sunset==null)return null;
  var b=solar(new Date(now.getTime()-864e5),CONFIG.LAT,CONFIG.LON,tz);
  var L=a.sunset-a.sunrise,d=(b&&b.sunrise!=null&&b.sunset!=null)?(L-(b.sunset-b.sunrise))*60:null;
  return {h:Math.floor(L),m:Math.round((L-Math.floor(L))*60),min:d,rise:a.sunrise,set:a.sunset};}
/* Största soleffekten idag ur 24h-historiken */
function solPeakToday(){

  var t0=dayStart(),bv=null,bt=null;
  for(var i=0;i<a.length;i++){if(a[i].t>=t0&&a[i].v!=null&&isFinite(a[i].v)&&(bv==null||a[i].v>bv)){bv=a[i].v;bt=a[i].t;}}
  if(bv==null||bv<200)return null;
  return {w:bv,at:new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Stockholm',hour:'2-digit',minute:'2-digit'}).format(new Date(bt))};}

function press3h(cur){
  if(cur==null)return null;var log=[];try{log=JSON.parse(localStorage.getItem('pressLog_v1')||'[]');}catch(e){}

  for(var i=0;i<log.length;i++){if(now-log[i].t>=2.5*36e5&&(old==null||log[i].t>old.t))old=log[i];}
  return old?(cur-old.v):null;}

function osmGridScaled(lat,lon,z,W,H,tz){

function wxSetShow(v){CFG.wxMapShow=v;saveCfg();renderVader();}
function wxTileUrl(t){return 'https://tile.openstreetmap.org/'+t.z+'/'+t.x+'/'+t.y+'.png';}
function wxAttr(){var a='© OpenStreetMap';
