/* ===== Synoptisk vy: riktigt tryckfält från Open-Meteo =====
   Hämtas direkt av webbläsaren (inte via Homey). Ett rutnät av punkter över
   Skandinavien ger lufttryck vid havsytan och vind; ur det ritas isobarer och
   H/L-centrum. Trycket varierar ~1 hPa per 10 mil, så det här kräver en utzoomad
   vy – på hemmakartan skulle skillnaden vara osynlig. */
var SYN_VIEW={lat:58.5,lon:12.0,W:560,H:560,z:6};
/* 11x11 i stället för 7x7: fronter är 50–200 km breda och syns inte alls
   med 150 km mellan mätpunkterna. Nu ligger punkterna ~100 km isär. */
var SYN_BOX={s:54.0,n:63.0,w:5.0,e:19.0},SYN_N=11;
var _synGrid=null,_synT=0,_synBusy=false,_synFail=false,_synFrontN=0;
function synFetch(){
  if(_synBusy)return;
  if(_synGrid&&Date.now()-_synT<20*60000)return;
  if(_synFail&&Date.now()-_synT<2*60000)return;
  _synBusy=true;
  var lats=[],lons=[];
  for(var iy=0;iy<SYN_N;iy++)for(var ix=0;ix<SYN_N;ix++){
    lats.push((SYN_BOX.s+(SYN_BOX.n-SYN_BOX.s)*iy/(SYN_N-1)).toFixed(3));
    lons.push((SYN_BOX.w+(SYN_BOX.e-SYN_BOX.w)*ix/(SYN_N-1)).toFixed(3));}
  var url='https://api.open-meteo.com/v1/forecast?latitude='+lats.join(',')+'&longitude='+lons.join(',')
    +'&current=pressure_msl,temperature_2m,wind_speed_10m,wind_direction_10m&wind_speed_unit=ms&timezone=UTC';
  try{
    fetch(url,{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
      var arr=Array.isArray(j)?j:[j],g=[];
      for(var i=0;i<arr.length;i++){var o=arr[i],c=o&&o.current;
        g.push({lat:o.latitude,lon:o.longitude,p:(c&&c.pressure_msl!=null)?c.pressure_msl:null,
                t:(c&&c.temperature_2m!=null)?c.temperature_2m:null,
                ws:(c&&c.wind_speed_10m!=null)?c.wind_speed_10m:null,wd:(c&&c.wind_direction_10m!=null)?c.wind_direction_10m:null});}
      var ok=false;for(var k=0;k<g.length;k++)if(g[k].p!=null)ok=true;
      _synGrid=ok?g:null;_synFail=!ok;_synT=Date.now();_synBusy=false;
      try{if(document.getElementById('vdr-body')&&wxShow()==='tryck')renderVader();}catch(e){}
    },function(){_synBusy=false;_synFail=true;_synT=Date.now();});
  }catch(e){_synBusy=false;_synFail=true;_synT=Date.now();}
}
/* Rutnätet som matris: rad 0 = sydligast (så som punkterna beställdes) */
function synMatrix(){
  if(!_synGrid||_synGrid.length<SYN_N*SYN_N)return null;
  var m=[];
  for(var iy=0;iy<SYN_N;iy++){var row=[];
    for(var ix=0;ix<SYN_N;ix++)row.push(_synGrid[iy*SYN_N+ix]);
    m.push(row);}
  return m;}
/* Förtätar rutnätet med bilinjär interpolation så isobarerna blir mjuka */
/* sub = förtätningsgrad, key = vilket fält som interpoleras ('p' tryck, 't' temp) */
function synFine(m,sub,key){
  var K=key||'p';
  var N=(SYN_N-1)*sub+1,out=[];
  for(var j=0;j<N;j++){var row=[],fy=j/(N-1)*(SYN_N-1);
    var j0=Math.min(SYN_N-2,Math.floor(fy)),ty=fy-j0;
    for(var i=0;i<N;i++){var fx=i/(N-1)*(SYN_N-1);
      var i0=Math.min(SYN_N-2,Math.floor(fx)),tx=fx-i0;
      var a=m[j0][i0][K],b=m[j0][i0+1][K],c=m[j0+1][i0][K],dd=m[j0+1][i0+1][K];
      if(a==null||b==null||c==null||dd==null){row.push(null);continue;}
      var v=a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+dd*tx*ty;
      var lat=SYN_BOX.s+(SYN_BOX.n-SYN_BOX.s)*(j/(N-1));
      var lon=SYN_BOX.w+(SYN_BOX.e-SYN_BOX.w)*(i/(N-1));
      row.push({v:v,lat:lat,lon:lon});}
    out.push(row);}
  return out;}
/* Marching squares: drar en isobar för en given trycknivå */
function synContour(F,level,XY){
  var segs=[],N=F.length;
  var ip=function(p1,p2){var t=(level-p1.v)/((p2.v-p1.v)||1e-9);
    var a=XY(p1),b=XY(p2);return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];};
  for(var j=0;j<N-1;j++)for(var i=0;i<N-1;i++){
    var p00=F[j][i],p10=F[j][i+1],p11=F[j+1][i+1],p01=F[j+1][i];
    if(!p00||!p10||!p11||!p01)continue;
    var cr=[];
    if((p00.v<level)!==(p10.v<level))cr.push(ip(p00,p10));
    if((p10.v<level)!==(p11.v<level))cr.push(ip(p10,p11));
    if((p11.v<level)!==(p01.v<level))cr.push(ip(p11,p01));
    if((p01.v<level)!==(p00.v<level))cr.push(ip(p01,p00));
    if(cr.length===2)segs.push([cr[0],cr[1]]);
    else if(cr.length===4){segs.push([cr[0],cr[1]]);segs.push([cr[2],cr[3]]);}}
  return segs;}
/* Hittar tryckcentrum (H och L) som lokala extremer i rutnätet */
function synCenters(m){
  var out=[];
  for(var j=1;j<SYN_N-1;j++)for(var i=1;i<SYN_N-1;i++){
    var c=m[j][i];if(!c||c.p==null)continue;
    var hi=true,lo=true,ok=true;
    for(var dj=-1;dj<=1;dj++)for(var di=-1;di<=1;di++){
      if(!di&&!dj)continue;var n=m[j+dj][i+di];
      if(!n||n.p==null){ok=false;continue;}
      if(n.p>=c.p)hi=false; if(n.p<=c.p)lo=false;}
    if(ok&&(hi||lo))out.push({lat:c.lat,lon:c.lon,p:c.p,t:hi?'H':'L'});}
  return out;}
/* ===================== FRONTER =====================
   En front är gränsen mellan två luftmassor. Den syns inte i trycket utan i
   TEMPERATUREN: ett smalt band där det blir flera grader varmare eller kallare
   på kort sträcka. Kartan hämtar därför temperatur i samma rutnät som trycket,
   letar upp banden där temperaturgradienten är onormalt stark, och lägger
   frontlinjen längs isotermen mitt i bandet.

   Typen avgörs av vinden: bär den varmluft in mot kylan är det en VARMFRONT
   (röd linje med halvcirklar), bär den kalluft in mot värmen en KALLFRONT
   (blå linje med trianglar). Symbolerna sitter på den sida fronten rör sig åt.

   Det här är en förenklad maskinversion av vad en meteorolog ritar för hand.
   Med ~100 km mellan mätpunkterna blir läget ungefärligt – riktning och typ
   stämmer oftast, exakt position gör det inte. */
var FRONT_SUB=4;              /* förtätning av rutnätet inför frontsökningen */
var FRONT_MIN_ABS=1.6;        /* °C per 100 km – svagare än så är ingen front */
var FRONT_MIN_PX=70;          /* kortare linjer än så är brus, inte fronter */
var FRONT_MAX=4;              /* så många fronter ritas som mest */

/* Vind som komposanter: u österut, v norrut. Vindriktning anges dit vinden
   kommer FRÅN, därav minustecknen. */
function synUV(m){
  for(var j=0;j<SYN_N;j++)for(var i=0;i<SYN_N;i++){var c=m[j][i];
    if(!c)continue;
    if(c.ws==null||c.wd==null){c.u=null;c.v=null;continue;}
    var r=c.wd*Math.PI/180;
    c.u=-c.ws*Math.sin(r); c.v=-c.ws*Math.cos(r);}
  return m;}

/* Temperaturgradienten i varje finmaskig punkt, i grader per 100 km. */
function synGrad(FT){
  var N=FT.length,out=[];
  for(var j=0;j<N;j++){var row=[];
    for(var i=0;i<N;i++){
      var c=FT[j][i];
      if(!c){row.push(null);continue;}
      var e=FT[j][Math.min(N-1,i+1)],wv=FT[j][Math.max(0,i-1)];
      var no=FT[Math.min(N-1,j+1)][i],so=FT[Math.max(0,j-1)][i];
      if(!e||!wv||!no||!so){row.push(null);continue;}
      var kmx=111.32*Math.cos(c.lat*Math.PI/180)*(e.lon-wv.lon);
      var kmy=110.57*(no.lat-so.lat);
      var gx=kmx?(e.v-wv.v)/kmx*100:0;
      var gy=kmy?(no.v-so.v)/kmy*100:0;
      row.push({g:Math.sqrt(gx*gx+gy*gy),gx:gx,gy:gy,t:c.v,lat:c.lat,lon:c.lon});}
    out.push(row);}
  return out;}

/* Marching squares som ovan, men punkterna lämnas i rutnätets egna koordinater
   (i,j) så att gradient och vind kan slås upp direkt för varje punkt. */
function synContourIJ(F,level){
  var segs=[],N=F.length;
  var ip=function(i1,j1,p1,i2,j2,p2){var t=(level-p1.v)/((p2.v-p1.v)||1e-9);
    return [i1+(i2-i1)*t, j1+(j2-j1)*t];};
  for(var j=0;j<N-1;j++)for(var i=0;i<N-1;i++){
    var p00=F[j][i],p10=F[j][i+1],p11=F[j+1][i+1],p01=F[j+1][i];
    if(!p00||!p10||!p11||!p01)continue;
    var cr=[];
    if((p00.v<level)!==(p10.v<level))cr.push(ip(i,j,p00,i+1,j,p10));
    if((p10.v<level)!==(p11.v<level))cr.push(ip(i+1,j,p10,i+1,j+1,p11));
    if((p11.v<level)!==(p01.v<level))cr.push(ip(i+1,j+1,p11,i,j+1,p01));
    if((p01.v<level)!==(p00.v<level))cr.push(ip(i,j+1,p01,i,j,p00));
    if(cr.length===2)segs.push([cr[0],cr[1]]);
    else if(cr.length===4){segs.push([cr[0],cr[1]]);segs.push([cr[2],cr[3]]);}}
  return segs;}

/* Lösa segment sätts ihop till sammanhängande linjer. */
function synChain(segs){
  var key=function(p){return Math.round(p[0]*4)+','+Math.round(p[1]*4);};
  var map={},used=[];
  for(var i=0;i<segs.length;i++){used.push(false);
    var ka=key(segs[i][0]),kb=key(segs[i][1]);
    (map[ka]=map[ka]||[]).push(i); (map[kb]=map[kb]||[]).push(i);}
  var chains=[];
  for(var q=0;q<segs.length;q++){
    if(used[q])continue; used[q]=true;
    var pts=[segs[q][0],segs[q][1]];
    for(var dir=0;dir<2;dir++){
      var end=dir?pts[0]:pts[pts.length-1],guard=0;
      while(guard++<4000){
        var cand=map[key(end)]||[],nx=-1;
        for(var c=0;c<cand.length;c++)if(!used[cand[c]]){nx=cand[c];break;}
        if(nx<0)break;
        used[nx]=true;
        var sg=segs[nx],nxt=(key(sg[0])===key(end))?sg[1]:sg[0];
        if(dir)pts.unshift(nxt); else pts.push(nxt);
        end=nxt;}}
    if(pts.length>=3)chains.push(pts);}
  return chains;}

/* Hela analysen: returnerar färdiga fronter i skärmkoordinater. */
function synFrontList(m,XY){
  var FT=synFine(m,FRONT_SUB,'t');
  if(!FT.length||!FT[0][0])return [];
  var GD=synGrad(FT),N=GD.length;
  var all=[];
  for(var j=0;j<N;j++)for(var i=0;i<N;i++)if(GD[j][i])all.push(GD[j][i].g);
  if(all.length<40)return [];
  all.sort(function(a,b){return a-b;});
  /* Tröskeln följer dagens väder: alltid de skarpaste banden, men aldrig
     svagare än FRONT_MIN_ABS – en lugn dag ska ge noll fronter, inte brus. */
  var lim=Math.max(FRONT_MIN_ABS, all[Math.floor(all.length*0.88)]);
  var hot=[];
  for(var j2=0;j2<N;j2++)for(var i2=0;i2<N;i2++){var g2=GD[j2][i2];
    if(g2&&g2.g>=lim)hot.push(g2.t);}
  if(hot.length<12)return [];
  hot.sort(function(a,b){return a-b;});
  var lv=[hot[Math.floor(hot.length*0.2)],hot[Math.floor(hot.length*0.5)],hot[Math.floor(hot.length*0.8)]];
  var UV={u:synFine(m,FRONT_SUB,'u'),v:synFine(m,FRONT_SUB,'v')};
  var at=function(F,i,j){var r=F[Math.max(0,Math.min(N-1,Math.round(j)))];
    var c=r&&r[Math.max(0,Math.min(N-1,Math.round(i)))];return c?c.v:null;};
  var cand=[];
  for(var L=0;L<lv.length;L++){
    if(L&&Math.abs(lv[L]-lv[L-1])<0.4)continue;          /* nivåerna för lika */
    var chains=synChain(synContourIJ(FT,lv[L]));
    for(var ch=0;ch<chains.length;ch++){
      var ij=chains[ch],pts=[],gsum=0,adv=0,n=0,us=0,vs=0;
      for(var k=0;k<ij.length;k++){
        var gi=ij[k][0],gj=ij[k][1];
        var cell=GD[Math.max(0,Math.min(N-1,Math.round(gj)))][Math.max(0,Math.min(N-1,Math.round(gi)))];
        if(!cell)continue;
        var lat=SYN_BOX.s+(SYN_BOX.n-SYN_BOX.s)*(gj/(N-1));
        var lon=SYN_BOX.w+(SYN_BOX.e-SYN_BOX.w)*(gi/(N-1));
        var xy=XY({lat:lat,lon:lon});
        pts.push(xy); gsum+=cell.g;
        var u=at(UV.u,gi,gj),v=at(UV.v,gi,gj);
        if(u!=null&&v!=null){adv+=-(u*cell.gx+v*cell.gy);us+=u;vs+=v;n++;}}
      if(pts.length<3)continue;
      /* Bara den del av linjen som ligger i den skarpa zonen är en front */
      var len=0;for(var q2=1;q2<pts.length;q2++)
        len+=Math.hypot(pts[q2][0]-pts[q2-1][0],pts[q2][1]-pts[q2-1][1]);
      if(len<FRONT_MIN_PX)continue;
      /* Medelvinden längs linjen, omräknad till skärmens riktningar:
         x österut, y nedåt (söderut) – därav minustecknet på v. */
      cand.push({pts:pts,len:len,g:gsum/pts.length,adv:n?adv/n:0,
                 wsx:n?us/n:0, wsy:n?-vs/n:0});}}
  cand.sort(function(a,b){return b.g*b.len-a.g*a.len;});
  /* Parallella linjer från olika isotermer i samma band ska inte dubbelritas */
  var taken={},out=[],CELL=26;
  var mark=function(p,set){var cx=Math.round(p[0]/CELL),cy=Math.round(p[1]/CELL);
    var hits=0;
    for(var dx=-1;dx<=1;dx++)for(var dy=-1;dy<=1;dy++){
      var k=(cx+dx)+':'+(cy+dy);
      if(set){taken[k]=1;} else if(taken[k])hits++;}
    return hits>0;};
  for(var ci=0;ci<cand.length&&out.length<FRONT_MAX;ci++){
    var C=cand[ci],dup=0;
    for(var pi=0;pi<C.pts.length;pi++)if(mark(C.pts[pi],false))dup++;
    if(dup/C.pts.length>0.4)continue;
    for(var pj=0;pj<C.pts.length;pj++)mark(C.pts[pj],true);
    /* Hur mycket av vinden ligger VINKELRÄTT mot fronten? rel är cosinus för
       vinkeln mellan vind och temperaturgradient: ±1 = rakt på, 0 = längs med.
       Blåser det längs fronten flyttar den sig inte – då är den stationär. */
    var spd=Math.hypot(C.wsx,C.wsy)||0;
    C.rel=(C.g*spd)?C.adv/(C.g*spd):0;
    C.typ=(C.rel>0.35)?'warm':(C.rel<-0.35?'cold':'stat');
    C.warm=(C.typ==='warm');
    out.push(C);}
  return out;}

/* Ritar en front: vit stödlinje, färgad linje och symboler på rörelsesidan. */
function synFrontSVG(F,m,XY){
  var RED='#d1443f',BLUE='#2f6fd0',typ=F.typ||(F.warm?'warm':'cold'),pts=F.pts;
  var col=(typ==='warm')?RED:BLUE;
  var d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(var i=1;i<pts.length;i++)d+='L'+pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1);
  var s='<path d="'+d+'" fill="none" stroke="#fff" stroke-width="9" opacity=".9" stroke-linecap="round" stroke-linejoin="round"/>'
       +'<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>';
  /* Stationär front ritas som blå linje med röda streck ovanpå – samma
     omväxlande mönster som på en handritad väderkarta. */
  if(typ==='stat')s+='<path d="'+d+'" fill="none" stroke="'+RED+'" stroke-width="4.2" stroke-dasharray="22 22" stroke-linecap="butt"/>';
  /* Vindens riktning på skärmen: x österut, y nedåt (alltså söderut). */
  var wsx=F.wsx||0, wsy=F.wsy||0;
  var step=44, acc=step*0.6, n=0;
  for(var k=1;k<pts.length;k++){
    var ax=pts[k-1][0],ay=pts[k-1][1],bx=pts[k][0],by=pts[k][1];
    var seg=Math.hypot(bx-ax,by-ay); if(!seg)continue;
    var dx=(bx-ax)/seg,dy=(by-ay)/seg;
    while(acc<seg){
      var px=ax+dx*acc, py=ay+dy*acc;
      var th=Math.atan2(dy,dx)*180/Math.PI;
      /* Symbolerna pekar mot -y i det roterade systemet, dvs (dy,-dx) */
      if((dy*wsx+(-dx)*wsy)<0)th+=180;
      var warm=(typ==='warm');
      if(typ==='stat'){warm=(n%2===0); if(!warm)th+=180;}   /* omväxlande sidor */
      var sc=(typ==='stat')?(warm?RED:BLUE):col;
      s+='<g transform="translate('+px.toFixed(1)+','+py.toFixed(1)+') rotate('+th.toFixed(1)+')">'
        +(warm?'<path d="M-8,0 A 8 8 0 0 1 8,0 Z" fill="'+sc+'" stroke="#fff" stroke-width="1.4"/>'
               :'<path d="M-8,0 L0,-12 L8,0 Z" fill="'+sc+'" stroke="#fff" stroke-width="1.4"/>')
        +'</g>';
      n++; acc+=step;}
    acc-=seg;}
  return s;}

function wxMapSVG(){
  var show=wxShow();
  var syn=(show==='tryck');
  /* Närvyn använder radarns vyram: den är utzoomad nog att radarrutorna
     (som bara finns till zoom 7) ser skarpa ut, och vind ritas i samma bild. */
  var VW=syn?SYN_VIEW:RADAR_VIEW;
  var W=VW.W, H=VW.H, Z=syn?SYN_VIEW.z:radarViewZ();
  var G=osmGrid(VW.lat, VW.lon, Z, W, H);
  var wdir=cap(DEV.windNet,'measure_wind_angle'); if(wdir==null)wdir=cap(DEV.smhi,'measure_wind_direction_cp');
  var wspd=cap(DEV.windMs,'measure_wind_strength'); if(wspd==null)wspd=cap(DEV.smhi,'measure_wind_speed_cp');
  var P=PAL[curTheme]||PAL.dark;
  var hm=G.xy(WX_HOME.lat,WX_HOME.lon);
  var outline='#fff';
  var s='<svg class="wxmap-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Karta över Onsalahalvön">';
  s+='<defs><clipPath id="wxClip"><rect x="0" y="0" width="'+W+'" height="'+H+'" rx="14"/></clipPath>'
   +'<radialGradient id="wxgH"><stop offset="0" stop-color="#d1443f" stop-opacity=".40"/>'
   +'<stop offset=".55" stop-color="#d1443f" stop-opacity=".16"/><stop offset="1" stop-color="#d1443f" stop-opacity="0"/></radialGradient>'
   +'<radialGradient id="wxgL"><stop offset="0" stop-color="#2f6fd0" stop-opacity=".40"/>'
   +'<stop offset=".55" stop-color="#2f6fd0" stop-opacity=".16"/><stop offset="1" stop-color="#2f6fd0" stop-opacity="0"/></radialGradient>'
   +'<filter id="wxfDamp"><feColorMatrix type="saturate" values="0.25"/>'
   +'<feComponentTransfer><feFuncR type="linear" slope="0.92" intercept="0.07"/><feFuncG type="linear" slope="0.92" intercept="0.07"/><feFuncB type="linear" slope="0.92" intercept="0.07"/></feComponentTransfer></filter>'
   +'</defs>';
  s+='<g clip-path="url(#wxClip)">';
  s+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="'+(P.water||'#5aa9c8')+'" opacity=".25"/>';
  var f=' filter="url(#wxfDamp)"';   /* alltid dämpad – överlagringarna ska synas */
  s+='<g'+f+'>';
  for(var i=0;i<G.tiles.length;i++){var t=G.tiles[i];
    s+='<image href="'+wxTileUrl(t)+'" x="'+t.left+'" y="'+t.top+'" width="256" height="256"/>';}
  s+='</g>';
  /* --- Regnradar: eget lager direkt ovanpå kartan --- */
  if(!syn){
    radarFetch();
    var fr0=radarFrame();
    if(fr0){
      s+='<g id="wx-radar" opacity=".72">'+radarLayerHTML(fr0.path)+'</g>';
    }else{
      s+='<text x="'+(W/2)+'" y="'+(H-58)+'" text-anchor="middle" class="wxm-none">'
        +(_radarFail?'Nederbörden kunde inte hämtas':'Hämtar nederbörd…')+'</text>';}
  }
  /* --- Vindfält: färre men tydligare pilar, med kontrastkant --- */
  if(!syn&&wdir!=null&&isFinite(wdir)){
    var to=((wdir+180)%360+360)%360;
    var len=Math.max(24,Math.min(42,20+(wspd||0)*1.9));
    var pth=windArrowShape(len), cols=4, rows=5;
    for(var cx=0;cx<cols;cx++)for(var cy=0;cy<rows;cy++){
      var ax=(cx+0.5)*(W/cols), ay=(cy+0.5)*(H/rows);
      s+='<g transform="translate('+ax.toFixed(0)+','+ay.toFixed(0)+') rotate('+to.toFixed(0)+')" opacity=".5">'
        +'<path d="'+pth+'" fill="#111" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></g>';}
  }
  /* --- Tryckfält: isobarer och H/L ur Open-Meteos rutnät --- */
  if(syn){
    synFetch();
    var m=synMatrix();
    if(m){
      var F=synFine(m,6);
      var XY=function(pt){return G.xy(pt.lat,pt.lon);};
      var lo=Infinity,hi=-Infinity;
      for(var jj=0;jj<F.length;jj++)for(var ii=0;ii<F.length;ii++){var c0=F[jj][ii];
        if(c0){if(c0.v<lo)lo=c0.v;if(c0.v>hi)hi=c0.v;}}
      var step=4,lv0=Math.ceil(lo/step)*step;
      for(var L=lv0;L<=hi;L+=step){
        var segs=synContour(F,L,XY),d='';
        for(var q=0;q<segs.length;q++)d+='M'+segs[q][0][0].toFixed(1)+' '+segs[q][0][1].toFixed(1)+'L'+segs[q][1][0].toFixed(1)+' '+segs[q][1][1].toFixed(1)+' ';
        if(!d)continue;
        var mainLine=(Math.round(L)%20===0);
        var isoCol=(L>1013)?'#d1443f':(L<1013?'#2f6fd0':'#5b6472');
        s+='<path d="'+d+'" fill="none" stroke="#fff" stroke-width="'+(mainLine?6:4.6)+'" opacity=".72" stroke-linecap="round"/>';
        s+='<path d="'+d+'" fill="none" stroke="'+isoCol+'" stroke-width="'+(mainLine?2.8:1.7)+'" opacity="'+(mainLine?1:.85)+'" stroke-linecap="round"/>';
        if(mainLine&&segs.length){var lp=segs[Math.floor(segs.length/2)][0];
          s+='<text x="'+lp[0].toFixed(0)+'" y="'+lp[1].toFixed(0)+'" class="syn-iso" text-anchor="middle">'+Math.round(L)+'</text>';}}
      /* Fronterna ligger ovanpå isobarerna men under tryckcentrumen */
      try{
        var fr=synFrontList(synUV(m),XY);
        for(var fi=0;fi<fr.length;fi++)s+=synFrontSVG(fr[fi],m,XY);
        _synFrontN=fr.length;
      }catch(e){_synFrontN=0;}
      var ctr=synCenters(m),RED='#d1443f',BLUE='#2f6fd0';
      /* Mjuk röd/blå toning runt varje centrum – en gradient i stället för en
         platt cirkel, så ögat dras dit utan att kartan under försvinner. */
      for(var cg=0;cg<ctr.length;cg++){var Cg=ctr[cg],gxy0=G.xy(Cg.lat,Cg.lon);
        if(gxy0[0]<-90||gxy0[0]>W+90||gxy0[1]<-90||gxy0[1]>H+90)continue;
        s+='<circle cx="'+gxy0[0].toFixed(0)+'" cy="'+gxy0[1].toFixed(0)+'" r="165" fill="url(#'+((Cg.t==='H')?'wxgH':'wxgL')+')"/>';}
      /* Själva markören: vit ring runt en fylld skiva ger kontrast mot både
         ljus mark, mörkt vatten och isobarerna som korsar under den. */
      for(var ci=0;ci<ctr.length;ci++){var C=ctr[ci],cxy=G.xy(C.lat,C.lon);
        /* Hela markören med etikett tar ~40 px uppåt och ~80 px nedåt – ligger
           centrumet närmare kanten än så blir texten avklippt, så den hoppas över. */
        if(cxy[0]<45||cxy[0]>W-45||cxy[1]<40||cxy[1]>H-85)continue;
        var isH=(C.t==='H'),cc=isH?RED:BLUE;
        var cX=cxy[0].toFixed(0), cY=cxy[1].toFixed(0);
        s+='<circle cx="'+cX+'" cy="'+cY+'" r="34" fill="#fff" opacity=".96"/>'
          +'<circle cx="'+cX+'" cy="'+cY+'" r="29" fill="'+cc+'"/>'
          +'<circle cx="'+cX+'" cy="'+cY+'" r="34" fill="none" stroke="'+cc+'" stroke-width="2" opacity=".55"/>'
          +'<text x="'+cX+'" y="'+(cxy[1]+13).toFixed(0)+'" text-anchor="middle" class="syn-hl" fill="#fff">'+C.t+'</text>';
        /* Etiketten på en egen platta – siffrorna drunknade tidigare i kartan */
        var lw=76, lx=cxy[0]-lw/2, ly=cxy[1]+40;
        s+='<rect x="'+lx.toFixed(0)+'" y="'+ly.toFixed(0)+'" width="'+lw+'" height="22" rx="11" fill="#fff" opacity=".94"/>'
          +'<rect x="'+lx.toFixed(0)+'" y="'+ly.toFixed(0)+'" width="'+lw+'" height="22" rx="11" fill="none" stroke="'+cc+'" stroke-width="1.4" opacity=".7"/>'
          +'<text x="'+cX+'" y="'+(ly+15).toFixed(0)+'" text-anchor="middle" class="syn-hlv" fill="'+cc+'">'
          +(isH?'Högtryck':'Lågtryck')+'</text>'
          +'<text x="'+cX+'" y="'+(ly+37).toFixed(0)+'" text-anchor="middle" class="syn-hlp">'+Math.round(C.p)+' hPa</text>';}
      /* Vindpilar ur samma rutnät – här varierar de faktiskt över ytan */
      for(var gy=0;gy<SYN_N;gy++)for(var gx=0;gx<SYN_N;gx++){var gp=m[gy][gx];
        if(!gp||gp.wd==null)continue;var gxy=G.xy(gp.lat,gp.lon);
        if(gxy[0]<14||gxy[0]>W-14||gxy[1]<14||gxy[1]>H-14)continue;
        var gto=((gp.wd+180)%360+360)%360,glen=Math.max(18,Math.min(34,14+(gp.ws||0)*1.7));
        s+='<g transform="translate('+gxy[0].toFixed(0)+','+gxy[1].toFixed(0)+') rotate('+gto.toFixed(0)+')" opacity=".45">'
          +'<path d="'+windArrowShape(glen)+'" fill="#111" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></g>';}
    }else{
      s+='<text x="'+(W/2)+'" y="'+(H/2-20)+'" text-anchor="middle" class="wxm-none">'
        +(_synFail?'Tryckdata kunde inte hämtas':'Hämtar tryckdata…')+'</text>';}
  }
  /* --- Hemmet --- */
  /* Hemmet: fast signalfärg i stället för temafärgen, så pricken sticker ut
     lika bra mot ljus mark, mörkt vatten och regnradarns blå-gröna fält. */
  var HOME_C='#ff2d55';
  s+='<circle cx="'+hm[0].toFixed(0)+'" cy="'+hm[1].toFixed(0)+'" r="19" fill="'+HOME_C+'" opacity=".16"/>'
   +'<circle cx="'+hm[0].toFixed(0)+'" cy="'+hm[1].toFixed(0)+'" r="11" fill="#fff"/>'
   +'<circle cx="'+hm[0].toFixed(0)+'" cy="'+hm[1].toFixed(0)+'" r="7.5" fill="'+HOME_C+'"/>'
   +'<circle cx="'+hm[0].toFixed(0)+'" cy="'+hm[1].toFixed(0)+'" r="11" fill="none" stroke="#1b2733" stroke-width="1.2" opacity=".55"/>';
  s+='</g>';
  /* Mätvärdesrutorna är borttagna – samma siffror står i "Just nu" under kartan. */
  s+='<text x="'+(W-6)+'" y="'+(H-6)+'" text-anchor="end" class="wxm-attr">'+wxAttr()+'</text>';
  s+='</svg>';
  return s;
}
/* ---- Historik-hjälpare (alla värden kommer ur den loggade historiken) ---- */
function wxPts(k){var a=HIST[k]||[],o=[];for(var i=0;i<a.length;i++){var p=a[i];if(p&&p.v!=null&&isFinite(p.v))o.push(p);}return o;}
function wxAgo(k,hours){var a=wxPts(k);if(!a.length)return null;var t=Date.now()-hours*3600000,best=null,bd=Infinity;
  for(var i=0;i<a.length;i++){var d=Math.abs(a[i].t-t);if(d<bd){bd=d;best=a[i];}}
  return (bd<=hours*3600000*0.5+1800000)?best.v:null;}
function wxStats(k){var a=wxPts(k);if(a.length<2)return null;
  var mn=a[0],mx=a[0],sum=0;
  for(var i=0;i<a.length;i++){var p=a[i];if(p.v<mn.v)mn=p;if(p.v>mx.v)mx=p;sum+=p.v;}
  return {min:mn.v,minT:mn.t,max:mx.v,maxT:mx.t,avg:sum/a.length,first:a[0].v,last:a[a.length-1].v,n:a.length,from:a[0].t,to:a[a.length-1].t};}
function wxTrend(k,hours){var now=wxPts(k);if(!now.length)return null;var last=now[now.length-1].v,then=wxAgo(k,hours);
  return (then==null)?null:{d:last-then,last:last,then:then};}

/* ---- Dygnsgraf i samma stil som appens övriga grafer ----
   Viktigt: ingen text ritas inne i SVG:n. Grafen skalas i bredd (preserveAspectRatio
   "none") precis som de andra, och då skulle text dras ut på bredden. Högsta och
   lägsta står därför i en vanlig HTML-rad under grafen. */
function wxGraphSVG(){
  var S=wxSer(),a=wxPts(S.k),P=PAL[curTheme]||PAL.dark,col=P[S.c]||P.blue;
  if(!a||a.length<3)return '<div class="viz-empty">Historiken för '+esc(S.lab.toLowerCase())+' fylls på under dygnet.</div>';
  var now=Date.now(),cut=now-24*3600000;
  var seg=a.filter(function(p){return p.t>=cut;});if(seg.length<3)seg=a.slice(-48);
  var W2=300,H2=74,pad=5;
  var t0=seg[0].t,t1=seg[seg.length-1].t||now,tr=(t1-t0)||1;
  var lo=seg[0],hi=seg[0];
  for(var i=0;i<seg.length;i++){if(seg[i].v<lo.v)lo=seg[i];if(seg[i].v>hi.v)hi=seg[i];}
  var ylo=lo.v,yhi=hi.v,yr=(yhi-ylo)||1;
  var X=function(t){return pad+(t-t0)/tr*(W2-2*pad);},Y=function(v){return H2-pad-(v-ylo)/yr*(H2-2*pad);};
  var P2=seg.map(function(p){return [X(p.t),Y(p.v)];});
  var line=smoothPath(P2);
  var area=line+' L'+P2[P2.length-1][0].toFixed(1)+' '+(H2-pad)+' L'+P2[0][0].toFixed(1)+' '+(H2-pad)+' Z';
  var g=areaGrad(col,0.28);
  var hh=function(t){var d=new Date(t);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);};
  var last=seg[seg.length-1].v;
  var h='<div class="viz"><svg viewBox="0 0 '+W2+' '+H2+'" preserveAspectRatio="none"><defs>'+g.def+'</defs>'
    +'<path d="'+area+'" fill="url(#'+g.id+')"/>'
    +'<path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  h+='<div class="wxg-cap">'
    +'<span class="wxg-lo">Lägst '+num(lo.v,S.dec)+' '+S.u+' · '+hh(lo.t)+'</span>'
    +'<span class="wxg-now">Nu '+num(last,S.dec)+' '+S.u+'</span>'
    +'<span class="wxg-hi">Högst '+num(hi.v,S.dec)+' '+S.u+' · '+hh(hi.t)+'</span>'
    +'</div>';
  h+='<div class="viz-cap">senaste '+Math.max(1,Math.round(tr/3600000))+' timmarna</div></div>';
  return h;
}
/* ---- Jämförelser: nu mot tidigare i dygnet ---- */
function wxCompareHTML(){
  var S=wxSer(),st=wxStats(S.k);
  if(!st)return '<div class="wx-empty">Jämförelser visas när det finns mätvärden från dygnet.</div>';
  var now=S.val(); if(now==null)now=st.last;
  var rows='';
  var mk=function(lab,then){
    if(then==null)return '';
    var d=now-then, sign=(d>0?'+':(d<0?'−':'±'));
    var cls=(Math.abs(d)<(S.dec?0.05:0.5))?'flat':(d>0?'up':'down');
    return '<div class="wxc-row"><span class="wxc-l">'+lab+'</span><span class="wxc-v">'+num(then,S.dec)+' '+S.u+'</span>'
      +'<span class="wxc-d '+cls+'">'+sign+num(Math.abs(d),S.dec)+'</span></div>';};
  rows+=mk('För 1 timme sedan',wxAgo(S.k,1));
  rows+=mk('För 3 timmar sedan',wxAgo(S.k,3));
  rows+=mk('För 12 timmar sedan',wxAgo(S.k,12));
  rows+=mk('Dygnets medel',st.avg);
  var hh=function(t){var d=new Date(t);return (d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();};
  rows+='<div class="wxc-row"><span class="wxc-l">Dygnets högsta</span><span class="wxc-v">'+num(st.max,S.dec)+' '+S.u+'</span><span class="wxc-d t">'+hh(st.maxT)+'</span></div>';
  rows+='<div class="wxc-row"><span class="wxc-l">Dygnets lägsta</span><span class="wxc-v">'+num(st.min,S.dec)+' '+S.u+'</span><span class="wxc-d t">'+hh(st.minT)+'</span></div>';
  return '<div class="wxc">'+rows+'</div>';
}
/* ---- Insikter: bara sådant som mätvärdena faktiskt visar ---- */
function wxInsightList(){
  var out=[],P=PAL[curTheme]||PAL.dark;
  var pt=wxTrend('press',3);
  if(pt&&Math.abs(pt.d)>=1)out.push({ic:'gauge',c:'violet',lab:'Trycket '+(pt.d>0?'stiger':'faller'),
    txt:(pt.d>0?'Stigande':'Fallande')+' tryck, '+num(Math.abs(pt.d),1)+' hPa på tre timmar. '+(pt.d>0?'Ofta tecken på uppklarnande.':'Ofta tecken på att ett väderomslag är på väg.')});
  var w=cap(DEV.windMs,'measure_wind_strength'),g=cap(DEV.windMs,'measure_gust_strength');
  if(w!=null&&g!=null&&w>0.5&&g>=w*1.7)out.push({ic:'wind',c:'gold',lab:'Byigt',
    txt:'Byvindarna är '+num(g/w,1)+' gånger medelvinden ('+num(g,1)+' mot '+num(w,1)+' m/s). Ojämn vind.'});
  var ws=wxStats('wind');
  if(ws&&ws.max>=10)out.push({ic:'wind',c:'warm',lab:'Dygnets kraftigaste vind',txt:'Högsta uppmätta vind det senaste dygnet är '+num(ws.max,1)+' m/s.'});
  var ts=wxStats('t_ute');
  if(ts)out.push({ic:'thermometer',c:'warm',lab:'Dygnets spann',txt:'Temperaturen har rört sig mellan '+num(ts.min,1)+'° och '+num(ts.max,1)+'°, ett spann på '+num(ts.max-ts.min,1)+' grader.'});
  var r24=cap(DEV.rain,'measure_rain.24h'),r1=cap(DEV.rain,'measure_rain.1h');
  if(r1!=null&&r1>0)out.push({ic:'cloud-rain',c:'rain',lab:'Det regnar nu',txt:num(r1,1)+' mm den senaste timmen, '+num(r24||0,1)+' mm under dygnet.'});
  else if(r24!=null&&r24>0)out.push({ic:'cloud-rain',c:'rain',lab:'Regn under dygnet',txt:num(r24,1)+' mm har fallit det senaste dygnet. Uppehåll just nu.'});
  var hu=cap(DEV.outdoor,'measure_humidity'),te=cap(DEV.outdoor,'measure_temperature');
  if(hu!=null&&hu>=93&&te!=null)out.push({ic:'cloud-fog',c:'blue',lab:'Hög luftfuktighet',txt:Math.round(hu)+' % fuktighet ute – dimma eller dagg är möjligt.'});
  var th=cap(DEV.smhi,'measure_thunder_probability_cp');
  if(th!=null&&th>=20)out.push({ic:'lightning',c:'gold',lab:'Åskrisk',txt:'SMHI anger '+Math.round(th)+' % risk för åska.'});
  var dt=wxTrend('t_ute',3);
  if(dt&&Math.abs(dt.d)>=2)out.push({ic:'thermometer',c:(dt.d>0?'warm':'cyan'),lab:(dt.d>0?'Blir varmare':'Blir kallare'),
    txt:'Temperaturen har '+(dt.d>0?'stigit':'sjunkit')+' '+num(Math.abs(dt.d),1)+' grader på tre timmar.'});
  return out;
}
/* ---- Nyckeltal: allt viktigt på ett ögonkast ---- */
function wxDew(t,rh){if(t==null||rh==null||rh<=0)return null;
  var a=17.27,b=237.7,g=(a*t)/(b+t)+Math.log(rh/100);return (b*g)/(a-g);}

/* ===== Husets kronika =====
   Dashboarden RAKNAR ingenting har. Appen har redan gjort det, en gang, ur
   Insights — och den posten ar bestandig. Skulle sidan rakna om skulle den
   dessutom bara ha de dygn Insights fortfarande racker till, alltsa ge ett
   annat svar for samma manad beroende pa nar man tittar. */
var _kron=null,_kronAt=0,_kronFel=null,_kronVald=null,_kronPost={};
/* ===== NY-märket =====
   Märket sitter tills posten öppnats, eller tills tre dygn gått. Det andra
   villkoret finns för att märket annars skulle ligga kvar för alltid på en post
   man aldrig bryr sig om att öppna — och då slutar det betyda något.

   Läsningen sparas PER ENHET, i localStorage. Att den skulle synkas vore fel:
   att du läst rapporten på plattan säger ingenting om att du sett den i
   telefonen. */
var KRON_LAST='kronlast_v1', KRON_NY_MAX=3*24*3600000;
function kronLastGet(){
  try{return JSON.parse(localStorage.getItem(KRON_LAST)||'{}')||{};}catch(e){return {};}}
function kronLastSatt(p){
  try{
    var o=kronLastGet();
    o[p]=Date.now();
    /* Håll listan kort — bara perioder som fortfarande kan vara nya spelar roll. */
    var k=Object.keys(o).sort();
    while(k.length>60)delete o[k.shift()];
    localStorage.setItem(KRON_LAST,JSON.stringify(o));
    return true;
  }catch(e){return false;}}
/* När hände något med posten senast? Den SENARE av när siffrorna räknades och
   när texten skrevs. Skriver man om texten på en gammal månad är det lika mycket
   en nyhet som en ny post — förut byggde märket bara på räkningen, och en
   omskriven text gav ingenting. */
function kronTid(x){
  if(!x)return 0;
  return Math.max(Number(x.raknad_at)||0, Number(x.text_at)||0);}
function kronArNy(x){
  var t=kronTid(x);
  if(!t)return false;
  if(Date.now()-t>KRON_NY_MAX)return false;             /* tre dygn räcker */
  /* Jämför läsningen mot posten, inte bara "har öppnats någon gång". En post
     man läst i förrgår och som fått ny text idag ska bli oläst igen. */
  var last=Number(kronLastGet()[x.period])||0;
  return last<t;}

/* ===== Notisikon i toppraden =====
   Visas när det finns en oläst krönika. Tryck går direkt till den äldsta
   olästa — inte den nyaste, för läser man uppifrån hoppar man över det som
   legat längst och är på väg att försvinna.

   Läsningen är per enhet, precis som NY-märket: att du läst på plattan säger
   ingenting om vad du sett i telefonen. */
/* Klockans räknare måste bygga på SAMMA lista som notisvyn. Förut räknade den
   ur _kron direkt och tog därför med poster man sopat undan: klockan visade
   "1 oläst" medan listan såg tom ut, och märket satt kvar i arkivet.

   notLista() filtrerar bort borttagna och tar hänsyn till väggplattan; genom
   att gå via den kan de två inte glida isär igen. */
function krOlasta(){
  if(!_kron)return [];
  return notLista().filter(function(x){return x.ny;})
    .sort(function(a,b){return (a.tid||0)-(b.tid||0);});}
/* Varje vy har sin egen topprad, alltså sin egen notisknapp. Sök upp dem på
   KLASS i stället för en lista med id:n — den listan missade den femte knappen
   så fort notisvyn tillkom, och samma sak hade hänt nästa gång. */
function krNotisUppdatera(){
  var o=krOlasta();
  var alla=document.querySelectorAll('.en-notis');
  Array.prototype.forEach.call(alla,function(b){krNotisEn(b,o);});}
function krNotisEn(b,o){
  if(!b)return;
  /* Är en notis öppen blir klockan en tillbaka-knapp. Toppraden är ändå den
     enda fasta punkten på sidan, och en knapp inne i innehållet flyttar sig
     beroende på hur lång texten är. */
  if(_notOppen){
    b.classList.remove('har','puls');
    b.classList.add('bak');
    b.innerHTML='<span class="en-cmp-ic">'+icon('arrow-left')+'</span>Tillbaka';
    b.title='Tillbaka till notiserna';
    return;
  }
  b.classList.remove('bak');
  /* icon() ger tom sträng innan ikonuppsättningen initierats. Skrivs knappen
     över DÅ försvinner klockan, och den kommer inte tillbaka förrän något ritar
     om — precis det som gav en tom ring på startsidan. Behåll det som redan
     står där i så fall. */
  var kl=icon('bell');
  if(!kl){
    var fanns=b.querySelector('.en-cmp-ic');
    kl=fanns?fanns.innerHTML:'';
    if(!kl){b.classList.toggle('har',!!o.length);return;}
  }
  /* Väggplattan visar ALDRIG antal eller markering — bara en klocka att trycka
     på. Den sitter uppsatt i hallen och ingen står framför den när texten
     skrivs; en markering där blir en påminnelse som aldrig kvitteras av rätt
     person, och som dessutom lyser mot alla som går förbi.
     Andra plattor beter sig som telefonen. */
  if(!notVisaNy()){
    b.classList.remove('har','puls');
    b.innerHTML='<span class="en-cmp-ic">'+kl+'</span>';
    b.title=o.length?('Sammanfattningar — '+o.length+' oläst'+(o.length>1?'a':'')):'Sammanfattningar';
    return;
  }
  /* Klockan finns ALLTID. Utan olästa är den bara en väg in till krönikan;
     en knapp som försvinner och dyker upp gör toppraden rastlös, och man
     lär sig aldrig var den sitter. */
  if(!o.length){
    b.classList.remove('har','puls');
    b.innerHTML='<span class="en-cmp-ic">'+kl+'</span>';
    b.title='Sammanfattningar';
    return;
  }
  b.classList.add('har');
  /* 'bell' även här — 'bell-ringing' finns inte i ikonuppsättningen och hade
     gett en tom ruta. Färgen och siffran bär tillståndet i stället. */
  b.innerHTML='<span class="en-cmp-ic">'+kl+'</span>'
    +'<span class="en-notis-n">'+o.length+'</span>';
  b.title=o.length===1
    ? ('Ny sammanfattning: '+kronNamn(o[0].period))
    : (o.length+' olästa sammanfattningar — äldsta: '+kronNamn(o[0].period));
  b.classList.add('puls');}
function krNotisTryck(){
  /* Öppen notis: knappen är en tillbaka-knapp. Annars till listan — förut
     hoppade den rakt till den äldsta olästa, vilket var bekvämt med en post men
     obegripligt med fem: man visste inte vad man hoppat förbi. */
  if(_notOppen){try{notTillbaka();}catch(e){}return;}
  try{openNotiser();}catch(e){}}

/* ===== Djuplänk =====
   ?kronika=2026-07 öppnar Insikter med den posten utfälld. Notisen om att
   krönikan skrivits kan då peka rakt på texten i stället för att bara säga att
   den finns någonstans.

   Perioden kontrolleras mot mönstret innan den används — den kommer utifrån,
   och ska inte kunna bli vad som helst. */
function kronDjupLank(){
  var per=null;
  try{
    var q=new URLSearchParams(location.search||'');
    per=q.get('kronika');
  }catch(e){
    var m=(location.search||'').match(/[?&]kronika=([^&]+)/);
    if(m)per=decodeURIComponent(m[1]);
  }
  if(!per||!/^\d{4}(-\d{2})?$/.test(per))return false;
  _kronDjup=true;
  /* Länken i pushen pekar på en bestämd period — öppna den i notisvyn, som är
     där man läser dem numera. */
  try{openNotiser();}catch(e){}
  try{notOppna(per);}catch(e){}
  kronPost(per).then(function(){
    try{renderNotiser();}catch(e){}
    /* Rulla fram kortet — i en lång insiktssida ligger krönikan längst ned. */
    setTimeout(function(){
      try{
        var el=document.querySelector('.kr-r.on');
        if(el&&el.scrollIntoView)el.scrollIntoView({block:'center',behavior:'smooth'});
      }catch(e){}
    },260);
  });
  /* Rensa adressen så en omladdning inte hoppar dit igen. */
  try{
    if(history&&history.replaceState)history.replaceState(null,'',location.pathname);
  }catch(e){}
  return true;}
var _kronDjup=false;
/* Ser efter om något nytt skrivits. Krönikan ändras normalt två gånger i
   månaden, men "Skriv om" kan köras när som helst — och då ska knappen
   uppdateras utan att man startar om.

   Fem minuter i bakgrunden, och genast när man tar upp telefonen igen: det är
   då man faktiskt tittar, och ett anrop per uppvaknande är billigt. */
var KRON_KOLL=5*60000;
async function kronKoll(force){
  if(!appKan())return;
  if(document.hidden&&!force)return;
  if(!force&&_kron&&Date.now()-_kronAt<KRON_KOLL)return;
  var fore=_kron?JSON.stringify(_kron.manader||[])+JSON.stringify(_kron.ar||[]):'';
  var j=await kronLista(true);
  if(!j)return;
  var efter=JSON.stringify(j.manader||[])+JSON.stringify(j.ar||[]);
  /* Rita om Insikter bara när något faktiskt ändrats — annars rycker vyn till
     var femte minut medan man läser. */
  if(efter!==fore){
    try{
      var v=$('view-insikter');
      if(v&&v.classList&&!v.classList.contains('hidden'))renderInsikter();
    }catch(e){}
  }}
async function kronLista(force){
  if(!force&&_kron&&Date.now()-_kronAt<10*60000)return _kron;
  try{
    var j=await appGet('/kronika');
    if(!j||!j.manader)throw new Error('tomt svar');
    _kron=j;_kronAt=Date.now();_kronFel=null;
    try{krNotisUppdatera();}catch(e){}
    /* INGEN autoutfällning. Listan börjar hopfälld, och NY-märket räcker för
       att visa var det nya finns. En post som fäller ut sig själv flyttar
       resten av listan under fingret precis när man ska trycka. */
    return j;
  }catch(e){_kronFel=(e&&e.message)||String(e);return null;}}
async function kronPost(period){
  if(_kronPost[period])return _kronPost[period];
  try{
    var j=await appGet('/kronika?period='+encodeURIComponent(period));
    if(!j||!j.period)throw new Error('tomt svar');
    _kronPost[period]=j;return j;
  }catch(e){_kronFel=(e&&e.message)||String(e);return null;}}
/* Vilka år som är utfällda. Innevarande år är öppet från början — det är där
   det nya finns — men posterna i det är ändå stängda. */
/* Allt stängt från början, även innevarande år. NY-märket på årsraden visar var
   det nya finns — då behöver inget stå öppet i förväg. */
var _kronArState=null;
function kronArOppen(y){
  if(_kronArState===null)_kronArState={};
  return !!_kronArState[String(y)];}
function kronArTog(y){
  kronArOppen(y);
  y=String(y);
  if(_kronArState[y])delete _kronArState[y];
  else _kronArState[y]=1;
  /* Fälls året ihop ska en öppen post inuti det inte ligga kvar dold. */
  if(!_kronArState[y]&&_kronVald&&String(_kronVald).slice(0,4)===y)_kronVald=null;
  try{renderInsikter();}catch(e){}}
function kronOppna(p){
  /* Märket släcks när posten öppnas, inte när den stängs. */
  if(_kronVald!==p){kronLastSatt(p);try{krNotisUppdatera();}catch(e){}}
  _kronVald=(_kronVald===p)?null:p;
  if(_kronVald&&!_kronPost[_kronVald]){
    kronPost(_kronVald).then(function(){renderInsikter();});
  }
  renderInsikter();}

var KRON_MAN=['januari','februari','mars','april','maj','juni','juli',
  'augusti','september','oktober','november','december'];
/* Versal begynnelsebokstav i datan, inte bara via CSS. Det som kopieras eller
   läses upp ska se likadant ut som det som visas. */
function kronVersal(t){var x=String(t||'');return x?x.charAt(0).toUpperCase()+x.slice(1):x;}
function kronNamn(p){
  if(!p)return '';
  if(p.length===4)return p;
  var d=p.split('-');
  return kronVersal((KRON_MAN[+d[1]-1]||p)+' '+d[0]);}
function kronKwh(v){return v==null?'–':num(v,0)+' kWh';}
function kronKr(v){return v==null?'–':num(v,0)+' kr';}

/* Siffrorna som kompakt rutnat. Bara det som finns visas — en rad med streck
   ar brus, inte information. */
/* Förkortningar. En etikett som inte får plats klipps annars mitt i ordet, och
   "Självförsörj…" säger mindre än "Självförs.". Listan är kort med flit: bara
   de som faktiskt är för långa. */
var KR_KORT={'Självförsörjning':'Självförs.','Dyraste timmen':'Dyrast',
  'Billigaste':'Billigast','Kraftigaste by':'Kraftigast by','Poolen varmast':'Pool max',
  'Pooldygn >26°':'Pooldygn >26','Källarens värde':'Källarvärde',
  'Dygn >100 kWh':'Dygn >100','Vin in / ut':'Vin in/ut'};
function krKort(t){return KR_KORT[t]||t;}

/* Rapporten kommer som ren text: en rubrikrad först, sedan en rad per ämne med
   en emoji som ledtecken. Att bara sätta white-space:pre-line ger en klump.

   Här delas den i sina beståndsdelar i stället: rubriken blir rubrik, emojin
   flyttas ut i en egen kolumn så att alla rader börjar på samma ställe, och
   siffror med enhet får svagt tyngre stil så att blicken hittar dem. Inget
   innehåll ändras — bara hur det sätts. */
function kronRapport(txt){
  var rader=String(txt||'').split('\n').map(function(r){return r.trim();})
    .filter(function(r){return r.length;});
  if(!rader.length)return '';
  /* Tre slags rader, och skillnaden är hela läsupplevelsen:
       rad 1          → rubrik
       rad 2          → ingress, större och ljusare
       emoji först    → höjdpunkt, indragen med sitt tecken i egen kolumn
       övrigt         → brödtext i löpande stycken
     Förut behandlades allt som höjdpunkter, och texten läste sig som en
     kvittorulle: varje rad sann, ingen sammanhängande. */
  var h='<div class="kr-rap">';
  rader.forEach(function(r,i){
    var m=r.match(/^([\u203C-\u3299\uD83C-\uDBFF\uDC00-\uDFFF\u2600-\u27BF\uFE0F\u2190-\u21FF]+)\s*(.*)$/);
    var ik=m?m[1]:'', txt2=m?m[2]:r;
    if(i===0){
      h+='<div class="kr-rh">'+(ik?('<span class="kr-rhi">'+esc(ik)+'</span>'):'')
        +'<span>'+esc(txt2)+'</span></div>';
      return;
    }
    if(i===1&&!ik){
      h+='<p class="kr-ing">'+kronTal(esc(txt2))+'</p>';
      return;
    }
    if(ik){
      h+='<div class="kr-rr">'
        +'<span class="kr-rri">'+esc(ik)+'</span>'
        +'<span class="kr-rrt">'+kronTal(esc(txt2))+'</span></div>';
      return;
    }
    /* kr-txt, INTE kr-p: den klassen var redan tagen av chevronen i
       krönikelistan, som är 12 px bred. Stycket ärvde bredden och bröt ett ord
       per rad. */
    h+='<p class="kr-txt">'+kronTal(esc(txt2))+'</p>';
  });
  return h+'</div>';}

/* Framhäv tal med enhet. Bara siffergrupper som följs av en enhet eller ett
   procenttecken — annars skulle datum och klockslag också bli feta, och då är
   ingenting framhävt. */
function kronTal(t){
  return String(t).replace(
    /(\d[\d\s\u00a0]*(?:[.,]\d+)?)\s?(kWh|kW|W|kr|öre|mm|m\/s|°C|°|%|h\b|st\b)/g,
    function(hel,tal,enh){return '<b class="kr-n2">'+tal.trim()+' '+enh+'</b>';});}

/* max = hur många rutor som ska visas. Ordningen nedan ÄR prioriteringen:
   de mest talande värdena först, så att sex rutor alltid ger de sex mest
   intressanta och inte de sex som råkade komma först i objektet. */
/* ===== Kul att veta =====
   Rakt av ur postens egna siffror — inga pahittade fakta. Jamforelserna ar
   sadana man kan kanna igen: mil i bilen, koppar kaffe, badkar vatten. Bara
   de som faktiskt gar att rakna ut visas, och de valjs deterministiskt sa att
   samma manad alltid ger samma rader. */
function kronKul(o,ar){
  if(!o)return [];
  /* num() ger "1453" och "5.0" — rå toFixed utan svensk formatering. I en
     mening som ska läsas högt måste det stå "1 453" och "5,0". */
  var r=[],n2=function(v,d){
    var t=num(v,d==null?0:d);
    if(t==='–')return t;
    var p=t.split('.');
    p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0');
    return p.join(',');};
  var sol=o.sol&&o.sol.kwh, el=o.el||{}, v=o.vader||{};

  /* Hela meningar som säger något, inte lösryckta tal. Varje rad ska gå att
     läsa högt och landa — "1 453 mil" betyder ingenting, "räckt till 1 453 mil,
     ungefär Göteborg–Neapel" betyder något. Alla jämförelser är räknade ur
     postens egna siffror; inget är påhittat. */
  if(sol>0){
    var mil=sol/0.18/10;
    var vart=mil>4000?'motsvarande ett varv runt Medelhavet och lite till'
      :mil>1200?'ungefär Göteborg–Neapel'
      :mil>400?'ungefär Göteborg–Stockholm och tillbaka'
      :'ungefär Göteborg–Malmö';
    r.push({ik:'car-profile',t:'Solen som föll på taket hade räckt till <b>'
      +n2(mil)+' mil</b> i elbil — '+vart+'.'});
    r.push({ik:'coins',t:'Samma el hade kokat <b>'+n2(sol/0.02)
      +'</b> koppar kaffe, eller hållit en gammal glödlampa tänd i '
      +n2(sol/0.06/24/365,1)+' år.'});
  }
  if(o.sol&&o.sol.perKwp)
    r.push({ik:'sun',t:'Anläggningen gav <b>'+n2(o.sol.perKwp)
      +' kWh per installerad kilowatt</b> — det tal som gör den jämförbar med '
      +'andras, oavsett hur många paneler de har.'});
  if(o.sol&&o.sol.basta&&o.sol.samsta&&o.sol.samsta.kwh>0){
    var kvot=o.sol.basta.kwh/o.sol.samsta.kwh;
    if(kvot>1.5)r.push({ik:'chart-line',t:'Mellan bästa och sämsta dygnet skiljde det <b>'
      +n2(kvot,1)+' gånger</b>. Så mycket kan ett moln betyda.'});
  }
  if(el.saltKwh>0&&el.koptKwh>0){
    var kv=el.saltKwh/el.koptKwh;
    r.push({ik:'lightning',t:'För varje kilowattimme du köpte sålde du <b>'
      +n2(kv,1)+'</b> tillbaka.'});
  }
  if(el.netto!=null&&el.netto>0)
    r.push({ik:'coins',t:'Elräkningen blev en <b>intäkt på '+n2(el.netto)
      +' kr</b> — nätet betalade dig för att ha huset här.'});
  if(v.nederbord>0){
    var lit=v.nederbord*100;
    r.push({ik:'drop',t:'<b>'+n2(lit)+' liter</b> regn föll på panelytan, ungefär '
      +n2(lit/150)+' badkar. Gratis fönsterputs.'});
  }
  if(v.max&&v.min&&v.max.temp!=null&&v.min.temp!=null)
    r.push({ik:'thermometer',t:'Termometern rörde sig <b>'+n2(v.max.temp-v.min.temp,1)
      +' grader</b> mellan kallast och varmast.'});
  if(o.bil&&o.bil.kwh>0)
    r.push({ik:'car-profile',t:'Bilarna drack <b>'+n2(o.bil.kwh)+' kWh</b>, vilket räcker '
      +n2(o.bil.kwh/0.18/10)+' mil'
      +(sol>0?(' — '+Math.round(Math.min(100,o.bil.kwh/sol*100))+' % av vad taket gav.'):'.')});
  if(o.vin&&o.vin.in!=null&&o.vin.ut!=null){
    var dd=o.vin.in-o.vin.ut;
    r.push({ik:'drop-half-bottom',t:dd>0
      ? ('Källaren växte med <b>'+dd+' flaskor</b> — fler in än ut, som vanligt.')
      : (dd<0 ? ('Källaren krympte med <b>'+Math.abs(dd)+' flaskor</b>. Det har druckits.')
              : 'Källaren står stilla: lika många in som ut.')});
  }
  return r.slice(0,ar?5:4);}

function kronKulHTML(o,ar){
  var l=kronKul(o,ar);
  if(!l.length)return '';
  /* Samma uppmärkning som artikelns höjdpunkter, inte ett eget block med ram
     omkring. Blocket ska läsas som artikelns sista avsnitt — det är där en
     tidningsartikel brukar sätta talen i perspektiv — och inte som en faktaruta
     hängd bredvid. */
  var h='<div class="kul"><div class="kr-h2">Kul fakta</div>';
  l.forEach(function(x){
    h+='<p class="kr-txt kr-emo"><span class="kr-emi">'+icon(x.ik)+'</span>'+x.t+'</p>';});
  return h+'</div>';}
/* ===== Popup pa en notisruta =====
   Tryck pa en ruta ger det som ligger bakom talet: hur det raknats fram,
   detaljerna som inte far plats i rutan, och jamforelsen mot foregaende period
   dar den finns.

   Nagon graf over manaden gar INTE att rita: posterna innehaller sammanfattade
   varden, inte dygnsserier, och Insights racker inte bakat for att hamta dem i
   efterhand. Att rita en kurva av fyra punkter vore att latsas veta mer an vi
   gor. */
var _krPop=null;
function krPopStang(){
  _krPop=null;
  var e=$('krpop');if(e&&e.parentNode)e.parentNode.removeChild(e);}
function krPop(nyckel,period){
  var o=_kronPost[period];if(!o)return;
  var d=krPopData(nyckel,o,String(period).length===4);
  if(!d)return;
  krPopStang();
  var h='<div class="krpop-bak" id="krpop" onclick="if(event.target===this)krPopStang()">'
    +'<div class="krpop"><button class="krpop-x" onclick="krPopStang()">×</button>'
    +'<div class="krpop-h"><span class="krpop-i">'+icon(d.ik||'circle')+'</span>'+esc(d.rubrik)+'</div>'
    +'<div class="krpop-v">'+d.varde+'</div>';
  if(d.rader&&d.rader.length){
    h+='<div class="krpop-l">';
    d.rader.forEach(function(r){
      h+='<div class="krpop-r"><span>'+esc(r[0])+'</span><b>'+r[1]+'</b></div>';});
    h+='</div>';
  }
  if(d.info)h+='<div class="krpop-t">'+d.info+'</div>';
  h+='</div></div>';
  var w=document.createElement('div');w.innerHTML=h;
  document.body.appendChild(w.firstChild);
  _krPop=nyckel;}

function krPopData(k,o,ar){
  var n=function(v,d){return v==null?'–':num(v,d==null?0:d);};
  var dat=function(x){return x&&x.datum?kronDat(x.datum):'';};
  var el=o.el||{},v=o.vader||{},sol=o.sol||{};
  var P={
    sol:{rubrik:'Solproduktion',ik:'sun',varde:n(sol.kwh)+' kWh',
      rader:[['Bästa dygnet',sol.basta?(n(sol.basta.kwh)+' kWh '+dat(sol.basta)):'–'],
             ['Sämsta dygnet',sol.samsta?(n(sol.samsta.kwh)+' kWh '+dat(sol.samsta)):'–'],
             ['Dygn över 100 kWh',sol.dygnOver100!=null?sol.dygnOver100:'–'],
             ['Per installerad kW',sol.perKwp!=null?(n(sol.perKwp)+' kWh/kW'):'–']],
      info:'Summan av dygnsmaxen ur Insights, inte av vad dashboarden råkat se. '
        +'<b>Per installerad kW</b> delar med anläggningens 19,44 kWp och är det tal '
        +'som gör den jämförbar med andras.'},
    kopt:{rubrik:'Köpt el',ik:'lightning',varde:n(el.koptKwh)+' kWh',
      rader:[['Kostnad',el.koptKr!=null?(n(el.koptKr)+' kr'):'–'],
             ['Dyraste timmen',el.dyrast?(num(el.dyrast.pris,2)+' kr '+dat(el.dyrast)+' kl '+el.dyrast.timme):'–'],
             ['Billigaste timmen',el.billigast?(num(el.billigast.pris,2)+' kr '+dat(el.billigast)+' kl '+el.billigast.timme):'–']],
      info:'Mätarställningens ökning under perioden. Priserna kommer från Tibber och '
        +'är vad du faktiskt betalade, inte en uppskattning.'},
    salt:{rubrik:'Såld el',ik:'lightning',varde:n(el.saltKwh)+' kWh',
      rader:[['Ersättning',el.saltKr!=null?(n(el.saltKr)+' kr'):'–'],
             ['Netto',el.netto!=null?((el.netto>=0?'+':'')+n(el.netto)+' kr'):'–']],
      info:'Netto är ersättningen minus elkostnaden. Ett plustal betyder att '
        +'elräkningen blev en intäkt för perioden.'},
    sjalv:{rubrik:'Självförsörjning',ik:'house',varde:(el.sjalv!=null?n(el.sjalv):'–')+' %',
      rader:[['Producerat',n(sol.kwh)+' kWh'],['Köpt',n(el.koptKwh)+' kWh'],
             ['Sålt',n(el.saltKwh)+' kWh']],
      info:'Hur stor del av husets förbrukning som var egen el. Förbrukningen '
        +'härleds som <b>produktion − såld + köpt</b>. Skilj den från '
        +'<b>egenanvändning</b>, som är hur stor del av produktionen som stannade i huset.'},
    varm:{rubrik:'Varmast',ik:'thermometer-hot',varde:(v.max?num(v.max.temp,1):'–')+' °C',
      rader:[['Datum',v.max?dat(v.max):'–'],
             ['Kallast',v.min?(num(v.min.temp,1)+' °C '+dat(v.min)):'–'],
             ['Medel',v.medel!=null?(num(v.medel,1)+' °C'):'–'],
             ['Dygn över 25°',v.dygnOver25!=null?v.dygnOver25:'–']],
      info:'Dygnsmax ur utomhusgivaren. Medelvärdet är över alla mätpunkter i '
        +'perioden, inte över dygnsmaxen — annars hade det legat för högt.'},
    regn:{rubrik:'Nederbörd',ik:'drop',varde:(v.nederbord!=null?num(v.nederbord,1):'–')+' mm',
      rader:[['På takets panelyta',v.nederbord!=null?(n(v.nederbord*100)+' liter'):'–'],
             ['Kraftigaste by',v.by?(num(v.by.ms,1)+' m/s '+dat(v.by)):'–']],
      info:'1 mm regn är 1 liter per kvadratmeter. Panelytan är ungefär 100 m².'},
    bil:{rubrik:'Bilarna',ik:'car-profile',varde:(o.bil?n(o.bil.kwh):'–')+' kWh',
      rader:[['Ungefär',o.bil?(n(o.bil.kwh/0.18/10)+' mil'):'–']],
      info:'Summan av laddboxens mätare. Sträckan är räknad på 0,18 kWh/km, vilket '
        +'stämmer med båda bilarna inom några procent.'},
    pool:{rubrik:'Poolen',ik:'swimming-pool',varde:(o.pool&&o.pool.varmast?num(o.pool.varmast.temp,1):'–')+' °C',
      rader:[['Varmast',o.pool&&o.pool.varmast?dat(o.pool.varmast):'–'],
             ['Dygn över 26°',o.pool&&o.pool.dygnOver26!=null?o.pool.dygnOver26:'–']],
      info:'Dygnsmax ur pooltemperaturen.'},
    vin:{rubrik:'Vinkällaren',ik:'drop-half-bottom',
      varde:(o.vin?(o.vin.in+' in / '+o.vin.ut+' ut'):'–'),
      rader:[['Värde',o.vin&&o.vin.varde!=null?(n(o.vin.varde)+' kr'):'–'],
             ['Förändring',o.vin?((o.vin.in-o.vin.ut>=0?'+':'')+(o.vin.in-o.vin.ut)+' flaskor'):'–']],
      info:'Ur vinkällarappens register.'}
  };
  return P[k]||null;}

/* Datum ur en post. Årsposter har hela datum (2025-07-14) medan demodata och
   vissa månadsposter bara har period+dag (2026-07-14 respektive 2025-14).
   Utan den här kontrollen blev det "NaN/14". */
function kronDat(d){
  var p=String(d||'').split('-');
  if(p.length>=3&&p[1]&&p[2])return Number(p[2])+'/'+Number(p[1]);
  if(p.length===2&&p[1])return 'den '+Number(p[1]);
  return String(d||'');}
function kronRuta(o,max){
  var r=[];
  /* Samma uppställning som rutorna på startsidan: ikon till vänster, texten i
     en egen kolumn till höger. Varje ruta har ALLTID en ikon — utan den blir
     rutnätet en vägg av versaler där ingenting går att hitta med blicken.
     Stilen är krönikans egen, bara layouten är gemensam. */
  /* Ordningen i koden är inte prioriteringen — den följer datastrukturen.
     Med ett uttryckligt prio-tal ger sex rutor de sex MEST TALANDE värdena
     och inte de sex som råkar komma först i objektet. */
  /* pop = vilken popup rutan öppnar. Utan nyckel är rutan bara en siffra. */
  var lagg=function(namn,varde,extra,ik,farg,prio,pop){
    if(varde==null||varde==='–')return;
    r.push({p:(prio||99),h:'<div class="kr-c'+(pop?' kan':'')+'"'
      +(pop?(' onclick="krPop(\''+pop+'\',\''+esc(o.period)+'\')"'):'')+'>'
      +'<span class="kr-ic" style="color:'+(farg||'var(--faint)')+'">'
      +icon(ik||'circle')+'</span>'
      +'<span class="kr-tx">'
      +'<span class="kr-l">'+esc(krKort(namn))+'</span>'
      +'<span class="kr-v">'+varde+'</span>'
      +(extra?('<span class="kr-x">'+extra+'</span>'):'')
      +'</span></div>'});};
  if(o.sol){
    lagg('Sol',kronKwh(o.sol.kwh),o.sol.basta?('bäst '+num(o.sol.basta.kwh,0)+' kWh '+o.sol.basta.datum.slice(8)+'/'+(+o.sol.basta.datum.slice(5,7))):null,'sun','var(--solar)',1,'sol');
    if(o.sol.dygnOver100)lagg('Dygn >100 kWh',o.sol.dygnOver100,null,'sun','var(--solar)',7);
  }
  if(o.el){
    lagg('Köpt',kronKwh(o.el.koptKwh),o.el.koptKr!=null?kronKr(o.el.koptKr):null,'lightning','var(--hot)',2,'kopt');
    lagg('Sålt',kronKwh(o.el.saltKwh),o.el.saltKr!=null?kronKr(o.el.saltKr):null,'lightning','var(--ok)',3,'salt');
    if(o.el.sjalv!=null)lagg('Självförsörjning',o.el.sjalv+' %',null,'house','var(--ok)',4,'sjalv');
    if(o.el.dyrast)lagg('Dyraste timmen',num(o.el.dyrast.pris,2)+' kr',
      o.el.dyrast.datum.slice(8)+'/'+(+o.el.dyrast.datum.slice(5,7))+' kl '+o.el.dyrast.timme,'lightning','var(--hot)',8);
    if(o.el.billigast)lagg('Billigaste',num(o.el.billigast.pris,2)+' kr',
      o.el.billigast.datum.slice(8)+'/'+(+o.el.billigast.datum.slice(5,7))+' kl '+o.el.billigast.timme,'lightning','var(--ok)',9);
  }
  if(o.vader){
    if(o.vader.max)lagg('Varmast',num(o.vader.max.temp,1)+' °',o.vader.max.datum.slice(8)+'/'+(+o.vader.max.datum.slice(5,7)),'thermometer-simple','var(--hot)',5,'varm');
    if(o.vader.min)lagg('Kallast',num(o.vader.min.temp,1)+' °',o.vader.min.datum.slice(8)+'/'+(+o.vader.min.datum.slice(5,7)),'thermometer-simple','var(--blue)',10);
    if(o.vader.dygnOver25!=null&&o.vader.dygnOver25>0)lagg('Dygn >25°',o.vader.dygnOver25,null,'sun','var(--gold)',14);
    if(o.vader.nederbord!=null)lagg('Nederbörd',num(o.vader.nederbord,1)+' mm',null,'drop','var(--rain)',6,'regn');
    if(o.vader.by)lagg('Kraftigaste by',num(o.vader.by.ms,1)+' m/s',o.vader.by.datum.slice(8)+'/'+(+o.vader.by.datum.slice(5,7)),'wind','var(--blue)',11);
  }
  if(o.pool){
    if(o.pool.varmast)lagg('Poolen varmast',num(o.pool.varmast.temp,1)+' °',null,'drop','var(--cyan)',13,'pool');
    if(o.pool.dygnOver26)lagg('Pooldygn >26°',o.pool.dygnOver26,null,'drop','var(--cyan)',15);
  }
  if(o.vin){
    if(o.vin.in||o.vin.ut)lagg('Vin in / ut',o.vin.in+' / '+o.vin.ut,null,'drop-half-bottom','var(--hot)',16,'vin');
    if(o.vin.varde!=null)lagg('Källarens värde',kronKr(o.vin.varde),null,'drop-half-bottom','var(--hot)',17);
  }
  if(o.bil&&o.bil.kwh)lagg('Bilarna',kronKwh(o.bil.kwh),null,'car','var(--blue)',12,'bil');
  r.sort(function(a,b){return a.p-b.p;});
  if(max&&r.length>max)r=r.slice(0,max);
  var ut=r.map(function(x){return x.h;});
  return ut.length?('<div class="kr-grid">'+ut.join('')+'</div>'):'';}

/* Jamforelsen mot forra aret. Finns den inte visas ingenting alls. */
function kronJmf(o){
  if(!o.jmf)return '';
  var namn={sol:'Sol',kopt:'Köpt el',salt:'Såld el',nederbord:'Nederbörd'};
  var r=[];
  for(var k in o.jmf){
    var x=o.jmf[k],upp=x.pct>=0;
    r.push('<span class="kr-j"><b>'+esc(namn[k]||k)+'</b> '
      +'<span style="color:'+(upp?'var(--ok)':'var(--hot)')+'">'
      +(upp?'+':'')+num(x.pct,0)+' %</span></span>');
  }
  return r.length?('<div class="kr-jmf">Mot samma månad i fjol: '+r.join(' · ')+'</div>'):'';}

function kronHTML(){
  if(!_kron)return '';
  /* cmpHeadHtml i stället för en naken ww-h: då får kortet exakt samma
     rubrikutrymme som Zambretti och Medeleffekt, och en i-knapp på köpet. */
  var h='<section class="panel">'+cmpHeadHtml('Sammanfattningar','arkiv, månad för månad',
    '<p style="margin:0 0 8px"><b>Arkivet.</b> Nya texter läses under notisklockan '
    +'i toppraden; här ligger alla kvar, även de du sopat undan därifrån.</p>'
    +'<p style="margin:0 0 8px"><b>En text per månad och år.</b> Siffrorna räknas '
    +'först ur Homey Insights, och Gemini skriver sedan av dem — aldrig av en '
    +'tidigare text. Annars vore det en modell som sammanfattar en annan, och '
    +'varje gissning skulle förstärkas utan att någon märkte det.</p>'
    +'<p style="margin:0 0 8px">Månaden skrivs på morgonen sista dygnet och räknas '
    +'om den 1:a med hela underlaget. Året skrivs 31 december, ur de tolv '
    +'månadsposterna — inte ur en ny genomsökning.</p>'
    +'<p style="margin:0"><b>NY</b> sitter tills posten öppnats, eller i tre dygn. '
    +'Läsningen sparas i den här webbläsaren; att du läst på plattan säger '
    +'ingenting om vad du sett i telefonen.</p>');

  /* Textrutan för en post — samma oavsett om det är ett år eller en månad. */
  var kropp=function(period){
    var o=_kronPost[period];
    if(!o)return '<div class="kr-o"><div class="ins-empty">Hämtar…</div></div>';
    var s2='<div class="kr-o">'+kronRuta(o)+kronJmf(o);
    if(o.text){
      /* Rapporten är radbruten och har emoji som ankare — visas som den skickas. */
      s2+='<div class="kr-t">'+kronRapport(o.text)+'</div>';
    }else{
      s2+='<div class="kr-t saknas">Ingen text skriven. Appen skriver den när '
        +'perioden räknas — saknas Gemini-nyckeln blir posten bara siffror.</div>';
    }
    return s2+'</div>';};

  var manadsRad=function(x){
    var vald=(_kronVald===x.period), ny=kronArNy(x);
    var mn=KRON_MAN[+x.period.slice(5,7)-1]||x.period;
    var s2='<div class="kr-r kr-m'+(vald?' on':'')+(ny?' ny':'')
      +'" onclick="kronOppna(\''+x.period+'\')">'
      +'<span class="kr-n">'+esc(kronVersal(mn))+'</span>'
      +'<span class="kr-s">'+(x.sol!=null?num(x.sol,0)+' kWh':'')+'</span>'
      +'<span class="kr-p">'+(vald?'▴':'▾')+'</span></div>';
    if(vald)s2+=kropp(x.period);
    return s2;};

  /* Månaderna hör till sitt år. Förut låg alla under varandra i en enda lista,
     och med tre år blir det trettiosex rader att leta i. */
  var perAr={};
  (_kron.manader||[]).forEach(function(x){
    var y=String(x.period).slice(0,4);
    (perAr[y]=perAr[y]||[]).push(x);});
  var arPost={};
  (_kron.ar||[]).forEach(function(x){arPost[String(x.period)]=x;});

  var alla={};
  Object.keys(perAr).forEach(function(y){alla[y]=1;});
  Object.keys(arPost).forEach(function(y){alla[y]=1;});
  var arLista=Object.keys(alla).sort().reverse();
  if(!arLista.length){
    return h+'<div class="ins-empty">Inga poster ännu. Den första skrivs sista '
      +'dagen i månaden.</div></section>';
  }

  arLista.forEach(function(y){
    var oppen=kronArOppen(y);
    var ap=arPost[y];
    var man=(perAr[y]||[]).slice().sort(function(a,b){
      return String(b.period).localeCompare(String(a.period));});
    var kwh=0,harKwh=false;
    man.forEach(function(m){if(m.sol!=null){kwh+=m.sol;harKwh=true;}});
    var nyIAr=(ap&&kronArNy(ap))||man.some(kronArNy);

    h+='<div class="kr-r kr-y'+(oppen?' on':'')+(nyIAr?' ny':'')
      +'" onclick="kronArTog(\''+y+'\')">'
      +'<span class="kr-n">'+esc(y)+'</span>'
      +'<span class="kr-s">'+(harKwh?num(kwh,0)+' kWh':'')
      +'<span class="kr-mn">'+man.length+' mån</span></span>'
      +'<span class="kr-p">'+(oppen?'▴':'▾')+'</span></div>';

    if(!oppen)return;
    h+='<div class="kr-yo">';
    /* Årstexten först, sedan månaderna — årets sammanfattning är ramen. */
    if(ap){
      var vald=(_kronVald===y);
      h+='<div class="kr-r kr-at'+(vald?' on':'')+(kronArNy(ap)?' ny':'')
        +'" onclick="kronOppna(\''+y+'\')">'
        +'<span class="kr-n">Året '+esc(y)+'</span>'
        +'<span class="kr-s">'+(ap.sol!=null?num(ap.sol,0)+' kWh':'')+'</span>'
        +'<span class="kr-p">'+(vald?'▴':'▾')+'</span></div>';
      if(vald)h+=kropp(y);
    }
    if(man.length)man.forEach(function(m){h+=manadsRad(m);});
    else h+='<div class="ins-empty">Inga månader för '+esc(y)+'.</div>';
    h+='</div>';
  });
  return h+'</section>';}

/* ===== Medeleffekt =====
   Manadens forbrukning fordelad jamnt over dess timmar — vad huset skulle dra
   om det drog lika mycket dygnet runt. Rakningen sker i appen, ur samma
   kronikeposter som allt annat; tva vagar till samma tal ar tva tal som kan
   glida isar.

   Aret valjs i en lista i stallet for att alla ar listas under varandra. Kortet
   ska ligga bland de andra utan att svalja sidan. */
var _eff=null,_effAt=0,_effFel=null,_effAr=null;
async function effHamta(force){
  if(!force&&_eff&&Date.now()-_effAt<10*60000)return _eff;
  try{
    var j=await appGet('/effekt');
    if(!j||!j.ar)throw new Error('tomt svar');

/* Svep at sidan tar bort. Ren pointer-hantering: inga bibliotek, och den far
   inte stjala vanliga tryck. */
function notSvep(){
  var rader=document.querySelectorAll('#not-body .not-r');
  Array.prototype.forEach.call(rader,function(r){
    var x0=0,y0=0,dx=0,drar=false,id=null;
    r.addEventListener('pointerdown',function(e){
      x0=e.clientX;y0=e.clientY;dx=0;drar=false;id=e.pointerId;
      r.style.transition='';});
    r.addEventListener('pointermove',function(e){
      if(id===null||e.pointerId!==id)return;
      var ax=e.clientX-x0, ay=e.clientY-y0;
      /* Vagrat svep bara nar rorelsen ar tydligt vagrat — annars kan man inte
         rulla listan med fingret. */
      if(!drar&&Math.abs(ax)>12&&Math.abs(ax)>Math.abs(ay)*1.5)drar=true;
      if(!drar)return;
      dx=ax;
      r.style.transform='translateX('+dx+'px)';
      r.style.opacity=String(Math.max(0.25,1-Math.abs(dx)/220));
      try{e.preventDefault();}catch(_){}});
    var slut=function(){
      if(id===null)return;
      id=null;
      if(!drar){r.style.transform='';r.style.opacity='';return;}
      r.style.transition='transform .18s ease,opacity .18s ease';
      if(Math.abs(dx)>90){
        r.style.transform='translateX('+(dx>0?400:-400)+'px)';
        r.style.opacity='0';
        var per=r.getAttribute('data-per');
        setTimeout(function(){notBort(per);try{krNotisUppdatera();}catch(e){}renderNotiser();},170);
      }else{
        r.style.transform='';r.style.opacity='';
      }
      drar=false;};
    r.addEventListener('pointerup',slut);
    r.addEventListener('pointercancel',slut);
    r.addEventListener('pointerleave',slut);
  });}

/* Hur tavlan kommer se ut när jämförelsen öppnat. Siffrorna är påhittade men
   rimliga: barometern brukar hålla jämna steg med SMHI på regn och tappa på
   solighet, där en molnfri morgon inte säger något om eftermiddagen. */
function zamDemoPoang(){
  return {n:24,nb:24,nk:24,nsb:22,nsk:22,bf:11,
    zb:0.191,sb:0.148,zk:0.213,sk:0.166,
    hnb:22,hnk:22,hzb:0.188,hsb:0.147,hzk:0.209,hsk:0.163};}
function zamKort(){
  var Z=zambretti();
  if(!Z){
    /* RATTAT v188: kortet forsvann helt utan 3h-trend. En funktion som tyst utelamnar
       sig sjalv gar inte att hitta - man vet inte om den ar trasig, avstangd eller
       aldrig byggd. Nu syns den och sager vad den vantar pa. */
    var P=zamPress();
    if(P==null)return '';        /* ingen barometer alls - da finns inget att vanta pa */
    var kvar=zamVantar();
    var h0='<section class="panel">'+cmpHeadHtml('Zambretti 1915','barometern mot SMHI',zamInfoHTML(null));
    h0+='<div class="ins-hero-lab">'+Math.round(P)+'&nbsp;hPa</div>';
    h0+='<div class="ins-hero-row"><div class="ins-hero-big" style="font-size:1.1em;opacity:.7">Samlar tryckhistorik</div></div>';
    h0+='<div class="isub" style="margin-top:8px;opacity:.8">Domen kräver tryckets '
      +'<b>3-timmarstrend</b> – utan den vet 1915 års tabell inte om vädret är på väg upp eller ner. '
      +(kvar>0?('Cirka <b>'+(kvar>=60?(Math.floor(kvar/60)+' h '+(kvar%60)+' min'):(kvar+' min'))+'</b> kvar.')
              :'Trenden borde finnas – tryckloggen kan ha luckor.')
      +'</div>';
    return h0+'</section>';
  }
  /* Exempelläget byter BARA ut poängen, inte domen. Dagens väder är verkligt även
     när man tittar på hur tavlan kommer se ut. */
  var G=_zamDemo?zamDemoPoang():zamPoang();
  var n2=function(v){return v==null?'–':v.toFixed(2).replace('.',',');};
  var pil=Z.tr>0.6?'stigande':(Z.tr<-0.6?'fallande':'stillastående');
  var h='<section class="panel">'+cmpHeadHtml('Zambretti 1915','barometern mot SMHI',zamInfoHTML(G));
  h+='<div class="ins-hero-lab">'+Z.bok+' · '+Math.round(Z.hpa)+'&nbsp;hPa, '+pil
    +' '+(Z.tr>0?'+':'')+n2(Z.tr)+'&nbsp;hPa/3h</div>';
  h+='<div class="ins-hero-row"><div class="ins-hero-big" style="font-size:1.3em">'+esc(Z.txt)+'</div></div>';
  if(_zamDemo)h+='<div class="isub" style="margin-top:8px;color:var(--gold);font-weight:700">'
    +'Exempel · så här ser tavlan ut efter '+ZAM_MIN+' jämförbara dygn. Siffrorna nedan är påhittade.</div>';

  var vinn=function(a,b){return (a==null||b==null)?'' : (a<b?' style="color:var(--ok)"':'');};
  var rad=function(namn,n,v1,v2){
    return '<tr><td style="padding:4px 0">'+namn+'<span style="opacity:.55"> · '+n+' dygn</span></td>'
      +'<td style="text-align:right"'+vinn(v1,v2)+'>'+n2(v1)+'</td>'
      +(v2===undefined?'':'<td style="text-align:right"'+vinn(v2,v1)+'>'+n2(v2)+'</td>')+'</tr>';};
  /* Barometerns egen traffbild. Den finns sa fort det finns utfall att jamfora mot,
     och fylls pa direkt av de aterskapade dygnen. */
  if(G.nb>=3||G.nk>=3){
    h+='<div class="isub" style="margin-top:12px;font-weight:800;opacity:.9">Barometern mot verkligheten</div>';
    h+='<table style="width:100%;border-collapse:collapse;font-size:.92em;margin-top:4px">';
    h+='<tr style="opacity:.7;text-align:left"><th style="padding:4px 0">Lägre är bättre</th>'
      +'<th style="text-align:right">Zambretti</th></tr>';
    h+=rad('Regn (Brier)',G.nb,G.zb);
    h+=rad('Solighet (medelfel)',G.nk,G.zk);
    h+='</table>';
  }
  /* Sjalva tavlan mot SMHI - bara dygn dar BADA lamnat en prognos, annars jamfors
     olika manga dygn med varandra och siffrorna sager ingenting. */
  if(G.hnb>=ZAM_MIN||G.hnk>=ZAM_MIN){
    h+='<div class="isub" style="margin-top:12px;font-weight:800;opacity:.9">Mot SMHI · samma dygn</div>';
    h+='<table style="width:100%;border-collapse:collapse;font-size:.92em;margin-top:4px">';
    h+='<tr style="opacity:.7;text-align:left"><th style="padding:4px 0">Lägre är bättre</th>'
      +'<th style="text-align:right">Zambretti</th><th style="text-align:right">SMHI</th></tr>';
    h+=rad('Regn (Brier)',G.hnb,G.hzb,G.hsb);
    h+=rad('Solighet (medelfel)',G.hnk,G.hzk,G.hsk);
    h+='</table>';
  }else{
    h+='<div class="isub" style="margin-top:10px;opacity:.75">Mot SMHI öppnar efter '+ZAM_MIN
      +' jämförbara dygn · '+Math.max(G.hnb,G.hnk)+' klara.</div>';
  }
  return h+'</section>';}

/* Poolen mot havet - vad uppvarmningen faktiskt koper dig. */
function havKort(){
  var pool=cap(DEV.pooltemp,'measure_temperature'), hav=FEED.sea;
  if(hav==null&&isDemo())hav=17.4;              /* demo: havet i juli pa vastkusten */
  if(pool==null||!isFinite(pool)||hav==null||!isFinite(hav))return '';
  var d=pool-hav, n1=function(v){return v.toFixed(1).replace('.',',');};
  var h='<section class="panel"'+'>'+cmpHead('Poolen mot havet','skillnaden','Poolen mot havet. Skillnaden är vad uppvärmningen köper dig – havet är gratis. På hösten vänder det: havet har en hel sommars värme lagrad och håller den längre än poolen gör. Havstemperaturen är en väderprognos för din badpunkt, inte en mätning i vattnet.');
  h+='<div class="ins-hero-row"><div class="ins-hero-big">'+(d>=0?'+':'')+n1(d)+'&nbsp;<small>°C</small></div></div>';
  h+='<div class="ins-hero-txt">Poolen '+n1(pool)+'&nbsp;°C, havet '+n1(hav)+'&nbsp;°C.</div>';
  var txt;
  if(d>4)txt='Det är vad uppvärmningen köper dig. Havet är gratis och '+n1(d)+'&nbsp;°C kallare.';
  else if(d>1)txt='Poolen leder, men knappt. Just nu gör uppvärmningen inte mycket mer än havet gör av sig självt.';
  else if(d>-1)txt='Jämnt lopp. Havet har hunnit ikapp – poolvärmen betalar för någon tiondel.';
  else txt='Havet är varmare än poolen. Det händer på hösten: havet har en sommars värme lagrad och släpper den långsamt.';
  h+='<div class="isub" style="margin-top:8px">'+txt+'</div>';
  return h+'</section>';}

  var curMs=SEED_MONTHS.filter(function(m){return m.m.slice(0,4)===String(cy);}).map(function(m){return m.m.slice(5);});
  var MB=MABBR;
  function mval(a,k){if(!a)return null;if(k==='solbatt')return (a.sol||0)+(a.batt||0);return a[k];}
  function spMetric(yr,k,hib){if(!curMs.length)return null;var shared=SEED_MONTHS.filter(function(m){return m.m.slice(0,4)===String(yr)&&curMs.indexOf(m.m.slice(5))>=0;}).map(function(m){return m.m.slice(5);});if(!shared.length)return null;var b=periodAgg(yr,shared),a=periodAgg(cy,shared);if(!a||!b)return null;var bv=mval(b,k),av=mval(a,k);if(bv==null||av==null||bv===0)return null;var diff=Math.round((av-bv)/bv*100);var good=(diff===0?null:(hib?diff>0:diff<0));var cls=(diff===0?'ze':(good?'up':'dn'));var arrow=diff<0?'\u25bc':diff>0?'\u25b2':'\u25cf';var val=(diff===0?arrow+' 0 %':arrow+' '+Math.abs(diff)+' %');return {year:yr,diff:diff,cls:cls,first:b.first,last:b.last,val:val};}
  var spL=function(s){return s.first!=null?(' \u00b7 '+MB[s.first-1]+((s.last&&s.last!==s.first)?('\u2013'+MB[s.last-1]):'')):'';};
  function hero(title,k,iconName,iconCol,hib,info){

  h+='<div class="cmp-hero-note">Procenttalen jämför samma månader föregående år.</div>';

    h+='<div class="ww-h">Jämförelse per år <span style="color:var(--faint);font-weight:600;text-transform:none;letter-spacing:0"> \u00b7 kWh</span></div>';
    h+='<div class="cmp">';

  return h;

function metricVal(a,k){if(!a)return null;if(k==='solbatt')return (a.sol||0)+(a.batt||0);return a[k];}
function lastFullMonth(){var n=new Date();var m=n.getMonth()+1;var done=(n.getDate()===new Date(n.getFullYear(),n.getMonth()+1,0).getDate());return done?m:(m-1);}
function metricDiff(yr,key,hib,mode){
  var cy=new Date().getFullYear(),av,bv;
  if(mode==='total'){
    var a=yearStats(cy),b=yearStats(yr);if(!a||!b)return null;
    av=metricVal(a,key);bv=metricVal(b,key);
  }else{
    var curMs=SEED_MONTHS.filter(function(m){return m.m.slice(0,4)===String(cy);}).map(function(m){return m.m.slice(5);});
    if(mode==='wholemonth'){curMs=curMs.filter(function(mm){return (+mm)<=lastFullMonth();});}
    if(!curMs.length)return null;
    var shared=SEED_MONTHS.filter(function(m){return m.m.slice(0,4)===String(yr)&&curMs.indexOf(m.m.slice(5))>=0;}).map(function(m){return m.m.slice(5);});
    if(!shared.length)return null;
    var pa=periodAgg(cy,shared),pb=periodAgg(yr,shared);if(!pa||!pb)return null;
    av=metricVal(pa,key);bv=metricVal(pb,key);
  }
  if(bv==null||av==null||bv===0)return null;
  var diff=Math.round((av-bv)/bv*100),good=(diff===0?null:(hib?diff>0:diff<0));
  var cls=(diff===0?'ze':(good?'up':'dn')),arrow=diff<0?'\u25bc':diff>0?'\u25b2':'\u25cf';
  return {diff:diff,cls:cls,val:(diff===0?arrow+' 0 %':arrow+' '+Math.abs(diff)+' %')};
}
function samePeriodDiff(yr,key,hib){
  var cy=new Date().getFullYear();
  var curMs=SEED_MONTHS.filter(function(m){return m.m.slice(0,4)===String(cy);}).map(function(m){return m.m.slice(5);});
  if(!curMs.length)return null;
  var shared=SEED_MONTHS.filter(function(m){return m.m.slice(0,4)===String(yr)&&curMs.indexOf(m.m.slice(5))>=0;}).map(function(m){return m.m.slice(5);});
  if(!shared.length)return null;
  var b=periodAgg(yr,shared),a=periodAgg(cy,shared);if(!a||!b)return null;
  var bv=metricVal(b,key),av=metricVal(a,key);if(bv==null||av==null||bv===0)return null;
  var diff=Math.round((av-bv)/bv*100),good=(diff===0?null:(hib?diff>0:diff<0));
  var cls=(diff===0?'ze':(good?'up':'dn')),arrow=diff<0?'\u25bc':diff>0?'\u25b2':'\u25cf';
  return {diff:diff,cls:cls,val:(diff===0?arrow+' 0 %':arrow+' '+Math.abs(diff)+' %')};
}

  for(var i=0;i<raw.length;i++){var p=raw[i];if(p&&p.v!=null&&isFinite(p.v)&&p.t>=cut)n++;if(n>=2)return true;}

/* Kombinerad graf: alla valda zoner i samma diagram, egen färg per zon. */
function multiTempSVG(){
  var W=300,H=136,padL=4,padR=4,padT=10,padB=16;
  var out=[],t0=Infinity,t1=-Infinity,ylo=Infinity,yhi=-Infinity,cut=Date.now()-24*3600000;
  for(var i=0;i<TEMPS.length;i++){var t=TEMPS[i];if(!tempOn(t.k))continue;
    var raw=t.ser()||[],seg=[];
    for(var j=0;j<raw.length;j++){var pt=raw[j];if(pt&&pt.v!=null&&isFinite(pt.v)&&pt.t>=cut)seg.push(pt);}
    if(seg.length<2)continue;
    t0=Math.min(t0,seg[0].t);t1=Math.max(t1,seg[seg.length-1].t);
    for(var m=0;m<seg.length;m++){if(seg[m].v<ylo)ylo=seg[m].v;if(seg[m].v>yhi)yhi=seg[m].v;}
    out.push({t:t,s:seg});}
  if(!out.length)return '<div class="viz-empty">Samlar in data… grafen fylls på efter hand.</div>';
  var tr=(t1-t0)||1,yr=(yhi-ylo)||1,mp=yr*0.12;ylo-=mp;yhi+=mp;yr=yhi-ylo;
  var X=function(v){return padL+(v-t0)/tr*(W-padL-padR);},Y=function(v){return padT+(1-(v-ylo)/yr)*(H-padT-padB);};
  var g='<svg class="tg-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  for(var q=0;q<out.length;q++){var o=out[q],d='';
    for(var r=0;r<o.s.length;r++)d+=(r?'L':'M')+X(o.s[r].t).toFixed(1)+' '+Y(o.s[r].v).toFixed(1)+' ';
    g+='<path d="'+d+'" fill="none" stroke="'+tempCol(o.t)+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';}
  g+='</svg>';
  var span=Math.round(tr/3600000);
  g+='<div class="viz-cap">senaste ~'+(span>=1?span+' h':'stunden')+' · '+num(ylo+mp,1)+'–'+num(yhi-mp,1)+' °C</div>';
  return g;}

/* ---- energipanel (källmix + kort) ---- */
function renderEnergy(){
  const p=PAL[curTheme]||PAL.dark;
  const solarW=cap(DEV.solar,'measure_power')||0,houseW=houseNowW(),pulseW=cap(DEV.pulse,'measure_power');
  const battPct=cap(DEV.battery,'measure_battery'),battW=cap(DEV.battery,'measure_power')||0,bs=cap(DEV.battery,'battery_charging_state');
  const importing=pulseW!=null&&pulseW>0,exporting=pulseW!=null&&pulseW<0,charging=bs==='charging',discharging=bs==='discharging';
  setT('en-house',houseW==null?'–':W(houseW));
  // källmix mot förbrukning
  const gridIn=importing?pulseW:0, battIn=discharging?Math.abs(battW):0;
  /* Solen till huset kan aldrig vara mer än vad panelerna faktiskt producerar just nu.
     Utan taket blev varje oförklarad watt (mätglapp, batteri som inte rapporterar
     'discharging') felaktigt märkt som sol – t.ex. mitt i natten. */
  const solToHouse=Math.max(0,Math.min(solarW,(houseW||0)-gridIn-battIn));
  const T=(houseW&&houseW>0)?(gridIn+battIn+solToHouse):0;
  const pct=v=>T>0?(v/T*100):0;
  const ms=$('mix-sol'),mb=$('mix-batt'),mg=$('mix-grid');
  if(ms&&ms.style)ms.style.width=pct(solToHouse).toFixed(1)+'%';
  if(mb&&mb.style)mb.style.width=pct(battIn).toFixed(1)+'%';
  if(mg&&mg.style)mg.style.width=pct(gridIn).toFixed(1)+'%';
  const of=T>0?((solToHouse+battIn)/T):(exporting?1:0);
  const badge=$('en-self-badge');if(badge){badge.textContent=houseW==null?'–':Math.round(of*100)+'% självförsörjt';if(badge.classList)badge.classList.toggle('imp',of<0.999&&!exporting);}
  // legend
  const leg=$('mix-leg');if(leg){leg.innerHTML=
    '<span><i style="background:'+p.sun+'"></i>Sol '+W(solToHouse)+'</span>'
    +'<span><i style="background:'+p.cyan+'"></i>Batteri '+W(battIn)+'</span>'
    +'<span><i style="background:'+p.warm+'"></i>Nät '+W(gridIn)+'</span>';}
  renderTiles('energy');
}

/* Kopt mot salt som en tvafargad stapel - brickan SJALV ar stapeln. Storst varde
   fyller mest. Tryck cyklar perioden, langtryck redigerar som vanligt.
   krcmp = 1x1, krcmp2 = 1x2 (hela raden). */
var KRC_PER=['day','week','month','year'];
/* Fyllningens styrka. 26% var for svagt for att se skillnaden pa en ljus skarm i
   solljus - nu 42% som standard, och stallbar i Installningar > Utseende. */
function krcOpac(){var v=(CFG&&CFG.krcOp);return (v!=null&&isFinite(v))?Math.max(.1,Math.min(.8,v)):0.42;}
var KRC_LBL={day:'idag',week:'veckan',month:'månaden',year:'i år'};
function krcPer(cfg){var p=cfg&&cfg.per;return KRC_PER.indexOf(p)>=0?p:'month';}
function krcCykla(g,i){

  saveGrid(g); renderTiles(g);}
/* Grundfärgspar att välja bland – köpt/sålt får var sin ton ur samma familj. */
var KRC_COLS={
  varm:{kop:'#d08770',sal:'#ebcb8b',namn:'Varm'},
  kyla:{kop:'#81a1c1',sal:'#88c0d0',namn:'Sval'},
  skog:{kop:'#bf616a',sal:'#a3be8c',namn:'Röd/grön'},
  guld:{kop:'#b48ead',sal:'#ebcb8b',namn:'Lila/guld'},
