    start_url:base, scope:dir, lang:"sv", dir:"ltr",
    display:"standalone", display_override:["standalone","minimal-ui"],
    /* FAST värde. Tidigare lästes det ur localStorage, vilket gjorde manifestet

       manifestet i bakgrunden och bygger om appen när något ändras — ett

/* Ligger det en riktig manifest.webmanifest bredvid HTML-filen används den i
   stället. Det är den robusta vägen: Chrome slipper blob- och data-adresser, och
   ikonerna blir riktiga filer. Somliga Android-telefoner bygger bara en genväg
   (med adressfält) i stället för en app när manifestet inte går att hämta om. */
window.pwaTryFileManifest=function(){try{
  var sida=location.href.split("#")[0].split("?")[0];

  fetch(adr,{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).then(function(j){

    /* start_url MASTE peka pa den har sidan. Star det "./" i filen men HTML-filen

       oppnar Chrome appen pa en adress som inte finns - resultatet blir en vanlig
       flik med adressfalt. Hellre falla tillbaka pa det inbaddade manifestet, som
       alltid pekar ratt, och tala om exakt vad som behover andras. */

<script>
/* ===== v737: PLATTLÄGET PÅ TELEFONEN = VÄGGPLATTAN I MINIATYR =====
   Förut räknade "Visa som: Platta" på telefonen fram en egen layoutbredd med
   telefonens proportioner (fitScreen, tabprev). Resultatet var en platta – men
   inte väggplattan: annan bredd, annan höjd, och telefonens mediafrågor och vh
   gällde fortfarande.

   Nu laddas dashboarden i en iframe som är EXAKT lika stor som väggplattans
   fönster (CSS-px) och skalas ned som en bild till telefonens skärm. Inne i
   ramen är fönstret alltså väggplattans: samma bredd, höjd, mediafrågor och
   kioskberäkningar. Måtten kommer från enhetslistan (enheter_v1, fältet vy) som
   väggplattan själv skriver och som synkas via Homey. Saknas de – väggplattan
   har inte kört v737 ännu – används 800×1280.

   Värdsidan kör inget av dashboarden: <plaintext> får parsern att läsa resten
   av filen som ren text, så inga fler skript körs här. Ramen själv känns igen på
   window.self!==window.top och ?ram=1. */
(function(){try{
  if(window.self!==window.top)return;
  var q=location.search||'';
  if(/[?&]ram=1(&|$)/.test(q))return;
  var vm=null;try{vm=localStorage.getItem('view_mode_v1');}catch(e){}
  var platta=(vm==='tablet')||(vm!=='phone'&&q.indexOf('mode=tablet')>=0);
  var w0=window.innerWidth||9999,h0=window.innerHeight||9999;
  if(!platta||Math.min(w0,h0)>=600)return;
  var W=0,H=0,kalla='standard';
  try{var o=JSON.parse(localStorage.getItem('enheter_v1')||'{}'),b=null;
    for(var id in o){var e=o[id];if(e&&e.vagg&&e.vy&&(!b||(e.sist||0)>(b.sist||0)))b=e;}
    var m=b?/^(\d+)\D+(\d+)$/.exec(String(b.vy)):null;
    if(m){W=+m[1];H=+m[2];kalla='väggplattan';}
  }catch(e){}
  if(!(Math.min(W,H)>=600)){W=800;H=1280;kalla='standard';}
  window.__plattRam={W:W,H:H,kalla:kalla};
  var src=location.href.replace(/#.*$/,'');
  src+=(src.indexOf('?')>=0?'&':'?')+'ram=1'+(location.hash||'');
  window.plattRamPassa=function(){try{
    var f=document.getElementById('platt-ram');if(!f)return;
    var vw=window.innerWidth||W,vh=window.innerHeight||H;
    var sc=Math.min(vw/W,vh/H);
    f.style.transform='translate('+((vw-W*sc)/2).toFixed(1)+'px,'+((vh-H*sc)/2).toFixed(1)+'px) scale('+sc.toFixed(5)+')';
    window.__plattRam.sc=sc;
  }catch(e){}};
  /* Kanterna runt ramen får dashboardens egen bakgrund (följer temat), så
     telefonen ser ut som plattan och inte som en film med svarta band. */
  window.plattRamFarg=function(){try{
    var f=document.getElementById('platt-ram'),d=f&&f.contentDocument;if(!d||!d.body)return;
    var c=getComputedStyle(d.body).backgroundColor;
    if(c&&c!=='rgba(0, 0, 0, 0)'){document.body.style.background=c;f.style.background=c;}
    /* Statusraden (theme-color) likaså – ramen håller sin egen i takt med temat. */
    var mi=d.querySelector('meta[name="theme-color"]'),mu=document.querySelector('meta[name="theme-color"]');
    if(mi&&mu&&mi.content&&mu.content!==mi.content)mu.content=mi.content;
  }catch(e){}};
  /* Temat sätts en stund efter load – läs om strax efter, sedan var 30:e s. */
  window.plattRamLaddad=function(){window.plattRamFarg();setTimeout(window.plattRamFarg,1500);setTimeout(window.plattRamFarg,5000);};
  setInterval(window.plattRamFarg,30000);
  window.addEventListener('resize',window.plattRamPassa);
  window.addEventListener('orientationchange',function(){setTimeout(window.plattRamPassa,250);});
  document.addEventListener('DOMContentLoaded',window.plattRamPassa);
  document.write('<style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;'
    +'overscroll-behavior:none;background:#000}'
    +'#platt-ram{position:fixed;left:0;top:0;border:0;display:block;transform-origin:0 0;background:#000}</style>'
    +'<iframe id="platt-ram" title="Dashboard som väggplattan" width="'+W+'" height="'+H+'"'
    +' style="width:'+W+'px;height:'+H+'px" allow="fullscreen; geolocation; clipboard-write; screen-wake-lock"'
    +' onload="window.plattRamLaddad()" src="'+src.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'"></iframe>'
    +'<script>window.plattRamPassa()<\/script><plaintext style="display:none">');
}catch(e){}})();
</script>

/* Eget klassnamn: sp-nu användes redan av den gamla prisraden, och två regler
   med samma namn i samma band är precis den sortens krock som är svår att se. */
/* Talet står i plattan, inte ovanpå den — därför statiskt läge och färg mot
   panelbakgrunden. Enheten i mindre stil efter, som i de andra talen. */
.sp-punkt{white-space:nowrap;font-size:calc(1em*var(--spnum,1));font-weight:850;
  letter-spacing:-.02em;line-height:1;color:var(--pc,var(--ink));pointer-events:none}
.sp-punkt .sp-enh{font-size:.72em;font-weight:700;opacity:.75;margin-left:1px}
/* Punkten är en AVLÅNG platta, inte en prick: den bär en siffra och ska gå att
   läsa. Absolut placerad, så den påverkar inte bandets höjd. Storleken styrs av
   --spslide, siffran av --spnum — samma reglage som förut, nu kopplade till de
   element som faktiskt finns. */
/* Formen från första versionen: en mörk platta med färgad kant och mjuk skugga,
   inte en fylld prick. Talet läses mot panelbakgrunden i stället för mot en
   stark färg, och kanten tar färg efter priset — billigt grönt, dyrt rött.
   Radien är soldottens, så ändarna rundas lika mycket som pricken. */
/* Markören får inte hamna ovanpå högsta-talet. Skalan är egen kolumn, så
   punkten kan hållas innanför den. */
.sp-track{overflow:visible}
/* Skalans tjocklek: soluppgångens höjd i det aktuella läget, skalad av reglaget
   "Skala". Ett fast 9 px gjorde prisskalan lika tjock i alla lägen medan
   solens var 3, 6 eller 9 — de såg olika ut på plattan. */
.pband-slim .sp-track{height:calc(var(--ds-h)*var(--spscale,1))}
.daystrip{position:relative}
.ds-live{display:flex;align-items:center;gap:var(--ds-gap);flex:1 1 auto;min-width:0}
/* Skalan får SAMMA luft mot talen som ikonerna har, alltså --ds-gap. Ett eget
   tal här gjorde att avståndet ikon–tal och tal–skala blev olika, vilket syntes
   som en skev rad. Och eftersom gapet redan ligger mellan flexbarnen behövs
   ingen extra marginal alls. */
.ds-live>.ds-track{margin:0}
.ds-pm{display:none;position:absolute;top:50%;transform:translateY(-50%);align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:20px;line-height:1;width:34px;height:34px;border-radius:50%;cursor:pointer;z-index:4;touch-action:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#ds-minus{left:8px}#ds-plus{right:8px}
.daystrip.scrubbing{padding-top:14px;padding-bottom:30px}
.daystrip.scrubbing .ds-pm{display:flex;width:40px;height:40px;font-size:24px}
.daystrip.scrubbing .ds-live{margin:0 48px}
/* Historikläget i knappraden. */
/* Egen luft runt texten så den inte klibbar mot knapparna, och overflow så den
   kortas i stället för att tränga undan dem. */
/* Centrerad mot SKÄRMENS mitt. Absolut placering mot knappraden gav fel läge —
   raden är en flexbehållare vars bredd följer innehållet, inte fönstret.
   position:fixed mot vyn träffar mitten oavsett hur breda knapparna är. */
/* Centrerad mot RADEN via absolut placering. flex-wrap är uteslutet — en egen
   test vaktar att toppraden aldrig bryts, eftersom kiosklägets höjdberäkning
   räknar med en rad. Statusknappen göms i historikläget, så texten har plats. */
.en-hist{display:none;position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);justify-content:center;
  align-items:center;gap:6px;
  font-size:13px;font-weight:750;color:var(--ink);white-space:nowrap;
  pointer-events:none;z-index:60}
body.histmod .en-top{position:relative}
.en-hist .ds-time-ic{display:inline-flex;width:14px;height:14px;color:var(--gold)}
.en-hist .ds-time-ic .ic{width:14px;height:14px}
body.histmod .en-doljhist{display:none!important}
/* Statusknappen ("OFFLINE"/"LIVE") göms också — den säger samma sak som
   Live-knappen och tog platsen där tiden ska stå. */
body.histmod .en-status{display:none!important}
body.histmod .en-top{position:relative}
body.histmod .en-hist{display:flex}
body.histmod .en-notis{background:var(--blue)!important;color:#fff!important}
/* Klocka och antal hör inte hit när knappen är en LIVE-knapp. */
body.histmod .en-notis .en-notis-n{display:none!important}
body.histmod .en-notis::after{display:none!important}
/* Med text blir knappen bredare — annars klipps "Live" i en rund ikonknapp. */
.en-notis.en-live{width:auto!important;min-width:0;padding:0 12px!important;gap:6px}
/* Inget annat än blixt och text i live-läget. Notisräknaren och den gyllene
   ramen ritas av krNotisEn och kan komma tillbaka vid en omritning — göm dem
   här så de aldrig syns oavsett i vilken ordning det sker. */
.en-notis.en-live .en-cmp-n,.en-notis.en-live .en-notis-n,
.en-notis.en-live .badge,.en-notis.en-live sup,
.en-notis.en-live small,.en-notis.en-live b{display:none!important}
.en-notis.en-live.har{border-color:transparent!important;box-shadow:none!important}
.en-livetxt{font-weight:750;font-size:13px;letter-spacing:.01em}
body.histmod .en-notis .ic{color:#fff}
.en-livetxt{margin-left:6px;font-weight:750}
/* Den gamla tidsvisningen i remsan är överflödig när tiden står i toppen. */
body.histmod .ds-time{display:none!important}
/* +/- SMÄLTER IN i remsans ändar: genomskinlig bakgrund och dämpad text i
   stället för ljusa knappar som drar blicken från skalan. Rätt väljare är
   .ds-pm — id:na finns men klassen är den som styr. */
.ds-pm{background:transparent!important;border-color:transparent!important;
  color:var(--faint)!important;box-shadow:none!important;font-weight:700!important}
.ds-pm:active{background:var(--inset)!important;color:var(--dim)!important}
/* Den gamla Live-knappen i remsan är överflödig — knappraden har en nu, och två
   knappar för samma sak intill varandra är bara förvirrande. */
body.histmod #ds-livebtn,body.histmod .ds-livebtn{display:none!important}
.ds-time{display:none;align-items:center;gap:6px;flex:0 0 auto;font-size:13px;font-weight:750;color:var(--ink);white-space:nowrap;position:absolute;left:50%;bottom:7px;transform:translateX(-50%)}
.ds-time .ds-time-ic{display:inline-flex;width:14px;height:14px;color:var(--gold)}.ds-time .ds-time-ic .ic{width:14px;height:14px}
#en-status{position:relative}
#ds-livebtn,.ds-livebtn{display:none;position:absolute;right:-4px;top:50%;transform:translateY(-50%);z-index:5;align-items:center;justify-content:center;border:none;background:var(--blue);color:#fff;font-weight:750;font-size:12px;border-radius:999px;padding:6px 15px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.ds-tick{position:absolute;top:50%;width:2px;height:11px;background:var(--dim);transform:translate(-50%,-50%);border-radius:2px;opacity:.7}
.ds-tick.set{background:var(--violet)}
.ds-tick:not(.set){background:var(--gold)}
#timebar{position:fixed;top:10px;left:50%;transform:translate(-50%,-140%);z-index:60;display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.35);border-radius:999px;padding:7px 8px 7px 14px;transition:transform .25s ease;pointer-events:none}
#timebar.on{transform:translate(-50%,0);pointer-events:auto}
#timebar .tb-ic{display:inline-flex;width:17px;height:17px;color:var(--gold)}#timebar .tb-ic .ic{width:17px;height:17px}
#timebar .tb-t{font-size:13px;font-weight:650;white-space:nowrap}
#timebar .tb-x{border:none;background:var(--blue);color:#fff;font-weight:700;font-size:12px;border-radius:999px;padding:6px 13px;cursor:pointer}
#timebar .tb-pm{border:1px solid var(--line);background:var(--inset);color:var(--ink);font-weight:800;font-size:17px;line-height:1;width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ds-sun{position:absolute;top:50%;width:var(--ds-sun);height:var(--ds-sun);border-radius:50%;background:var(--gold);transform:translate(-50%,-50%);box-shadow:0 0 12px 3px rgba(249,226,175,.55);transition:left .9s ease}
/* EFTER .ds-sun med flit. Samma specificitet, och den som står sist vinner —
   låg .sp-dot före skrev .ds-sun över bakgrund och skugga och plattan blev en
   fylld prick igen. */
.sp-dot{width:auto;min-width:calc(var(--ds-sun)*2.4*var(--spslide,1));height:auto;
  padding:calc(3px*var(--spslide,1)) calc(9px*var(--spslide,1));
  border-radius:calc(var(--ds-sun)/2);
  background:var(--panel-b);border:1.5px solid var(--pc,var(--gold));
  box-shadow:0 2px 8px rgba(0,0,0,.28);
  display:inline-flex;align-items:baseline;gap:2px;justify-content:center}

.ds-rem{color:var(--gold);white-space:nowrap;font-weight:600}

.insight{display:flex;gap:13px;align-items:flex-start;padding:15px 19px;margin-bottom:13px;background:var(--ins-grad);border-color:var(--ins-border)}
.ins-ic{width:20px;height:20px;color:var(--violet);flex:0 0 auto;margin-top:1px}
.ins-text{font-size:13.5px;color:var(--ink);line-height:1.5}.ins-text.dim{color:var(--dim);font-style:italic}

.ringcard{padding:clamp(14px,2vw,20px) clamp(10px,1.8vw,18px) clamp(8px,1.2vw,12px);margin-bottom:13px;position:relative;overflow:hidden}
.rc-head{display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.rc-live{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:600}
.rc-live .d{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pulse 2.6s ease-out infinite}
#flow{margin-top:4px}
#flow-svg{width:100%;height:auto;max-height:430px;display:block}
.lk-base{stroke:var(--svg-track)}.f-track{stroke:var(--svg-track)}
.f-disc{fill:var(--disc-fill);stroke:var(--svg-stroke)}.f-orb{fill:var(--orb-fill);stroke:var(--svg-stroke)}
#ring-own{stroke:var(--ok)}#ring-imp{stroke:var(--warm)}#batt-ring{stroke:var(--cyan)}
.orbg-c{stop-color:var(--ok)}.sg-c{stop-color:var(--gold)}
.node-ic{color:var(--ink)}
.f-coin{fill:var(--orb-fill);stroke:var(--svg-stroke)}.f-coin.sun{stroke:rgba(249,226,175,.5)}
.lk-flow{animation:lkflow 1.25s linear infinite}
@keyframes lkflow{to{stroke-dashoffset:-30}}
.orb-glow{animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.16}50%{opacity:.30}}
#ring-own,#ring-imp{filter:drop-shadow(0 0 5px var(--ok))}
#ring-imp{filter:drop-shadow(0 0 5px var(--warm))}
#ring-knob{fill:var(--ok);stroke:var(--orb-fill);transition:opacity .4s ease}
#batt-glow{animation:bpulse 1.9s ease-in-out infinite}
#batt-glow.fast{animation-duration:1.1s}
@keyframes bpulse{0%,100%{opacity:.12}50%{opacity:.30}}
.fv{font-size:13px;fill:var(--ink);font-weight:700}
.fv-lg{font-size:15px;fill:var(--ink);font-weight:700}
.fv-house{font-size:26px;fill:var(--ink);font-weight:800;letter-spacing:-.04em}
.fself{font-size:11.5px;font-weight:700}
.flb{font-size:8.5px;fill:var(--dim);letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.flb2{font-size:8px;fill:var(--faint);letter-spacing:.14em;text-transform:uppercase;font-weight:600}

.pband{padding:clamp(16px,2vw,24px);margin-bottom:13px}
/* SAMMA stil som soluppgångsremsan (.daystrip): samma innerkant, samma
   textstorlek och färg. De två banden ligger ovanpå varandra på startsidan och
   ska läsas som samma sorts element. Höjden är kvar som eget mått eftersom
   priskurvan behöver mer plats än en soldot. */
/* RAD, inte kolumn — som .daystrip. Med flex-direction:column hamnade priset
   under skalan i stället för bredvid, och hela remsan blev dubbelt så hög som
   soluppgångens. */
/* INGEN fast höjd i px. Soluppgångsremsans höjd sätts på min-height av
   bandLika(), och --spbox skalar den — så inställningen fungerar som förut men
   utgår från remsans höjd i stället för ett eget tal. Att lämna --spbox utan
   verkan hade varit död kod som ser levande ut. */
/* overflow:visible. Sliden sticker ut över skalans ändar när priset ligger nära
   dygnets högsta eller lägsta, och overflow:hidden klippte den mitt itu. Bandet
   har inget innehåll som behöver klippas. */
.pband-slim{box-sizing:border-box;padding:24px;
  margin-bottom:13px;display:flex;flex-direction:row;align-items:center;gap:12px;
  overflow:visible;font-size:12px;color:var(--dim);font-weight:500}
/* Samma ikonstorlek som i soluppgångsremsan. */
.pband-slim .ic{width:17px;height:17px}
/* .daystrip har flera regler; de gällande är 24px i bas, 12px 16px på mobil och
   15px 16px i kiosk. Matcha de FAKTISKA värdena, inte den första regeln i
   filen — det var så jag först satte fel padding. */
body.mobile .pband-slim{padding:12px 16px}
.pband-slim .pb-row{display:flex;align-items:center;gap:9px}
.pband-slim .pb-ic{width:16px;height:16px;color:var(--blue);flex:0 0 auto}
.pband-slim .pb-ic svg{width:16px;height:16px}
.pband-slim .price-now{margin-top:0;flex:0 0 auto;align-items:baseline}
.pband-slim .price-now .big{font-size:clamp(19px,2.8vw,23px)}
.pband-slim .price-now .unit{font-size:11px}
.pband-slim .verdict{margin-left:auto;padding:4px 9px;font-size:11px}
.pband-slim .tide{margin-top:0;width:100%;display:flex;align-items:center}
.pband-slim .tide-track{position:relative;height:calc(8px*var(--spscale,1));margin-top:0;width:100%}
.ksband{box-sizing:border-box!important;height:calc(66px*var(--ksbox,1))!important;padding:0 15px!important;overflow:hidden}
/* Spotpris och köpt/sålt är två fristående rutor, var och en med hela ramen,
   alla fyra hörnen rundade och vanligt avstånd emellan. Ihopsyningen som fanns
   i v304–v321 är borttagen. */
.pb-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.pb-label{display:flex;align-items:center;gap:8px}.pb-label .ic{width:15px;height:15px;color:var(--blue)}
.price-now{display:flex;align-items:baseline;gap:9px;margin-top:12px}
.price-now .big{font-size:clamp(32px,5vw,46px);font-weight:800;line-height:.9;letter-spacing:-.035em}
.price-now .unit{font-size:13px;color:var(--dim);font-weight:600}
.verdict{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;font-size:12.5px;font-weight:700;border:1px solid transparent}
.verdict .ic{width:15px;height:15px}
/* Brickorna låg i Catppuccin-toner medan resten av sidan är Nord. Skillnaden
   syntes tydligast bredvid skalorna, som de sitter intill. */
.v-good{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok-t);
  border-color:color-mix(in srgb,var(--ok) 34%,transparent)}
.v-mid{background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--warm-t);
  border-color:color-mix(in srgb,var(--gold) 34%,transparent)}
.v-bad{background:color-mix(in srgb,var(--hot) 14%,transparent);color:var(--hot-t);
  border-color:color-mix(in srgb,var(--hot) 36%,transparent)}
.tide{margin-top:18px}
/* Spotprisets skala. Färgerna var hårdkodade i en helt annan palett — GitHubs
   gröna och en tegelröd — och skrek mot Nord-tonerna i resten av sidan. Nu
   byggs den av temats egna variabler, vilket också gör att den följer med när
   man byter mellan mörkt och ljust i stället för att sitta kvar. */
.tide-track{position:relative;height:10px;border-radius:6px;opacity:.95;
  background:linear-gradient(90deg,
    var(--ok) 0%,
    color-mix(in srgb,var(--ok) 55%,var(--gold)) 28%,
    var(--gold) 52%,
    color-mix(in srgb,var(--gold) 45%,var(--hot)) 74%,
    var(--hot) 100%)}
.tide-marker{position:absolute;top:50%;width:3px;height:24px;background:var(--ink);border-radius:2px;transform:translate(-50%,-50%);box-shadow:0 0 0 4px var(--marker-ring),0 0 14px 2px rgba(120,120,160,.4);transition:left .8s cubic-bezier(.2,.7,.2,1)}
.tide-scale{display:flex;justify-content:space-between;margin-top:9px;font-size:11.5px;color:var(--dim);font-weight:500}
.tide-scale b{color:var(--ink);font-weight:700}

.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:var(--pg-gap-y)}
.stat{padding:17px 19px;position:relative;transition:box-shadow .8s ease,border-color .25s}
.stat-fill,.en-chip .stat-fill{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;opacity:.30;pointer-events:none;transition:width .6s ease,background .6s ease;z-index:0}
.stat.has-fill,.en-chip.has-fill{position:relative;overflow:hidden}
.stat.has-fill>*:not(.stat-fill),.en-chip.has-fill>*:not(.stat-fill){position:relative;z-index:1}
.stat-st{margin-left:auto;width:17px;height:17px;flex:0 0 auto;display:inline-flex}.stat-st .ic{width:100%;height:100%}
.stat-h{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.stat-ic{width:26px;height:26px;display:inline-flex}.stat-ic .ic{width:100%;height:100%}
.stat.clickable{cursor:pointer;transition:.16s}.stat.clickable:hover{border-color:var(--svg-stroke);transform:translateY(-1px)}
.stat .v{font-size:clamp(21px,2.8vw,28px);font-weight:800;margin:0 0 3px;letter-spacing:-.03em}
.stat .v small{font-size:13px;color:var(--dim);font-weight:600}
.stat .meta{font-size:11px;color:var(--dim);font-weight:500}
/* Tom undertext ska inte ta plats. :empty träffar bara när det verkligen inte
   finns något inuti — en trendpil eller ett mellanslag räknas som innehåll. */
.stat .meta:empty{display:none}
.en-chip-s:empty{display:none}
/* Trendpilen: samma storlek som enheten, lite luft före, dämpad ton. */
/* MITTKOLUMN: mittkolumnen bär sina EGNA kantlinjer. Den gamla .wx2-div är
   absolut placerad på left:50% och kan bara vara en — den stängs av här. */
.wx2-harmitt .wx2-div{display:none}
/* FLEX, INTE GRID. Inte av principskäl: grid går inte att verifiera med
   wkhtmltoimage, och den här raden ville jag kunna titta på innan den
   levererades. Flex ger samma layout och går att mäta. */
.wx2-mitt{flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;gap:7px;
  padding:6px 16px;margin:8px 0;
  border-left:1px solid var(--line);border-right:1px solid var(--line)}
.wx2-m{display:flex;align-items:baseline;gap:9px}
/* Etiketten högerställd, värdet vänsterställt: då står alla tre värdena på en
   rak lodrät linje oavsett hur lång etiketten är. */
/* Fast bredd på etiketten: då står alla tre värdena på en rak lodrät linje
   oavsett hur lång etiketten är. */
.wx2-ml{width:44px;flex:0 0 auto;font-size:9.5px;font-weight:800;letter-spacing:.04em;
  text-transform:uppercase;color:var(--faint);text-align:right;white-space:nowrap}
.wx2-mv{font-size:15px;font-weight:800;color:var(--ink);white-space:nowrap;line-height:1}
.wx2-mv small{font-size:.62em;font-weight:700;color:var(--dim);margin-left:2px}
.wx2-hl.down{color:var(--blue)}.wx2-hl.up{color:var(--hot)}
.wx2-hl-ic{width:.72em;height:.72em;display:inline-flex;margin-right:3px}.wx2-hl-ic .ic{width:100%;height:100%}
/* v748: rutorna under väderkortet – samma kort som startsidans sex rutor. */
/* v753: rutorna går ut till kortets kant, så att avståndet mellan rutorna och
   kanten blir detsamma som på startsidan (rutnätets egna 8 px). Kortets
   padding är clamp(16px,2vw,21px) – samma uttryck här, negativt. */
.wx2-rutor{--kk:1;--wxk:clamp(16px,2vw,21px);grid-template-columns:repeat(3,minmax(0,1fr))}
/* Id + klass: .fl-tiles{margin:0} längre ner har samma specificitet som en
   ensam klass och vann annars. */
/* v754: .wx är en flexkolumn med 13 px mellanrum; rutorna drar upp sig 9 px
   så att luften ovanför dem (≈ 12 px till underraden + rutnätets 8 px) blir
   ungefär densamma som kortets egen överkant (Markus: "lite för stort"). */
#stats-vader.wx2-rutor{margin:-9px calc(-1*var(--wxk)) calc(-1*var(--wxk))!important}
/* v753: VÄDER OCH VIND SOM TVÅ LIKA HALVOR. Samma uppbyggnad på båda sidor,
   innehållet mitt i sin halva, en linje emellan. Specifikt (.wx2.wxv) så att
   äldre regler för .wx2-now/.wx2-wind (padding mot avdelaren, centrering-
   läget) inte rubbar symmetrin. */
.wx2.wxv{display:flex;align-items:center}
.wx2.wxv .wxv-halva{flex:1 1 0!important;min-width:0;display:flex;align-items:center;justify-content:center!important;
  gap:10px!important;padding:2px 4px!important;margin:0!important}
.wx2.wxv .wx2-now-txt,.wx2.wxv .wx2-wind-txt{flex:0 1 auto!important;min-width:0;text-align:left}
.wx2.wxv .wx2-line{flex-wrap:nowrap;align-items:center;min-height:36px}   /* samma höjd på båda sidor – raderna under linjerar */
.wx2.wxv .wx2-sub,.wx2.wxv .wx2-by{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.wx2.wxv .wx2-arrow{flex:0 0 auto}
.wxv-linje{flex:0 0 1px;align-self:stretch;margin:6px 0;background:var(--line)}
/* Lägst/högst: en liten stapel tätt intill temperaturen. */
.wx2-hlk{display:inline-flex;flex-direction:column;justify-content:center;gap:0;margin-left:7px!important;
  font-size:12.5px;font-weight:780;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;
  border-radius:8px;padding:2px 4px!important;margin-top:0!important;margin-bottom:0!important;margin-right:0!important;
  /* Centrerad på raden linjerar den med siffrorna inom en halv pixel (uppmätt
     i Chromium på telefon och platta, v754). */
  position:relative;top:0}
.wx2-hlk .wx2-hl{display:inline-flex;align-items:center}
/* v754: storleken sätts inline ur temperaturens (WXV_HL_ANDEL). */
.wx2-mv .tr-pil{font-size:.66em;margin-left:4px;font-style:normal;color:var(--dim)}
#stats-weather[hidden]{display:none!important}
/* Smalare än så får väder och vind gå före. */
@media (max-width:430px){.wx2-mitt{padding:6px 11px;gap:6px}
  .wx2-m{gap:7px}.wx2-mv{font-size:13.5px}.wx2-ml{width:38px;font-size:9px}}
@media (max-width:380px){.wx2-mitt{display:none}}
/* ===== ENHETSSTYRNING: RUM, LAMPOR OCH GARDINER (v515) =====
   Formerna kommer från Göteborgsdashboarden v1.33.0 och är avsiktligt lika:
   samma kortstorlek, samma vippa, samma reglage. Måtten är kopierade tal för
   tal, inte ritade om på fri hand.

   Luften följer knapprutans: tre gånger --pg-gap, alltså 9 px på mobil.
   --pg-gap är satt på body, inte på :root, så räkningen måste stå på body —
   annars slår var() i tomma luften och calc() ger ogiltig CSS. */
body{--rum-luft:calc(var(--pg-gap) * 3);--rum-h:19px}
.roomswrap{padding:var(--rum-luft)}
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));
  column-gap:var(--rum-luft);row-gap:var(--rum-luft)}
.room{padding:13px 14px;display:flex;flex-direction:column;gap:9px;cursor:pointer;transition:.16s;
  background:var(--inset);border:1px solid var(--line);border-radius:18px;margin:0;box-shadow:none}
.room.on{background:linear-gradient(180deg,rgba(235,203,139,.13),var(--panel-b));border-color:rgba(235,203,139,.32)}
.room-h{display:flex;align-items:center;gap:9px}
.room-ic{width:24px;height:24px;color:var(--faint);display:inline-flex;flex:0 0 auto}
.room-ic .ic{width:100%;height:100%}
.room.on .room-ic{color:var(--gold)}
.room-n{font-size:13.5px;font-weight:750;letter-spacing:-.01em;flex:1 1 auto;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room-sw{width:40px;height:23px;border-radius:999px;background:var(--inset);border:1px solid var(--line);
  flex:0 0 auto;position:relative;cursor:pointer;transition:.2s;padding:0;appearance:none}
.room-sw i{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--faint);transition:.2s}
.room-sw.on{background:rgba(235,203,139,.28);border-color:rgba(235,203,139,.5)}
.room-sw.on i{left:20px;background:var(--gold)}
.room-m{font-size:11px;color:var(--faint);font-weight:600;display:flex;gap:9px;flex-wrap:wrap}
.room-m b{color:var(--dim);font-weight:700}
.room-bar{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.room-bar i{display:block;height:100%;border-radius:2px;background:var(--gold);transition:width .5s ease}

/* Enhetsraden i popupen. */
.dv-row{display:flex;align-items:center;gap:10px;padding:9px var(--rum-h) 9px 0;border-bottom:1px solid var(--line-soft)}
.dv-row:last-child{border-bottom:0}
.dv-ic{width:28px;height:28px;border-radius:9px;background:var(--inset);display:inline-flex;align-items:center;
  justify-content:center;flex:0 0 auto;color:var(--faint)}
.dv-ic .ic{width:16px;height:16px}
.dv-row.on .dv-ic{color:var(--gold);background:rgba(235,203,139,.16)}
.dv-n{flex:1 1 auto;min-width:0;font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv-n small{display:block;font-size:10px;color:var(--faint);font-weight:600}
.dv-sw{width:40px;height:23px;border-radius:999px;background:var(--inset);border:1px solid var(--line);
  flex:0 0 auto;position:relative;cursor:pointer;transition:.2s;padding:0;appearance:none}
.dv-sw i{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--faint);transition:.2s}
.dv-sw.on{background:rgba(235,203,139,.28);border-color:rgba(235,203,139,.5)}
.dv-sw.on i{left:20px;background:var(--gold)}
/* Dimmern börjar där NAMNET börjar, inte vid radens kant: ikonen är 28 px och
   mellanrummet 10, alltså 38 px in. */
.dv-dim{width:calc(100% - 38px - var(--rum-h));margin-left:38px}
.dv-dim .slx{margin:0 0 6px}
/* Rummets huvudrad. Egen ram och lite mer tyngd, så det syns att den styr
   listan under — inte är ännu en lampa i mängden. */
.rum-master{border:1px solid var(--line);border-radius:16px;padding:4px 13px 11px;
  background:linear-gradient(180deg,rgba(129,161,193,.10),transparent);margin-bottom:4px}
.rum-master.on{border-color:rgba(235,203,139,.45);
  background:linear-gradient(180deg,rgba(235,203,139,.13),transparent)}
.rum-master .dv-row{border-bottom:0;padding:11px 6px 6px 0}
.rum-master .dv-n{font-size:15px;font-weight:780;letter-spacing:-.01em}
.rum-master .dv-n small{font-size:10.5px;font-weight:650}
.rum-master .dv-ic{width:32px;height:32px;border-radius:11px}
.rum-master .dv-ic .ic{width:18px;height:18px}
.rum-master.on .dv-ic{color:var(--gold);background:rgba(235,203,139,.18)}
.rum-master .slx{margin-left:6px;margin-right:6px}
.rum-master .sl-h{font-size:11.5px;color:var(--dim)}
.sl-h{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--faint);font-weight:650;margin:9px 0 3px}
.sl-h .ic{width:14px;height:14px}
.sl-h b{color:var(--dim);margin-left:auto}

/* EGET REGLAGE. <input type="range"> gick inte att tygla på telefonen: Chrome
   satte värdet trots preventDefault, och ett svep förbi kunde ändra ljuset.
   Det här är vanliga element utan eget beteende — värdet ändras BARA om
   dragningen börjar på pricken och är mer vågrät än lodrät. */
.slx{position:relative;height:34px;margin:2px 0 10px;touch-action:pan-y;user-select:none;
  max-width:100%;box-sizing:border-box}
.slx-spar{position:absolute;top:50%;left:0;right:0;height:5px;transform:translateY(-50%);
  border-radius:3px;background:var(--inset);border:1px solid var(--line);box-sizing:border-box}
.slx-fyll{position:absolute;top:50%;left:0;height:5px;transform:translateY(-50%);max-width:100%;
  border-radius:3px;background:linear-gradient(90deg,rgba(235,203,139,.55),var(--gold));pointer-events:none}
/* Pricken räknas från sin MITT, och mitten får bara röra sig mellan 13 px och
   bredd−13 px. Annars hänger halva pricken utanför rutan vid 100 %. */
.slx-prick{position:absolute;top:50%;width:26px;height:26px;transform:translate(-50%,-50%);
  border-radius:50%;background:var(--gold);border:2px solid var(--marker-ring);
  box-shadow:0 2px 6px rgba(0,0,0,.3);touch-action:none;cursor:grab}
.slx.drar .slx-prick{cursor:grabbing;box-shadow:0 0 0 7px rgba(235,203,139,.18),0 2px 6px rgba(0,0,0,.3)}

/* Gardiner: fasta lägen i stället för reglage. Ett skjutreglage är fel verktyg
   för en markis — den ska ändå bara till ett fåtal lägen. */
.gd{margin-bottom:6px}
.gd-h{align-items:center}
.gd-lagen{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
.gd-l{appearance:none;flex:1 1 0;min-width:62px;border:1px solid var(--line);background:var(--inset);
  color:var(--dim);font:inherit;font-size:12px;font-weight:700;border-radius:12px;padding:9px 6px;cursor:pointer;
  box-sizing:border-box}
.gd-l.on{background:rgba(129,161,193,.18);border-color:var(--blue);color:var(--blue)}
.gd-l:active{transform:scale(.97)}

/* Kvittens när ett skrivförsök misslyckas. Gottskär hade ingen toast alls —
   utan den blir ett misslyckat tryck helt tyst, och lampan verkar bara ha
   vägrat lyda. */
#rum-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);z-index:9999;
  background:var(--panel-b);border:1px solid var(--line);color:var(--ink);border-radius:12px;
  padding:9px 15px;font-size:12.5px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.35);
  opacity:0;pointer-events:none;transition:.2s}
#rum-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.dlg-body .gtv-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;
  max-width:260px;margin:4px auto 0;place-items:stretch}
.dlg-body .gtv-rad{display:flex;gap:7px;margin-top:7px}
.dlg-body .gtv-k{appearance:none;flex:1 1 0;min-width:0;height:54px;border:1px solid var(--line);
  background:var(--inset);color:var(--dim);font-family:var(--sans);font-size:15px;font-weight:700;
  border-radius:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  padding:0;box-sizing:border-box}
/* I KORSET ar varje ruta kvadratisk. Forut hade riktningarna fast hojd medan de
   runda var kvadratiska - da blev rutnatet ojamnt och korset sag skevt ut.
   Samma losning som Goteborg: aspect-ratio pa alla, ingen fast hojd. */
.dlg-body .gtv-pad .gtv-k{aspect-ratio:1;height:auto;width:100%}
/* Bakat och hem ar RUNDA och nastan tomma - de gor nagot annat an riktningarna
   och ska kannas annorlunda under tummen, inte bara se annorlunda ut. */
.dlg-body .gtv-k.rund{border-radius:999px;background:none;color:var(--faint)}
.dlg-body .gtv-k.ok{border-radius:999px;background:none;border:1.5px solid var(--blue);
  color:var(--blue);font-size:14px;font-weight:800;letter-spacing:.04em}
.dlg-body .gtv-k.txt{font-size:13px;gap:7px;letter-spacing:.01em}
.dlg-body .gtv-k.txt .ic{width:15px;height:15px;flex:0 0 auto}
.dlg-body .gtv-k .ic{width:21px;height:21px}
.dlg-body .gtv-k.rund .ic{width:17px;height:17px}
.dlg-body .gtv-ic{display:inline-flex;align-items:center}
.dlg-body .gtv-ic.flip{transform:rotate(180deg)}
.dlg-body .gtv-k.ok{background:rgba(129,161,193,.18);border-color:var(--blue);color:var(--blue);
  font-size:13px;font-weight:800;letter-spacing:.03em}
.dlg-body .gtv-k:active{transform:scale(.96)}
.dlg-body .gtv-a{appearance:none;flex:1 1 0;min-width:0;height:40px;border:1px solid var(--line);
  background:var(--inset);color:var(--dim);font:inherit;font-size:12.5px;font-weight:700;
  border-radius:12px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlg-body .gtv-a:active{transform:scale(.97)}
.tv-k{appearance:none;flex:0 0 auto;width:42px;height:36px;border:1px solid var(--line);
  background:var(--inset);color:var(--dim);font-family:var(--sans);font-size:16px;font-weight:700;
  border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  box-sizing:border-box;padding:0}
.tv-k .ic{width:17px;height:17px}
.tv-k:active{transform:scale(.96)}
.tv-k.pa{background:rgba(235,203,139,.18);border-color:rgba(235,203,139,.5);color:var(--gold)}
/* Av-knappen är den enda som kan ångra sig själv långsamt — den får rödtonen
   så att tummen inte tar den i stället för volymen. */
.tv-k.av{color:var(--hot,var(--warm));border-color:var(--line)}
#rooms-sec[hidden]{display:none!important}
.room.rum-dold{display:none}
/* Visa fler / visa färre. Ligger under rutnätet och tar hela bredden, så den
   inte kan förväxlas med ett rum. */
.rum-mer{appearance:none;width:100%;margin-top:var(--rum-luft);border:1px solid var(--line);
  background:var(--inset);color:var(--dim);font-family:var(--sans);font-size:12px;font-weight:700;
  border-radius:14px;padding:8px 6px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:7px;box-sizing:border-box}
.rum-mer .ic{width:14px;height:14px}
.rum-mer:active{transform:scale(.99)}
.tr-pil{margin-left:5px;font-size:.62em;font-weight:800;color:var(--dim);vertical-align:baseline}

.section-head{display:flex;align-items:center;gap:9px;margin:0 4px 12px}
.section-head .ic{width:16px;height:16px;color:var(--dim)}
.chartcard{padding:clamp(16px,2vw,21px);margin-bottom:13px}
.chartcard h3{font-size:14px;font-weight:750;letter-spacing:-.015em;display:flex;align-items:center;gap:9px}
.chartcard h3 .ic{width:17px;height:17px}
.chartcard .cap{font-size:11px;color:var(--dim);margin:4px 0 15px;font-weight:500}
.chart-wrap{position:relative;width:100%}
/* height:auto — svg:n får bestämma sin egen höjd ur bildförhållandet. En fast
   höjd gav tomma band över och under när innehållet inte fyllde lådan. */
.chart{width:100%;height:auto;display:block}
/* Vindgrafen i popupen: samma 146 px som elrutorna. preserveAspectRatio="none"
   på den, så den sträcks till höjden i stället för att följa viewBox-formen. */
#wind-chart .chart{height:146px}
.grid-l{stroke:var(--line-soft);stroke-width:1;vector-effect:non-scaling-stroke}
.chart-empty{padding:36px 10px;text-align:center;color:var(--faint);font-size:12.5px;font-style:italic}
/* SAMMA FÖRKLARING UNDER ALLA GRAFER: samma storlek, samma avstånd, samma
   färgprick. .mchart-lg2 lägger till att den går att klicka i. */
.legend,.mgraf-f,.mchart-lg2{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;
  margin-top:9px;font-size:10.5px;font-weight:700;color:var(--dim)}
.legend span,.mgraf-f span,.mchart-lg2 span{display:inline-flex;align-items:center;gap:6px}
.legend i,.mgraf-f i,.mchart-lg2 i{width:12px;height:3px;border-radius:2px;display:inline-block}

.clim{padding:clamp(16px,2vw,21px);margin-bottom:13px}
.clim-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));column-gap:var(--pg-gap);row-gap:var(--pg-gap-y)}
.cell{background:var(--inset);border:1px solid var(--line-soft);border-radius:17px;padding:12px 14px}
.cell-h{display:flex;align-items:center;gap:7px}
.cell-h .ic{width:14px;height:14px;color:var(--dim)}
.cell .rm{font-size:11.5px;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .zn{font-size:9.5px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-top:1px}
.cell .t{font-size:21px;font-weight:750;margin-top:7px;letter-spacing:-.02em}.cell .t small{font-size:12px;color:var(--dim);font-weight:600}
.cell .bar{height:3px;border-radius:2px;background:var(--line);margin-top:10px;overflow:hidden}
.cell .bar i{display:block;height:100%;border-radius:2px;transition:width .6s ease}

.status-card{padding:clamp(8px,1.4vw,14px) clamp(16px,2vw,21px);margin-bottom:13px}
.row{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:0}
.row .ri{width:30px;height:30px;border-radius:10px;background:var(--inset);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.row .ri .ic{width:18px;height:18px}
.row .rk{font-size:13.5px;color:var(--ink);font-weight:600;flex:1 1 auto;min-width:0}
.row .rk small{display:block;font-size:10.5px;color:var(--faint);font-weight:500;letter-spacing:.02em;text-transform:none;margin-top:1px}
.row .rv{font-size:13px;margin-left:auto;text-align:right;font-weight:650;flex:0 0 auto;color:var(--dim)}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
.chip.on{background:rgba(166,227,161,.15);color:var(--ok-t)}.chip.off{background:rgba(166,173,200,.14);color:var(--dim)}
.chip.warn{background:rgba(250,179,135,.16);color:var(--warm-t)}.chip.crit{background:rgba(243,139,168,.16);color:var(--hot-t)}

.devsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(102px,1fr));column-gap:var(--pg-gap);row-gap:var(--pg-gap-y);padding:clamp(15px,2vw,19px);margin-bottom:var(--pg-gap-y)}
.ds-tile{background:var(--inset);border:1px solid var(--line-soft);border-radius:17px;padding:14px 12px;text-align:center}
.ds-tile .ic{width:19px;height:19px;margin-bottom:6px}
.ds-tile .n{font-size:24px;font-weight:800;letter-spacing:-.03em}
.ds-tile .l{font-size:10px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin-top:3px;font-weight:600}

.warns{padding:clamp(8px,1.4vw,14px) clamp(16px,2vw,21px)}
.warn{display:flex;gap:13px;align-items:center;padding:11px 0;font-size:13px;border-bottom:1px solid var(--line-soft)}
.warn:last-child{border-bottom:0}
.warn .wi{width:30px;height:30px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.warn .wi .ic{width:17px;height:17px}
.warn .wt{flex:1 1 auto}.warn .wt b{font-weight:750}
.warn .lvl{font-size:11.5px;color:var(--dim);margin-left:auto;white-space:nowrap;font-weight:650}
.warn.crit .wi{background:rgba(243,139,168,.15);color:var(--hot)} .warn.crit b{color:var(--hot)}
.warn.med .wi{background:rgba(250,179,135,.15);color:var(--warm)}
.warn.ok-row{color:var(--dim);font-style:italic;border:0;padding:14px 0}
.warn.ok-row .wi{background:rgba(166,227,161,.14);color:var(--ok)}

.two{display:grid;grid-template-columns:1fr 1fr;column-gap:var(--pg-gap);row-gap:var(--pg-gap-y);align-items:start}
@media (max-width:760px){.two{grid-template-columns:1fr}}
/* SAMMA RADINDELNING PÅ ALLA ENHETER.
   Plattan hade ett rutnät där antalet kolumner sattes till första radens
   längd. Med sju knappar blev det fyra kolumner, och andra raden fyllde tre av
   dem — den fjärde cellen stod tom. Telefonen har alltid haft riktiga rader
   där knapparna delar bredden lika, och det är det beteendet som är rätt:
   4 + 3 där båda raderna går kant till kant.
   Raderna räknas ut i ctlRows och är alltså lika jämna som möjligt. */
.controls{display:flex;flex-direction:column;
  gap:var(--pg-gap-y);
  /* Samma innerkant som mellanrummet mellan knapparna. */
  padding:var(--pg-gap);margin-bottom:var(--pg-gap-y)}
.ctl-row{display:flex;flex-direction:row;gap:var(--pg-gap);min-width:0;width:100%}
.ctl-row>.ctl{flex:1 1 0%;min-width:0;max-width:100%}
/* KNAPPARNAS RADIE FOLJER PANELENS. Rutan ar en panel med --r i horn, och 18 px
   inuti 26 px last som tva olika formsprak. Atta bildpunkter mindre an panelen
   ar den vanliga proportionen for ett element som ligger innanfor en annan
   rundad form - det ser ut som samma horn, en bit in. */
.ctl{appearance:none;border:1px solid var(--line);border-radius:calc(var(--r) - 8px);background:var(--inset);color:var(--ink);font-family:var(--sans);font-weight:650;font-size:13px;padding:14px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;transition:.18s;min-height:84px;justify-content:center}
/* FRAMSTEGSSTRECKET. .ctl fick position:relative och strecket ligger absolut
   placerat över botten — läggs det i flödet tar det höjd i flexkolumnen och
   trycker ihop ikon och text på alla övriga knappar. Ingen overflow:hidden
   behövs: strecket är indraget 12 px och når aldrig ut till radien. */
.ctl{position:relative}
/* Langsammare och grundare an forst. 1,6 s med botten pa 42 % last som ett
   blinkande larm; 3,4 s med mjuk kurva och botten pa 62 % ar en andning - den
   sager "detta pagar", inte "titta hit nu". */
@keyframes ikPuls{0%,100%{opacity:1}50%{opacity:.62}}
.stat-ic.pulsar,.en-chip-ic.pulsar{animation:ikPuls 3.4s cubic-bezier(.45,0,.55,1) infinite}
@media (prefers-reduced-motion:reduce){.stat-ic.pulsar,.en-chip-ic.pulsar{animation:none;opacity:.75}}
.stat-ic.har-mark,.en-chip-ic.har-mark{position:relative;overflow:visible}
.ik-mark{position:absolute;right:-5px;bottom:-4px;width:13px;height:13px;
  background:var(--panel-b);border-radius:50%;display:inline-flex;align-items:center;
  justify-content:center;color:var(--hot)}
.ik-mark .ic{width:10px;height:10px}
.stat-sub{font-size:var(--tl-sub,10px);font-weight:700;color:var(--faint);margin-top:2px;
  line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums}
.stat-sub b{font-weight:800}
/* v721: batteriets bokning/läge som bricka under underraden. */
.stat-bok{display:inline-flex;align-items:center;gap:4px;max-width:100%;margin-top:4px;padding:2px 7px 2px 5px;
  border-radius:999px;font-size:var(--tl-sub,10px);font-weight:800;line-height:1.35;white-space:nowrap;
  overflow:hidden;box-sizing:border-box;align-self:flex-start}
.stat-bok>span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.stat-bok .bok-kort{display:none}
/* v723: suddigt tills första live-svaret. Bara innehållet – flikraden och
   popuperna rörs inte. Ingen tryckning går igenom medan det är suddigt. */
.wrap{transition:filter .35s ease,opacity .35s ease}
body.vantar-live .wrap{filter:blur(5px) saturate(.75);opacity:.7;pointer-events:none}
#live-vant{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-6px);z-index:46;
  display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:var(--panel-a);
  border:1px solid var(--line);box-shadow:0 6px 18px -8px rgba(0,0,0,.45);font-size:12px;font-weight:750;color:var(--dim);
  opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease}
body.vantar-live #live-vant{opacity:1;transform:translate(-50%,0)}
#live-vant .lv-prick{width:8px;height:8px;border-radius:50%;background:var(--warm);animation:lvPuls 1.1s ease-in-out infinite}
@keyframes lvPuls{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.wrap,#live-vant{transition:none}#live-vant .lv-prick{animation:none}}
/* Telefonen: tre rutor i bredd ger ~55 px text – bara ikonen och tiden. */
body.mobile:not(.kiosk) .stat-bok .bok-lang{display:none}
body.mobile:not(.kiosk) .stat-bok .bok-kort{display:inline}
/* …och utan bricka: ikon och tid i färgen, så tiden får plats. */
body.mobile:not(.kiosk) .stat-bok{background:none;padding:0;gap:3px;margin-top:3px}
body.mobile:not(.kiosk) .stat-bok>span{overflow:visible;flex:0 0 auto}
.stat-bok .ic{width:1.15em;height:1.15em;flex:0 0 auto}
.stat-bok.bok-gul{color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,transparent)}
.stat-bok.bok-bla{color:var(--blue);background:color-mix(in srgb,var(--blue) 16%,transparent)}
.stat-bok.bok-gron{color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
/* v724: brickan under underraden gjorde raden högre. Nu sitter markeringen
   under batteriikonen (.stat-bokik) – i ikonens kolumn, absolut placerad, så
   rutans höjd inte ändras. I flödesrutnätet (På nu-läget) delar ikonen rad med
   rubriken och värdet ligger direkt under, så där står markeringen i stället
   sist på rubrikraden. */
.stat-bok{display:none!important}
.stat-ic.har-bok{position:relative;overflow:visible}
.stat-bokik{position:absolute;top:calc(100% + 5px);left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:1px;pointer-events:none;white-space:nowrap;line-height:1}
.stat-bokik .ic{width:13px!important;height:13px!important}
.stat-bokik b{font-size:9.5px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat-bokik.bok-gul{color:var(--gold)}.stat-bokik.bok-bla{color:var(--blue)}.stat-bokik.bok-gron{color:var(--ok)}
body.panu-pa .fl-tiles>.stat .stat-bokik,body.panu-pa #stats-energy>.stat .stat-bokik{display:none}
body.panu-pa .fl-tiles>.stat .stat-bok,body.panu-pa #stats-energy>.stat .stat-bok{display:inline-flex!important;grid-column:3;grid-row:1;justify-self:end;align-self:center;
  margin:0 0 0 calc(4px*var(--kk));padding:0;background:none;gap:3px;font-size:calc(10px*var(--kk))}
body.panu-pa .fl-tiles>.stat .stat-bok .bok-lang,body.panu-pa #stats-energy>.stat .stat-bok .bok-lang{display:none}
body.panu-pa .fl-tiles>.stat .stat-bok .bok-kort,body.panu-pa #stats-energy>.stat .stat-bok .bok-kort{display:inline}
body.panu-pa .fl-tiles>.stat .stat-bok>span,body.panu-pa #stats-energy>.stat .stat-bok>span{overflow:visible;flex:0 0 auto}
body.mobile:not(.kiosk) .fl-tiles{--tl-sub:9px}
.ctl-prog{position:absolute;left:12px;right:12px;bottom:7px;height:3px;border-radius:2px;
  background:var(--line);pointer-events:none}
.ctl-prog i{display:block;height:100%;border-radius:2px;background:var(--gold);transition:width .6s ease}
/* PA PLATTAN LIGGER STRECKET I FLODET, inte ovanpa. Absolut placering 7 px
   fran nederkanten fungerar sa lange knappen ar lag, men i kiosklaget vaxer
   knappen med hojdinstallningen medan strecket star kvar - och texten, som ar
   lodratt centrerad, vandrar ner i det. Som ett vanligt flode-element skjuter
   det i stallet undan texten och kan aldrig hamna under den.
   Telefonen ror jag inte: dar ser det redan ratt ut. */
.kiosk .ctl-prog{position:static;left:auto;right:auto;bottom:auto;width:100%;
  margin-top:calc(5px*var(--knhojd,1));flex:0 0 auto}
.ctl:hover{border-color:var(--svg-stroke)}
.ctl-ic{width:24px;height:24px;color:var(--dim);display:inline-flex}.ctl-ic .ic{width:100%;height:100%}
.ctl-l{font-size:12.5px;text-align:center}
.ctl-s{font-size:10px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase}
/* Raderna finns alltid i markupen. På platta och dator löses de upp med
   display:contents, så rutnätet uppför sig precis som förut. På telefonen är
   varje rad ett eget rutnät med lika breda kolumner – då fyller raden hela
   bredden och alla knappar på samma rad blir lika stora, även när den sista
   raden har färre knappar än den första. */
/* display:contents är borta — raderna ska vara riktiga rader. */
/* Samma innerkant som ÖVRIGA RUTOR, inte --pg-gap. På mobil är --pg-gap bara
   3 px — det är mellanrummet MELLAN rutor, inte innerkanten i dem. Med det som
   padding låg knapparna 3 px från kanten medan grannrutorna har 16, och raden
   såg ut att spilla ut ur sin vita ruta. clamp(16px,2vw,21px) är samma mått som
   panelerna i insikts- och vädervyerna använder. */
/* SAMMA LUFT SOM RUMMEN. Knapprutan hade en egen innerkant pa 16-21 px medan
   rumskorten ligger pa --rum-luft, alltsa 9 px pa mobil. Tva avsnitt under
   varandra med olika innerkant syns direkt. Nu delar de samma matt, och
   --knmarg fungerar som forut: den skalar luften, den satter den inte. */
body.mobile:not(.kiosk) .controls{display:flex;flex-direction:column;
  gap:calc(var(--rum-luft)*var(--knmarg,1));
  padding:calc(var(--rum-luft)*var(--knmarg,1));overflow:hidden}
/* Mellanrummet mellan knapparna hämtas separat: det ska vara litet, till
   skillnad från innerkanten. */
body.mobile:not(.kiosk) .ctl-row{gap:calc(var(--rum-luft)*var(--knmarg,1))}
/* FLEXBOX, inte grid. Raden byggde på var(--n) inuti repeat(), och den
   konstruktionen avvisas av en del motorer — då föll hela deklarationen bort,
   .ctl-row föll tillbaka på display:contents, och knapparna blev flexbarn i
   .controls kolumn och la sig utanför rutans innerkant.

   flex:1 1 0 med min-width:0 ger samma jämna fördelning utan att bero på att
   en variabel går att använda inuti en funktion. */
body.mobile:not(.kiosk) .ctl-row{display:flex;flex-direction:row;
  gap:calc(var(--rum-luft)*var(--knmarg,1));min-width:0;width:100%}
/* flex-basis med enhet. "flex:1 1 0" utan enhet avvisas av vissa parsrar och
   hela deklarationen faller — samma sorts tysta bortfall som grid-regeln hade. */
body.mobile:not(.kiosk) .ctl-row>.ctl{flex:1 1 0%;min-width:0;max-width:100%}
.ctl.on{background:rgba(166,227,161,.14);border-color:rgba(166,227,161,.4)}
/* VÄNTELÄGE. MÅSTE stå EFTER .ctl-reglerna: .ctl sätter `border` som KORTFORM,
   och en border-color som deklarerats tidigare i filen skrivs då över. Låg det
   här blocket först blev knappen grå direkt efter trycket — bara ikonens
   animation syntes, eftersom den regeln har högre specificitet. */
@keyframes ctlsnurr{to{transform:rotate(360deg)}}
.ctl.vantar{border-color:var(--warm);color:var(--warm-t)}
.ctl.vantar .ctl-ic{animation:ctlsnurr 1.1s linear infinite;transform-origin:50% 50%;
  display:inline-flex;align-items:center;justify-content:center}
.ctl.vantar .ctl-l{color:var(--warm-t)}
/* Bokat läge: gult. Eget läge mellan av och på — knappen är inte tänd, men
   något är inställt. Ligger EFTER .ctl av samma skäl som väntläget: .ctl
   sätter border som kortform. */
.ctl.bokad{border-color:var(--gold);color:var(--gold)}
.ctl.bokad .ctl-l{color:var(--gold)}
.ctl.bokad .ctl-ic{color:var(--gold)}
.ctl.on .ctl-ic{color:var(--ok)}.ctl.on .ctl-s{color:var(--ok-t)}
.ctl.arm{background:rgba(250,179,135,.18);border-color:var(--warm)}.ctl.arm .ctl-l{color:var(--warm-t)}.ctl.arm .ctl-ic{color:var(--warm)}
.ctl.err{border-color:var(--hot)}.ctl.err .ctl-l{color:var(--hot-t)}
.ctl[data-demo]{opacity:.55}

body.kiosk{padding:10px}

.ew-row{display:flex;gap:var(--pg-gap);margin-bottom:var(--pg-gap-y);align-items:stretch}
.ew-row>.panel{flex:1 1 0;min-width:0;margin:0;display:flex;flex-direction:column;padding:clamp(16px,2vw,21px)}

.wx-wide{flex-direction:row;flex-wrap:wrap;gap:18px;align-items:center;justify-content:flex-start}
/* energipanel */
.enpanel .rc-head{margin-bottom:12px}
.en-body{flex:1 1 auto;display:flex;flex-direction:column;gap:15px;min-height:0}
.en-hero{display:flex;align-items:center;gap:12px}
/* egen topp-ruta: hus + Insikter/Jämför + självförsörjning + live.
   Samma padding/marginal/stil som övriga avsnitt (enpanel/wx-card). */
/* Innerkanten är SAMMA variabel som mellanrummet mellan knapparna, så luften
   runt raden och luften mellan knapparna alltid stämmer överens — och följer
   dashboardens övriga avstånd i stället för att vara ett eget tal. */
.statusbar{padding:var(--pg-gap-y);display:flex;align-items:center;gap:12px;margin:0}
/* Mobil: knappraden foljer med nedat i stallet for att rulla bort. Panelen har
   ogenomskinlig bakgrund redan, sa innehallet kan rulla under den. Markoren
   .sticky-sentinel ar en 1px-rad precis ovanfor som talar om nar raden faktiskt
   fastnat - forst da far den skugga, annars ligger den och skuggar i vila. */
.sticky-sentinel{display:none}
body.mobile:not(.kiosk) .sticky-sentinel{display:block;height:1px;margin-bottom:-1px}
body.mobile:not(.kiosk) .view>.panel.statusbar{position:sticky;top:0;z-index:35}
/* Fastnad ligger raden som ett riktigt apphuvud: raka horn och bakgrunden ut i
   skarmkanten. Negativa marginaler ater upp exakt den kantmarginal .wrap lagger
   pa, aven nar env() gjort den storre an 2px. Innehallet far samtidigt en egen
   inre marginal mot det sakra omradet, sa knapparna aldrig hamnar under en
   rundad skarmkant eller ett hack fast bakgrunden gor det. */
body.mobile:not(.kiosk) .view>.panel.statusbar.stuck{
  border-radius:0;
  border-left-width:0;border-right-width:0;
  border-top-color:transparent;
  margin-left:calc(-1 * max(2px,env(safe-area-inset-left)));
  margin-right:calc(-1 * max(2px,env(safe-area-inset-right)));

/* nowrap: live-indikatorn ska aldrig hamna på egen rad under knapparna.
   gap:8 för att stämma med de andra reglerna — 10 här och 8 där gav olika
   mellanrum beroende på vilken vy man tittade i. */

   överskottet mellan de två och det uppstod en lucka mitt emellan.
   Klassväljare i stället för id: varje vy har sin egen uppsättning knappar, och
   en lista med id:n glöms bort så fort en vy tillkommer. */

.wx2-now,.wx2-wind{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:12px;padding:2px}

.wx2-wind{padding-left:var(--avd-pad)}
.wx2-now{padding-right:var(--avd-pad)}
/* CENTRERING — måste stå EFTER raderna ovan. Låg den före kom paddingen mot
   avdelaren tillbaka och innehållet hamnade mitt i det som blev kvar, inte mitt
   i kolumnen. Kioskregeln längre ner sätter dessutom egna värden, därav
   !important. */
.wx2-center .wx2-now,.wx2-center .wx2-wind{justify-content:center!important}
.wx2-center .wx2-now{padding-right:0!important;margin-right:var(--avd-pad)!important}
.wx2-center .wx2-wind{padding-left:0!important;margin-left:var(--avd-pad)!important}
/* Texten får inte växa och fylla ut — då finns ingenting att centrera. */
.wx2-center .wx2-now-txt,.wx2-center .wx2-wind-txt{flex:0 1 auto!important}
/* VÄDERSIDAN radbryter ("16,7° känns 17°" över två rader på smal skärm) och
   fyller därför bredden även med flex:0 1 auto — då syntes ingen centrering
   trots att kolumnen var centrerad. Centrera raderna i sig i stället; det
   fungerar oavsett hur brett innehållet blir. */
/* Vänsterställt: hela blocket flyttas mot mitten, raderna centreras inte var
   för sig — annars tappar temperaturen, "Känns" och beskrivningen sin
   gemensamma vänsterkant. */
.wx2-center .wx2-now-txt,.wx2-center .wx2-wind-txt{text-align:left!important}
.wx2-center .wx2-line{justify-content:flex-start!important}
.wx2-center .wx2-sub,.wx2-center .wx2-by{text-align:left!important}
/* Textblocket måste vara SMALARE än kolumnen, annars fyller gruppen ikon+text
   hela bredden och justify-content har ingenting att centrera — ikonen blev
   kvar i vänsterkanten medan texten såg centrerad ut. Vindsidans text är kort
   och rymdes ändå; vädersidans "Växlande molnighet" gör det inte.
   Taket tvingar radbrytning och gör gruppen smal nog att flyttas. */
/* INGEN radbrytning i centrerat läge. Taket jag hade här bröt "Växlande
   molnighet" i två rader; texten ryms på en rad om den får krympa något och
   gå närmare avdelaren.

   Kolumnen är knappt 175 px på en telefon. Ikon 46 + mellanrum 12 lämnar 116 px
   åt texten, och "Växlande molnighet" tar cirka 105 px vid 11,5 px — det går
   ihop, men först när radbrytningen är avstängd. */
.wx2-center .wx2-line{flex-wrap:nowrap!important}
.wx2-center .wx2-sub,.wx2-center .wx2-by,.wx2-center .wx2-wl{white-space:nowrap!important;
  /* INGEN nedskalning. Texten ska ha samma storlek oavsett om centreringen är
     på eller av — nedskalningen var ett försök att få plats som i stället lät
     ett läge påverka ett mått som hör till reglagen. */
  overflow:visible!important;text-overflow:clip!important}
/* Får gå in i innerkanten och närmare linjen — hellre det än en bruten rad. */
.wx2-center .wx2-now{padding-right:2px!important;margin-right:6px!important}
.wx2-center .wx2-wind{padding-left:2px!important;margin-left:6px!important}
/* Tätare mellan ikon och text, och en aning mindre ikon: varje pixel här går
   till texten. */
.wx2-center .wx2-now,.wx2-center .wx2-wind{gap:8px!important}
.wx2-center .wx2-ic{width:40px!important;height:40px!important}
.wx2-center .wx2-arrow{width:36px!important;height:36px!important}
/* Textblocket får ta den plats som blir över, men inte mer. */
.wx2-center .wx2-now-txt,.wx2-center .wx2-wind-txt{max-width:none!important;min-width:0!important}
/* Samma indrag som rutornas avdelare: --avd-pad minus 6 px. Ett fast 6 px här
   och ett räknat där gav olika långa linjer så fort avdelarmåttet ändrades. */
/* Lika lång som avdelaren mellan regn och tryck. Den spänner rutans höjd minus
   --avd-pad i vardera änden; den här satt i .wx2 som är högre än sitt innehåll,
   så den blev längre. Bind den till samma mått. */
/* FAST längd, delad med rutornas avdelare. Med top/bottom-indrag blev linjerna
   olika långa eftersom raderna är olika höga — väderraden har en 46 px ikon,
   rutraden bara text. Samma höjd, centrerad, ger samma längd överallt. */
.wx2-div{position:absolute;left:50%;top:50%;height:var(--div-h,44px);
  width:1px;background:var(--line);transform:translate(-50%,-50%)}
.wx2-ic{width:46px;height:46px;flex:0 0 auto;color:var(--gold)}.wx2-ic .ic{width:100%;height:100%}
.wx2-arrow{width:40px;height:40px;flex:0 0 auto;color:var(--cyan);display:inline-flex;transition:transform .3s}.wx2-arrow .ic{width:100%;height:100%}
.wx2-now-txt,.wx2-wind-txt{min-width:0}
.wx2-line{display:flex;align-items:baseline;gap:0;min-width:0}
.wx2-temp,.wx2-wv{font-size:29px;font-weight:770;line-height:1.02;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto}
.wx2-wv small{font-size:.46em;font-weight:600;color:var(--dim);letter-spacing:0;margin-left:.14em}
.wx2-beside{color:var(--dim);font-weight:600;white-space:nowrap;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;line-height:1;margin-left:.14em}
.wx2-dir{color:var(--ink);font-weight:730;white-space:nowrap;flex:0 0 auto;line-height:1;letter-spacing:.01em;margin-left:7px}
.wx2-feels{display:inline-flex;align-items:baseline;flex:0 1 auto;min-width:0;overflow:hidden;margin-left:.14em}
.wx2-feelslbl{color:var(--dim);font-weight:600;white-space:nowrap;letter-spacing:0;flex:0 0 auto}
.wx2-feels .wx2-dir{margin-left:7px}
.wx2-sub,.wx2-wl,.wx2-by{font-size:11.5px;color:var(--dim);font-weight:600;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Byraden bär värdet och är därför något starkare än beskrivningen under. */
.wx2-by{color:var(--ink);font-weight:700}
/* Punkten får samma luft på båda sidor — riktningen låg för långt bort. */
.wx2-by .wx2-pt{margin:0 .3em;opacity:.7;font-weight:600}
/* Ingen egen marginal: .wx2-pt har redan luft på båda sidor, och två i rad
   gjorde avståndet efter punkten dubbelt mot före. */
/* Marginal bara när det INTE står en punkt före — "Känns 17°" behöver ett
   mellanrum, "By 6 m/s · N" har redan luft från punkten. */
.wx2-by .wx2-dir{font-weight:700;margin-left:.32em}
.wx2-by .wx2-pt+.wx2-dir{margin-left:0}
/* Ingen marginal ovanför: rutraden bidrar redan med sin padding, och två
   avstånd på samma ställe hade blivit dubbelt.

   Och INGEN padding nedanför: remsan är sist i panelen, så panelens egen
   innerkant räcker. Utan det låg remsans luft ovanpå panelens och botten blev
   större än toppen. */
/* Remsan har INGEN egen linje. Den fick en border-top nar rutraden ovanfor
   syntes, men rutraden ar dold - da lag pn-del och border-top direkt pa
   varandra och blev en dubbelrand. Nu ar pn-del ensam avdelare, som overallt
   annars, och remsan bidrar bara med luften under den. */
.wx2-strip{display:flex;margin-top:0;border-top:0;
  padding-top:var(--avd-pad);padding-bottom:0}
.wx2-cell{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 5px;border-left:1px solid var(--line);cursor:pointer}
.wx2-cell:first-child{border-left:0}
.wx2-cl{font-size:8.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;line-height:1}
.wx2-cv{font-size:15px;font-weight:730;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:3px;line-height:1;white-space:nowrap}
.wx2-cv.up{color:var(--hot)}.wx2-cv.down{color:var(--blue)}
.wx2-ci{display:inline-flex;flex:0 0 auto}.wx2-ci .ic{width:100%;height:100%}
.wx2-cell:hover .wx2-cv{filter:brightness(1.15)}
.kiosk .wx2-temp,.kiosk .wx2-wv{font-size:26px}.kiosk .wx2-ic{width:42px;height:42px}.kiosk .wx2-arrow{width:37px;height:37px}

.kiosk .wx2-wind{padding-left:13px;margin-left:13px}

/* "PÅ NU"-RADEN (v688, inställningen CFG.paNu). Det som är igång just nu som
   brickor överst i rutorna; ett tryck öppnar rätt popup. Knappavsnittet göms —
   knapparna ligger i rutornas popuper och i Hem-rutans popup. */
.panu{display:none}
body.panu-pa .panu{display:flex;flex-wrap:wrap;margin:0 0 6px;min-height:30px;align-items:center}
.panu-c{display:inline-flex;align-items:center;height:30px;border-radius:999px;padding:0 11px;margin:0 6px 6px 0;
  font:inherit;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;
  background:rgba(163,190,140,.16);color:var(--ok);border:1px solid rgba(163,190,140,.45)}

.panu-tom{font-size:12px;font-weight:700;color:var(--faint);margin:0 0 6px 2px}
body.panu-pa #view-flode>[data-sec="buttons"]{display:none!important}

.tileswrap>.panu{padding:calc(8px*var(--kk,1)) calc(8px*var(--kk,1)) 0}
/* Skalan sätts på avsnittet, så På nu-raden och korten har samma kantluft. */

body.kiosk.panu-pa #view-flode>[data-sec="tiles"]{--kk:1.05}
/* Väggplattan: knapprutan som fyllde höjden är borta — rutorna tar över den
   och raderna delar på höjden. */
body.kiosk.panu-pa #view-flode>[data-sec="tiles"]{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
body.kiosk.panu-pa #view-flode>[data-sec="tiles"]>.fl-tiles{flex:1 1 auto;grid-auto-rows:1fr;align-content:stretch}
/* RUTORNA SOM KORT (v689–v690, med På nu-raden). Varje ruta ett eget kort,
   alla LIKA STORA: tre lika breda kolumner och lika höga rader (1fr). Måtten
   hänger ihop genom en enda skala, --kk: ikon = rubrikens radhöjd, värdet
   2,2 × rubriken, luften i kortet = ikonen. Väggplattan sätter --kk större;
   allt annat följer med i samma proportion. */
body.panu-pa .fl-tiles{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;
  grid-auto-rows:1fr!important;gap:calc(8px*var(--kk))!important;padding:calc(8px*var(--kk))!important}
/* På nu-raden (v692): jämnt avstånd åt alla håll — samma 8 px som mellan
   korten, både mellan brickorna och ned till korten. */

.rl-x span:nth-child(1){left:0}.rl-x span:nth-child(2){left:25%}.rl-x span:nth-child(3){left:50%}.rl-x span:nth-child(4){left:75%}.rl-x span:nth-child(5){left:100%}
