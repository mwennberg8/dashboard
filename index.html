.alt-hd{display:flex;align-items:center;gap:11px;margin-bottom:13px;padding-bottom:13px;border-bottom:1px solid var(--line)}
.alt-hd-ic{width:22px;height:22px;color:var(--gold);flex:0 0 auto}.alt-hd-ic .ic{width:100%;height:100%}
.alt-hd-t{font-size:15px;font-weight:800;color:var(--ink)}
.alt-hd-s{font-size:11px;color:var(--faint);margin-top:1px}
.alt-lg{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;font-size:10.5px;font-weight:700;color:var(--dim);margin-bottom:4px}
.alt-lg span{display:inline-flex;align-items:center;gap:6px}
.alt-lg i{width:11px;height:11px;border-radius:3px;display:inline-block;flex:0 0 auto}
.alt-lg em{font-style:normal;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.02em;font-size:9px}
.cmpb{margin:15px 0 0}
.cmpb-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cmpb-ic{width:16px;height:16px;flex:0 0 auto}.cmpb-ic .ic{width:100%;height:100%}
.cmpb-t{font-size:12.5px;font-weight:700;color:var(--ink)}
.cmpb-row{display:flex;align-items:center;gap:9px;margin:5px 0}
.cmpb-y{width:34px;flex:0 0 auto;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.cmpb-y.cur{font-weight:800;color:var(--ink)}
.cmpb-track{flex:1 1 0;min-width:0;height:14px;background:var(--inset);border-radius:7px;overflow:hidden}
.cmpb-track i{display:block;height:100%;border-radius:7px}
.cmpb-v{flex:0 0 auto;min-width:66px;text-align:right;font-size:12.5px;font-weight:720;color:var(--ink);font-variant-numeric:tabular-nums}
.cmp-badge.altpct{padding:1px 6px;font-size:10px;margin-left:5px}
.alt-hint{text-align:center;font-size:10px;color:var(--faint);margin-top:16px;opacity:.7}
/* Dygnsväljaren i historikrutan. Wrap i stället för sidled-skroll. */
/* Historikrutan: dagen störst, sedan väljaren, sedan grafen i egen ram. */
.ww-h .drow-info{flex-basis:100%}
.g2-main{display:flex;gap:4px;align-items:stretch}
/* .g2-yax är borttagen i v599: y-skalan togs bort ur alla grafer så att
   ritytan får hela bredden med lika stor marginal på båda sidor. Värdet läser
   man med dragpunkten i stället, som numera finns i varje tidsseriegraf. */
/* Absolut placering: etiketten sitter på samma höjd som sin egen rutnätslinje. */
.g2-plot{flex:1 1 0;min-width:0}
.g2-plot svg{width:100%;height:132px;display:block}
/* Ingen vänstermarginal längre: de 34 px var plats åt y-kolumnen, och utan
   den skulle klockslagen ha stått förskjutna mot sin egen graf. */
.cmp{margin:2px 0 2px}
.cmp-row{display:flex;align-items:baseline;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line)}
.cmp-row:last-child{border-bottom:0}
.cmp-head{padding-bottom:8px}
.cmp-k{flex:1.25 1 0;min-width:0;font-size:12px;color:var(--dim);font-weight:600}
.cmp-v,.cmp-y{flex:1 1 0;min-width:0;text-align:right;font-variant-numeric:tabular-nums}
.cmp-v{font-size:13.5px;font-weight:720;color:var(--ink)}
.cmp-v.cur{color:var(--gold)}
.cmp-y{font-size:12.5px;font-weight:800;color:var(--ink)}
.cmp-y.cur{color:var(--gold)}
.cmp-y small{display:block;font-size:8px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.03em;margin-top:2px;white-space:nowrap}
.cmp-since{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--faint);margin-top:14px;padding-top:10px;border-top:1px solid var(--line)}
.cmp-since span:first-child{font-weight:700;text-transform:uppercase;letter-spacing:.05em;flex:0 0 auto}
.cmp-since span:last-child{text-align:right}
.ww-insight{display:flex;gap:9px;align-items:flex-start;background:var(--ins-grad);border:1px solid var(--ins-border);border-radius:13px;padding:11px 13px;margin:12px 0 2px;font-size:12.5px;font-weight:600;line-height:1.42;color:var(--ink)}
.ww-insight-ic{width:16px;height:16px;flex:0 0 auto;color:var(--gold);margin-top:1px}.ww-insight-ic .ic{width:100%;height:100%}
.ai-tag{font-size:8.5px;font-weight:800;letter-spacing:.05em;color:var(--bg);background:var(--gold);border-radius:5px;padding:1px 5px;align-self:center;flex:0 0 auto;margin:0 -2px}
.cal-list{display:flex;flex-direction:column}
.cal-row{display:flex;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.cal-l{flex:1 1 auto;min-width:0;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-v{flex:0 0 auto;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.cal-n{flex:0 0 auto;font-size:10.5px;font-weight:700;color:var(--faint);min-width:48px;text-align:right}
.cal-n.on{color:var(--ok)}
.dlg-body .drow:last-child{border-bottom:0}
.dlg-body .dk{color:var(--dim)}.dlg-body .dv{font-weight:680}
.dlg.wide{max-width:clamp(340px,94vw,620px)}
.dlg.wide .dlg-body{max-height:calc(100vh - 170px)}
/* ALLA rutor rullar och anpassar sig. Förut fick bara .wide och .edit ett tak,
   så en detaljruta med mycket innehåll — sol-popupen med prognoskurvan — bara
   växte utanför skärmen utan att gå att nå. Att lägga taket på grundregeln i
   stället för att räkna upp klasser gör att en ny ruta inte kan glömmas bort. */
/* Ingen sidled-skroll i någon dialog. Anpassa knapp gled några pixlar i sidled
   — rutnäten där räknar bredd i procent med negativa marginaler, och ett
   avrundat pixelvärde räcker för att ge en skrollbar bredd. Höjdled rörs inte. */
.dlg-body{overflow-x:hidden;scrollbar-width:none;-ms-overflow-style:none;
  max-height:calc(100vh - 190px);overflow-y:auto;overscroll-behavior:contain}
.dlg-body::-webkit-scrollbar{display:none}
/* Bredden följer skärmen: smal telefon får nästan hela, en platta får mer än
   340 px. Den fasta 340 px är BORTTAGEN ur grundregeln ovan — låg den kvar
   vann den ibland, beroende på ordning, och rutan blev smal på plattan. */
.dlg{max-width:clamp(300px,92vw,420px)}
@media (min-width:700px){.dlg{max-width:clamp(340px,72vw,520px)}}
@media (min-width:1000px){.dlg{max-width:560px}}
.dlg-body::-webkit-scrollbar{display:none;width:0;height:0}
.fc-now{display:flex;align-items:center;gap:13px;margin-bottom:4px}
.fc-now-ic{width:48px;height:48px;flex:0 0 auto;color:var(--gold)}.fc-now-ic .ic{width:100%;height:100%}
.fc-now-temp{font-size:30px;font-weight:770;line-height:1;letter-spacing:-.02em}.fc-now-temp small{font-size:13px;font-weight:600;color:var(--dim)}
.fc-now-sit{font-size:13px;color:var(--dim);font-weight:600;margin-top:3px}
.fc-time{font-size:11px;color:var(--faint);font-weight:600;margin:2px 0 12px}
.fc-mid{display:flex;align-items:center;gap:13px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fc-mid .wx-compass{width:66px;height:66px}
.fc-wind-v{font-size:20px;font-weight:740}.fc-wind-v small{font-size:12px;font-weight:600;color:var(--dim)}
.fc-wind-l{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.fc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.fc-cell{display:flex;align-items:center;gap:9px;background:var(--inset);border:1px solid var(--line);border-radius:13px;padding:9px 11px}
.fc-cell-ic{width:19px;height:19px;flex:0 0 auto;color:var(--dim)}.fc-cell-ic .ic{width:100%;height:100%}
.fc-cell-v{font-size:14px;font-weight:720}
.fc-cell-l{font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
/* v766: väderpopupens prognos. Timmarna är en rad att svepa i, dagarna en rad
   per dygn – båda i rutornas färger så de hör ihop med datarutorna ovanför. */
.vp-tim{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;scrollbar-width:thin}
.vp-t{flex:0 0 auto;min-width:50px;scroll-snap-align:start;display:flex;flex-direction:column;
  align-items:center;gap:3px;padding:8px 5px;background:var(--inset);border:1px solid var(--line);
  border-radius:11px;box-sizing:border-box}
.vp-t.nu{border-color:var(--blue)}
.vp-tk{font-size:10px;font-weight:750;color:var(--faint);letter-spacing:.04em}
.vp-ti,.vp-di{width:22px;height:22px;display:inline-flex;color:var(--gold)}
.vp-ti .ic,.vp-di .ic{width:100%;height:100%}
.vp-tt{font-size:15px;font-weight:850;line-height:1.1}
.vp-tp{font-size:10px;font-weight:700;color:var(--blue);white-space:nowrap}
.vp-tw{font-size:10.5px;font-weight:700;color:var(--dim);white-space:nowrap}
.vp-tw small,.vp-dw small{font-size:9px;opacity:.75;margin-left:1px}
.vp-fork{font-size:10px;color:var(--faint);margin:0 0 4px}
.vp-dagar{display:flex;flex-direction:column;gap:6px}
.vp-d{display:grid;grid-template-columns:minmax(64px,1.2fr) 26px minmax(62px,1fr) minmax(46px,.8fr) minmax(58px,1fr);
  align-items:center;gap:8px;padding:8px 10px;background:var(--inset);border:1px solid var(--line);
  border-radius:11px;font-size:13px;font-weight:700}
.vp-dn{font-weight:800;white-space:nowrap}
.vp-dt{white-space:nowrap}.vp-dt b{font-weight:850}.vp-dt{color:var(--dim)}.vp-dt b{color:var(--ink)}
.vp-dp{color:var(--blue);font-size:12px;white-space:nowrap}
.vp-dw{color:var(--dim);font-size:12px;text-align:right;white-space:nowrap}
.vp-tom{font-size:12px;color:var(--faint);padding:6px 0 10px}
/* tile-redigerare */
.te{display:flex;flex-direction:column}
.te-sec{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin:13px 2px 6px}
.te-sec:first-child{margin-top:0}
.te-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.te-opt{display:flex;align-items:center;gap:8px;background:var(--inset);border:1px solid var(--line);border-radius:12px;padding:9px 10px;cursor:pointer;color:var(--ink);text-align:left;font:inherit}
.te-opt.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.te-opt-ic{width:18px;height:18px;flex:0 0 auto}.te-opt-ic .ic{width:100%;height:100%}
.te-opt-l{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.te-adv{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.te-adv select{flex:1 1 140px;min-width:0;background:var(--inset);border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--ink);font:inherit;font-size:12.5px}
.te-use{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;font-size:12.5px;cursor:pointer}
.te-input{width:100%;background:var(--inset);border:1px solid var(--line);border-radius:10px;padding:10px 11px;color:var(--ink);font:inherit;font-size:13px;box-sizing:border-box}
.te-chk{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin:10px 2px 2px;cursor:pointer}
/* Valen i ladda max-rutan. Två kolumner, samma form som andra snabbval. */
/* FLEX, INTE GRID. Två lika breda per rad blir samma sak i en modern webbläsare,
   men flex går också att mäta i renderaren jag verifierar med — grid stöds inte
   där, och då kan jag inte se om layouten faktiskt stämmer. */
/* MARGINALER, INTE flex-gap. gap ritas inte av renderaren jag mäter pixlar
   med, så luften mellan knapparna gick inte att verifiera — och det är just
   sådant som ska stämma. Marginaler ger samma resultat i båda. */
.bl-val{display:flex;flex-wrap:wrap;margin:2px -4px 4px}
.bl-val .bl-b{flex:1 1 calc(50% - 8px);min-width:0;margin:4px}
/* Alla fyra lika höga: gemensam min-height och centrerat innehåll, så en
   knapp med kortare text inte blir lägre än grannen. */
.bl-b{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:12px 8px;min-height:64px;
  border:1px solid var(--line);background:var(--inset);color:var(--ink);
  border-radius:13px;cursor:pointer;font-family:inherit;text-align:center;
  box-sizing:border-box}
.bl-b b{font-size:14.5px;font-weight:800;line-height:1.15;white-space:nowrap}
.bl-b small{font-size:11px;color:var(--dim);font-weight:650;line-height:1.25;
  white-space:nowrap}
/* Kvittensen på det man tryckte — syns de tiondelar rutan är kvar. */
.bl-b.bl-vald,.bl-boka.bl-vald{border-color:var(--ok);background:var(--ok-bg,rgba(120,170,110,.16))}
.bl-b.bl-vald b,.bl-b.bl-vald small{color:var(--ok)}
.bl-b.pri{border-color:var(--ok);color:var(--ok)}
.bl-b.pri b{color:var(--ok)}
/* Prisvalet skiljer sig från de fasta klockslagen — pil och egen färg. */
/* Prisknappen: blå ram och blå rubrik, och den lilla raden i full läsbarhet
   i stället för dämpad — det är där klockslaget och priset står. */
.bl-b.bl-pris{border-color:var(--blue)}
.bl-b.bl-pris b{color:var(--blue);display:flex;align-items:center;gap:5px;justify-content:center}
.bl-b.bl-pris small{color:var(--ink)}
.bl-b[disabled]{opacity:.45;cursor:default}
/* Egen tid: klockan överst, bokaknappen centrerad under den. */
/* Klocka och timer sida vid sida, samma form. Den valda ramas in. */
.bl-par{display:flex;gap:10px;width:100%;justify-content:center}
.bl-blk{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:9px 6px;border:1px solid var(--line);border-radius:14px;
  background:var(--inset);cursor:pointer;transition:.15s}
.bl-blk.vald{border-color:var(--ok);background:var(--panel-b)}
.bl-blk-h{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  color:var(--dim)}
.bl-blk.vald .bl-blk-h{color:var(--ok)}
.bl-egen{display:flex;flex-direction:column;align-items:center;gap:11px;margin:6px 0 6px}
/* Egen klockväljare — ingen <input type="time">, den öppnar Androids ruta
   ovanpå popupen. */
.bl-ur{display:flex;align-items:center;justify-content:center;gap:5px}
.bl-kol{display:flex;flex-direction:column;align-items:center;gap:3px}
.bl-num{display:block;min-width:46px;text-align:center;font-size:26px;font-weight:800;
  color:var(--ink);line-height:1.15;font-variant-numeric:tabular-nums}
.bl-kolon{font-size:26px;font-weight:800;color:var(--dim);padding:0 1px;line-height:1}
.bl-pil{width:46px;height:28px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);background:var(--inset);color:var(--dim);
  border-radius:9px;cursor:pointer;padding:0}
.bl-pil:active{border-color:var(--ok);color:var(--ok)}
.bl-pil .ic{width:14px;height:14px}
.bl-boka{min-width:140px;padding:10px 18px;border:1px solid var(--ok);
  background:var(--inset);color:var(--ok);border-radius:11px;cursor:pointer;
  font-family:inherit;font-size:13.5px;font-weight:800}
.te-alt{display:inline-flex;align-items:center;gap:6px;background:var(--inset);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font:inherit;font-weight:650;font-size:12.5px;cursor:pointer}
.te-alt .ic{width:15px;height:15px}
.te-move{display:flex;gap:8px}
.te-move button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--inset);border:1px solid var(--line);border-radius:11px;padding:11px;color:var(--ink);font:inherit;font-weight:650;font-size:12.5px;cursor:pointer}
.te-move button .ic{width:15px;height:15px}
.te-move button[disabled]{opacity:.4;cursor:default}
.ic.flip{transform:rotate(180deg)}
.dlg.edit .dlg-body{max-height:66vh;overflow-y:auto}
.stat{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.foot{margin-top:10px;text-align:center;font-size:11px;color:var(--faint);font-weight:500}

/* ===== v21: storlek, glow, status, väder, config ===== */
body{--solar:#ffc21f;--glowmul:1}
.seg.sol{background:#ffc21f}
/* storleksskalor */
.en-chip-ic{width:calc(var(--ch-ic-b,24px)*var(--ch-ic,1));height:calc(var(--ch-ic-b,24px)*var(--ch-ic,1))}
.en-chip-w{font-size:calc(var(--ch-v-b,18px)*var(--ch-v,1));color:var(--ink)}
.en-chip-l{font-size:calc(var(--ch-name-b,11px)*var(--ch-name,1))}
.en-chip-s{font-size:calc(var(--ch-desc-b,9px)*var(--ch-desc,1))}
/* Färdig pixel först, multiplikationen som reserv om js inte hunnit köra. */
.stat .stat-ic{width:var(--tl-ic-px,calc(var(--tl-ic-b,26px)*var(--tl-ic,1)));
  height:var(--tl-ic-px,calc(var(--tl-ic-b,26px)*var(--tl-ic,1)))}
.stat .v{font-size:var(--tl-v-px,calc(var(--tl-v-b,24px)*var(--tl-v,1)))}
.stat .label{font-size:var(--tl-name-px,calc(var(--tl-name-b,10px)*var(--tl-name,1)))}
.stat .meta{font-size:var(--tl-desc-px,calc(var(--tl-desc-b,11px)*var(--tl-desc,1)))}
/* glow: intensitet (gi=händelsestyrka) × global styrka (glowmul), skärpa styr suddighet/spridning */
.stat.is-on,.en-chip.is-on{box-shadow:0 0 calc((46px - 38px*var(--glowsharp,.75))*var(--gi,1)*var(--glowmul,1)) calc((9px - 3px*var(--glowsharp,.75))*var(--gi,1)*var(--glowmul,1)) var(--glow)}
/* glow */
.en-chip{position:relative;transition:all .16s,box-shadow .8s ease}
.chip-st{position:absolute;top:7px;right:9px;width:14px;height:14px;display:inline-flex}.chip-st .ic{width:100%;height:100%}
/* status i energi-rutan */
.en-status{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);flex:0 0 auto}
/* live-indikatorn i samma pill-stil som Insikter/Jämför */
.en-status-btn{position:relative;border:1px solid rgba(129,161,193,.28);background:rgba(129,161,193,.16);padding:6px 11px;border-radius:999px;gap:6px}
.en-hem{cursor:pointer}
.en-cmp.active{background:var(--blue);border-color:var(--blue);color:#0e1726}
.en-cmp.active .ic{color:#0e1726}
.en-status .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.en-status .dot.live{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.en-status .dot.cache{background:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 22%,transparent)}
.en-status .dot.dead,.en-status .dot.stale{background:var(--hot);box-shadow:0 0 0 3px color-mix(in srgb,var(--hot) 22%,transparent)}
.en-status .dot.dead~#status-text,.en-status .dot.stale~#status-text{color:var(--hot)}
.en-status .rel{font-size:10px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--faint)}
.en-status .rel.stale{color:var(--warm)}
/* väder centrerat över chipsen, väder & vind samma stil */
.wx-now{flex:1 1 0;justify-content:center}
.wx-hl{flex:1 1 0;justify-content:center}
.wx-windblock{flex:1 1 0;justify-content:center}
/* högre solgångsskala, ligger redan under energi */
.daystrip{padding:17px 22px}
body.mobile{--ds-h:6px}
body.mobile{--ds-sun:14px}
/* jämn radmarginal mellan alla rutor (icke-kiosk) */
#view-flode>.panel,#view-flode>.grid,#view-flode>.warnwrap{margin-top:0;margin-bottom:var(--pg-gap-y)}
#view-flode>*:last-child{margin-bottom:0}
/* config-meny */
.cfg{display:flex;flex-direction:column}
.cfg-sec{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin:15px 2px 7px}
.cfg-sec:first-child{margin-top:0}
/* Kvittensraden i Brevedens ruta. Egen klass och inte .drow-info: den är
   dold tills den öppnas, och statusen ska synas direkt. */

/* ===== BREVEDENS RUTA =====
   Allt scopat under .brv-pop. .dsec ritar ett streck under rubriken, och
   innehållet låg tidigare direkt mot det utan en enda pixels luft. */
.brv-pop .dsec+*{margin-top:12px}
.brv-pop .cfg-sec{margin:16px 2px 8px}
.brv-pop .cfg-btns{margin-bottom:0}
.brv-pop .cfg-btns+.cfg-sec{margin-top:18px}
/* Snabbvalen: ikon över text, tre i bredd. Etiketterna är olika långa och
   flex-wrap gav ojämna rader — ett rutnät ger lika stora ytor att träffa. */
/* Bilrutans två styrknappar. Marginaler i stället för gap, så layouten går att
   mäta i renderaren — samma skäl som i ladda max-rutan och vädersidan. */
/* v719: laddrutorna (husbatteri och bil). Samma luft under varje rubrik. */
.ladd-pop .dsec:first-child{padding-top:2px}
.ladd-pop .dsec+.drow{margin-top:2px}
.ladd-pop .dsec+.bl-val{margin-top:6px}
.ladd-pop .dsec+.bl-egen{margin-top:10px}
.ladd-pop .dsec+.brv-temp{margin-top:10px}
.bl-rad{margin:10px 0 4px;gap:8px}
.te-alt.arm{border-color:var(--warm);color:var(--warm-t);background:rgba(250,179,135,.18)}
.brv-falt.bil-a{align-items:baseline}
.brv-falt.bil-a b{font-size:24px;font-weight:800;line-height:44px;color:var(--ink)}
.brv-snabb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
/* Bilknapparna väntar på bekräftelse: guldkant och frågan som text. */
.brv-q.arm{border-color:var(--gold)!important;color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.brv-q{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;min-height:62px;padding:9px 5px;background:var(--inset);
  border:1px solid var(--line);border-radius:13px;color:var(--ink);
  font:inherit;font-size:11px;font-weight:700;line-height:1.15;text-align:center;cursor:pointer}
.brv-q .ic{width:19px;height:19px;color:var(--faint)}
.brv-q.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.brv-q.on .ic{color:var(--blue)}
.brv-q:active{transform:scale(.97)}
/* Temperaturen: minus, tal, plus i en rad där talet får ta plats. */
.brv-temp{display:flex;align-items:center;gap:10px}
.brv-step{flex:0 0 auto;width:52px;height:46px;display:flex;align-items:center;
  justify-content:center;background:var(--inset);border:1px solid var(--line);
  border-radius:13px;color:var(--ink);font:inherit;font-size:19px;font-weight:700;cursor:pointer}
.brv-step:active{transform:scale(.95)}
.brv-step[disabled]{opacity:.35}
/* v703: talet är ett fält; OK skickar. */
.brv-falt{flex:1 1 auto;min-width:74px;display:flex;align-items:baseline;justify-content:center;gap:3px;
  height:46px;box-sizing:border-box;padding:0 8px;background:var(--inset);border:1px solid var(--line);border-radius:13px}
.brv-falt:focus-within{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.brv-falt input{width:3.2ch;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:24px;font-weight:800;
  text-align:right;padding:0;line-height:44px;outline:none;-webkit-appearance:none;appearance:none}
.brv-falt span{font-size:14px;font-weight:700;color:var(--dim)}
.brv-ok{flex:0 0 auto;min-width:58px;height:46px;padding:0 14px;border-radius:13px;border:1px solid var(--line);
  background:var(--inset);color:var(--faint);font:inherit;font-size:15px;font-weight:800;cursor:pointer}
.brv-ok.on{background:var(--blue);border-color:var(--blue);color:#fff}
.brv-ok[disabled]{opacity:.45;cursor:default}
.brv-ok:active:not([disabled]){transform:scale(.95)}
.brv-utkast:empty{display:none}
.brv-utkast{margin-top:6px;font-size:11.5px;font-weight:700;color:var(--dim);text-align:center}
/* Spjällen ställs i en bild av inomhusdelen. En pil är lättare att peka på än
   ett ord som "Mellanhög", och bilden visar vad valet faktiskt gör. */
.brv-fig{width:100%;height:auto;display:block;margin:2px 0 4px;touch-action:manipulation}
.brv-fig .tr{cursor:pointer}
.brv-figtxt{text-align:center;font-size:11px;font-weight:700;color:var(--dim);margin-bottom:4px}
.brv-sekh{display:flex;align-items:center;gap:7px}
.brv-sekh .ic{width:13px;height:13px;color:var(--faint)}
.brv-pop .cfg-opt{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.brv-pop .cfg-opt .ic{width:14px;height:14px;color:var(--faint);flex:0 0 auto}
.brv-pop .cfg-opt.on .ic{color:var(--blue)}
.brv-status{font-size:11.5px;font-weight:650;color:var(--dim);padding:8px 2px 0}
.brv-fel{color:var(--warm)}
/* Talet mellan minus och plus är ingen knapp och ska inte se ut som en. */
.brv-tal{flex:1 1 auto;min-width:74px;text-align:center;align-self:center;
  font-size:15px;font-weight:800;color:var(--ink)}
/* VISA MER. Snabbvalen och temperaturen är det man kommer för; läge, fläkt och
   spjäll är sådant man ställer en gång och sedan låter vara. De ligger därför
   hopfällda — men i samma ruta, inte på ett annat ställe. */
.brv-mer{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
  margin:13px 0 0;background:none;border:0;padding:8px 4px;cursor:pointer;
  font:inherit;font-size:11px;font-weight:750;letter-spacing:.05em;
  text-transform:uppercase;color:var(--faint)}
.brv-mer .ic{width:13px;height:13px;transition:transform .18s}
.brv-mer.open .ic{transform:rotate(180deg)}
.brv-doldt{display:none}
.brv-doldt.open{display:block}
.cfg-btns{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.cfg-btns.synced{margin-bottom:9px}
.cfg-btns .cfg-opt{flex:1 1 auto}
.cfg-opt{flex:1 1 auto;min-width:74px;background:var(--inset);border:1px solid var(--line);border-radius:11px;padding:9px 10px;color:var(--ink);font:inherit;font-weight:650;font-size:12px;cursor:pointer}
.cfg-opt.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.cfg-prev{display:flex;justify-content:center;padding:14px;background:var(--inset);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.cfg-prev .en-chip{flex:0 0 140px;cursor:default}
.cfg-prev .stat{flex:0 0 180px;cursor:default}
/* Energi- och väderrutorna ligger tre i bredd — smalare förhandsvisning så
   proportionerna stämmer med startsidan. */
.cfg-prev.prev-chip .stat{flex:0 0 140px}
.cfg-row{display:flex;align-items:center;gap:11px;padding:5px 2px;min-width:0}
/* Etiketten fick bara 92px och radbröts i tre rader på smala skärmar. Nu får
   den ta den plats som blir över, med 92px som minsta bredd. */
.cfg-row-l{flex:1 1 92px;min-width:0;font-size:12px;font-weight:600;color:var(--dim);overflow-wrap:anywhere}
.cfg-row input[type=range]{flex:1 1 auto;min-width:0;accent-color:var(--blue)}
.cfg-num{flex:0 0 40px;text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.cfg-sel{flex:1 1 auto;background:var(--inset);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink);font:inherit;font-size:12.5px}
.cfg-reset{margin-top:16px}
.cfg-savebtn{width:100%;background:var(--ok);color:#10331a;border:none;border-radius:11px;padding:11px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.cfg-savebtn:active{filter:brightness(.92)}
.cfg-savedmsg{font-size:10.5px;color:var(--faint);text-align:center;margin:7px 0 12px}
.learn-info{background:var(--inset);border:1px solid var(--line);border-radius:12px;padding:8px 11px}
.learn-row{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
.learn-row:last-child{border-bottom:none}
.learn-l{flex:0 0 84px;font-size:12px;font-weight:650}
.learn-b{flex:1 1 auto;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--blue)}
.learn-n{flex:0 0 auto;font-size:10px;color:var(--faint);font-weight:600}
.learn-hint{font-size:10px;color:var(--faint);margin:7px 2px 10px;line-height:1.35}
.te-numin{flex:1 1 auto;min-width:0;background:var(--inset);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--ink);font:inherit;font-size:14px}
#nightdim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 2s ease;z-index:300}
#nightclock{position:fixed;inset:0;background:#04040a;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:400;cursor:pointer}
#nightclock.on{display:flex}
#nc-time{font-size:min(26vw,150px);font-weight:750;letter-spacing:.02em;color:#3b3f54;font-variant-numeric:tabular-nums;line-height:1}
#nc-date{font-size:15px;font-weight:600;color:#2c2f42;text-transform:capitalize}
#nc-temp{font-size:19px;font-weight:700;color:#343850}
#nc-info{margin-top:22px;display:flex;flex-direction:column;gap:9px;width:min(88%,520px);max-width:88vw}
#nc-info{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:560px;padding:0 18px}
#nc-info .nc-warn,#nc-info .nc-ok{display:flex;align-items:center;justify-content:center;text-align:center;gap:10px;font-size:15px;font-weight:600;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:11px 14px;color:#5a5f78;width:100%;box-sizing:border-box}
#nc-info .nc-wi{width:19px;height:19px;flex:0 0 auto;display:inline-flex}#nc-info .nc-wi .ic,#nc-info .nc-ok .ic{width:19px;height:19px}
#nc-info .nc-warn.crit{color:#8a4a52}#nc-info .nc-warn.crit .nc-wi{color:#a05561}
#nc-info .nc-warn.warn{color:#84623a}#nc-info .nc-warn.warn .nc-wi{color:#9a7343}
#nc-info .nc-ok{color:#3f6a4a}#nc-info .nc-ok .ic{color:#3f6a4a}
.pbar{height:7px;border-radius:5px;background:var(--inset);border:1px solid var(--line);overflow:hidden;margin-top:11px}
.pbar i{display:block;height:100%;background:var(--cyan);border-radius:5px}
.dbars{display:flex;gap:9px;align-items:flex-end;justify-content:center;margin-top:14px}
.dbar{display:flex;flex-direction:column;align-items:center;gap:4px}
.dbar i{display:block;width:22px;border-radius:5px 5px 2px 2px}
.dbar-v{font-size:9px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
.dbar-d{font-size:9px;font-weight:600;color:var(--faint);text-transform:uppercase}
.dbar-cap{text-align:center;font-size:10px;color:var(--faint);margin-top:6px}
.pcurve{margin-bottom:12px}
.pcurve svg{width:100%;height:76px;display:block}
.pcurve-x{display:flex;justify-content:space-between;font-size:9px;color:var(--faint);font-weight:600;margin-top:2px}
.pcurve-y{text-align:center;font-size:10px;color:var(--dim);font-weight:600;margin-top:4px}

/* ===== v33 ===== */
/* Rapportraden ska ALLTID vara exakt en rad hög. Två regler slog tidigare av
   avkortningen på telefonen (white-space:normal), så raden växte med textens
   längd och rutan hoppade i höjd när meddelandet byttes. Nu är radhöjden låst
   till en textrad – lång text slutar med … och hela texten läses i popupen. */
.warns.tick{display:flex;align-items:center;gap:10px;padding:11px 15px;min-height:44px;
  cursor:pointer;overflow:hidden}
.rep-list{display:flex;flex-direction:column;gap:0}
.rep-row{display:flex;align-items:flex-start;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line)}
.rep-row:last-child{border-bottom:0}
.rep-ic{width:18px;height:18px;flex:0 0 auto;margin-top:1px;display:inline-flex}.rep-ic .ic{width:100%;height:100%}
.rep-ic.acc-hot{color:var(--hot)}.rep-ic.acc-warm{color:var(--warm)}.rep-ic.acc-green{color:var(--ok)}
.rep-tx{flex:1 1 auto;font-size:13px;font-weight:600;line-height:1.35}
.rep-lv{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--dim);margin-top:1px}
.warns.tick .wi{width:17px;height:17px;flex:0 0 auto;display:inline-flex}.warns.tick .wi .ic{width:100%;height:100%}
.warns.tick .wt{flex:1 1 auto;min-width:0;font-size:12.5px;font-weight:600;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.warns.tick .lvl{font-size:11px;font-weight:700;color:var(--dim);flex:0 0 auto;white-space:nowrap}
.warns.tick .wdots{display:flex;gap:4px;flex:0 0 auto}
.warns.tick .wdots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.warns.tick .wdots i.on{background:var(--dim)}
.warns.tick.crit .wi{color:var(--hot)}.warns.tick.warnc .wi{color:var(--warm)}.warns.tick.okc .wi{color:var(--ok)}
body{background-image:radial-gradient(900px 420px at 50% -8%,rgba(129,161,193,.05),transparent)}
.kiosk .hd{margin-bottom:8px}
.kiosk .warns.tick{padding:8px 13px;min-height:36px}.kiosk .warns.tick .wt{font-size:11.5px}
/* viz i popuper */
.viz{margin:2px 0 6px}
.viz svg{width:100%;height:146px;display:block}
/* SAMMA TEXT UNDER ALLA GRAFER. Bildtexterna hade tre olika storlekar och
   fyra olika färger beroende på vem som ritade grafen. Klasserna är kvar —
   det är bara utseendet som slagits ihop. */
.viz-cap,.tg-cap,.avl-cap{text-align:center;font-size:10px;color:var(--faint);font-weight:600;margin-top:5px}
.viz-empty{padding:16px;text-align:center;font-size:11.5px;color:var(--faint);background:var(--inset);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
.te-glow.gr{flex:1}

/* ===== v34: horisontell layout, större ikon+text ===== */
body{--tl-ic-b:34px;--tl-v-b:27px;--tl-name-b:11px;--tl-desc-b:11px;--ch-ic-b:28px;--ch-v-b:19px;--ch-name-b:11px;--ch-desc-b:9.5px}
.stat{display:flex;align-items:center;gap:14px;text-align:left;--ind:0}
/* CENTRERING. Klasserna sattes i renderTiles men reglerna fanns aldrig — därför
   hände ingenting. Ikonen är redan lodrätt centrerad av align-items; knappen
   gör det uttryckligt och nollar marginaler som annars drar den uppåt. */
/* !important: mediefrågan sätter align-items:flex-start på body:not(.kiosk)
   .stat, vilket har HÖGRE specificitet än en enkel klass — därför gjorde
   knappen ingenting på telefonen. */
.stat.ic-mitt{align-items:center!important}
.stat.ic-mitt .stat-ic{align-self:center!important;margin-top:0!important;margin-bottom:0!important}
/* Hela innehållet centrerat. justify-content ensamt räcker inte: textblocket
   växer och fyller raden, så det finns ingenting att centrera. */
.stat.allt-mitt{justify-content:center!important;text-align:center!important;
  align-items:center!important}
.stat.allt-mitt .stat-txt{flex:0 1 auto;display:flex;flex-direction:column;align-items:center}
.stat.allt-mitt .label,.stat.allt-mitt .v,.stat.allt-mitt .meta{text-align:center!important;padding-left:0}
.stat-txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.stat .v,.stat .meta{padding-left:0}
.stat .v{margin:0}
.stat-ic{flex:0 0 auto}
.stat-st{position:absolute;top:12px;right:14px;margin:0}
.en-chip{flex-direction:row!important;align-items:center;justify-content:flex-start;gap:11px;text-align:left;padding:12px 13px}
.en-chip-ic{flex:0 0 auto}
.en-chip-txt{display:flex;flex-direction:column;min-width:0;gap:1px;flex:1 1 auto}
.en-chip-l{color:var(--dim);font-weight:660}
.en-chip-w{color:var(--ink)}
.en-chip-s{text-align:left;white-space:normal;line-height:1.25;letter-spacing:.02em;text-transform:none}
.kiosk{--tl-ic-b:26px;--tl-v-b:18px;--tl-name-b:10px;--tl-desc-b:9px;--ch-ic-b:22px;--ch-v-b:16px}
.kiosk .stat{gap:11px;padding:9px 12px}
.kiosk .en-chip{padding:9px 10px;gap:9px}
.kiosk .stat-st{top:8px;right:10px}

/* ===== v35 ===== */
.en-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:3px}
.stat{gap:var(--tl-gap,14px)}
.en-chip{gap:var(--ch-gap,11px)}
.daystrip{padding:24px 24px}
body.kiosk{--ds-h:9px}
body.kiosk{--ds-sun:17px}
.warns.tick{min-height:50px;padding:13px 16px}
.warns.tick .wt{font-size:13px}
.kiosk .daystrip{padding:11px 18px}
.kiosk .warns.tick{min-height:42px;padding:11px 15px}
.kiosk .warns.tick .wt{font-size:12px}
.kiosk .stat{gap:var(--tl-gap,11px)}
.kiosk .en-chip{gap:var(--ch-gap,9px)}
.pband.hide-spot{display:none}
.spot-cal{display:inline-flex;gap:6px;align-items:center}
.cfg-inp{width:104px;background:var(--panel-b);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 9px;font-family:var(--sans);font-size:13px;font-weight:650}
.spot-cal .te-use{padding:6px 12px}
.pb-lvl{margin-left:auto;font-size:11px;font-weight:700;color:var(--dim);white-space:nowrap}
.pb-head{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.pb-head .pb-ic{width:15px;height:15px;color:var(--blue);flex:0 0 auto}.pb-head .pb-ic svg{width:15px;height:15px}
.pb-title{font-size:10.5px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
/* priset rider på spåret: vänster = billigt, höger = dyrt. Färgen följer skalan. */
.tide-end{position:absolute;top:50%;transform:translateY(-50%);font-size:calc(7.5px*var(--spend,1));font-weight:750;color:var(--spendcol,#111);white-space:nowrap;pointer-events:none;z-index:1}
.tide-end.on-white{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.tide-end-lo{left:8px}
.tide-end-hi{right:8px}
.tide-price{position:absolute;top:50%;transform:translate(-50%,-50%);display:inline-flex;align-items:baseline;gap:2px;z-index:2;
  padding:calc(2px*var(--spslide,1)) calc(8px*var(--spslide,1));border-radius:999px;white-space:nowrap;background:var(--panel-b);
  border:1.5px solid var(--pc,var(--ink));box-shadow:0 2px 8px rgba(0,0,0,.28);transition:left .8s cubic-bezier(.2,.7,.2,1)}
.tide-price .big,.tide-price #price{font-size:calc(15px*var(--spnum,1));font-weight:850;letter-spacing:-.02em;line-height:1;color:var(--pc,var(--ink))}
/* Köpt/sålt-slide: spåret delas köpt|sålt vid proportionen; beloppen rider på var sin sida. */
.ks-track{position:relative;width:100%;height:calc(8px*var(--ksscale,1));border-radius:6px;
  opacity:.95;
  /* Köpt till vänster, sålt till höger — alltså omvänd riktning mot spotpriset.
     Samma tre färger, så de två skalorna läses med samma ögon. */
  background:linear-gradient(90deg,
    var(--hot) 0%,
    color-mix(in srgb,var(--hot) 45%,var(--gold)) 30%,
    var(--gold) 50%,
    color-mix(in srgb,var(--gold) 45%,var(--ok)) 72%,
    var(--ok) 100%)}
.ks-split{position:absolute;top:50%;width:2.5px;height:calc(16px*var(--ksscale,1));background:var(--ink);border-radius:2px;
  transform:translate(-50%,-50%);box-shadow:0 0 0 3px var(--marker-ring),0 0 10px 1px rgba(120,120,160,.35);transition:left .8s cubic-bezier(.2,.7,.2,1)}
.ks-chip{position:absolute;top:50%;transform:translate(-50%,-50%);display:inline-flex;align-items:baseline;gap:3px;
  padding:calc(2px*var(--ksslide,1)) calc(8px*var(--ksslide,1));border-radius:999px;white-space:nowrap;background:var(--panel-b);
  box-shadow:0 2px 8px rgba(0,0,0,.28);transition:left .8s cubic-bezier(.2,.7,.2,1)}
.ks-chip b{font-size:calc(15px*var(--ksnum,1));font-weight:850;letter-spacing:-.02em;line-height:1}
.ks-chip .ks-cap{font-size:calc(9px*var(--ksnum,1));font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.ks-kop-chip{border:1.5px solid var(--hot)}.ks-kop-chip b{color:var(--hot)}
.ks-sal-chip{border:1.5px solid var(--ok)}.ks-sal-chip b{color:var(--ok-t)}
.tide-price .unit{font-size:9.5px;font-weight:700;color:var(--dim)}
.cfg-back-row{margin-bottom:6px}
.cfg-back-row .te-alt{width:auto;padding:7px 12px}
.cfg-hint{font-size:10.5px;color:var(--faint);margin:9px 2px 4px;line-height:1.4;
  overflow-wrap:anywhere}                       /* adresser och flaggor måste få brytas */
.cfg-hint code{word-break:break-all;font-size:10px}
.bk-ta{width:100%;box-sizing:border-box;min-height:88px;background:var(--inset);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:11.5px/1.4 ui-monospace,monospace;padding:9px;resize:vertical;margin-bottom:8px;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}

.stat .meta .tr.up{color:var(--ok)}.stat .meta .tr.down{color:var(--blue)}
.en-status .dot.stale{background:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 22%,transparent)}
.en-status .dot.stale~#status-text{color:var(--gold)}

.cfg-step .cfg-num{flex:0 0 48px;text-align:center}
.te-glow{flex:1}.te-glow.on{border-color:var(--ok)!important;color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}

/* ===== KIOSK: lås ramen till skärmen ===== */
body.kiosk{height:100vh;height:100svh;overflow:hidden;padding:9px 14px}
body.tabprev{padding:0;overflow:hidden}
/* v746: andra plattor än väggplattan skrollar (se applyKiosk). Ramen är minst
   en skärm hög – får allt plats ser sidan ut precis som förut – men växer med
   innehållet i stället för att trycka ihop det. */
body.kiosk.rull{height:auto;min-height:100vh;min-height:100svh;overflow:visible}
.kiosk.rull .wrap{height:auto;min-height:calc(100vh - 18px);min-height:calc(100svh - 18px)}
body.kiosk.rull .flikrad{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:40;
  box-shadow:0 8px 24px -10px rgba(0,0,0,.35)}
.kiosk .wrap{height:100%;display:flex;flex-direction:column}
.kiosk .topbar{flex:0 0 auto;margin-bottom:7px}
.kiosk .statusbar{padding:var(--pg-gap-y)}
.kiosk .view{flex:1 1 auto;min-height:0;overflow:visible;display:flex;flex-direction:column;gap:var(--pg-gap);padding-bottom:var(--pg-gap)}
.kiosk .view.hidden{display:none}
.kiosk .foot{display:none}
/* Flöde fyller exakt, ingen scroll */
.kiosk #view-flode{overflow:visible}
.kiosk .daystrip{padding:15px 16px;flex:0 0 auto;margin:0}
.kiosk .daystrip.scrubbing{padding:12px 16px 30px}
.kiosk .insight{display:none!important}
/* flex-grow 1: krymper man spotpris eller köpt/sålt måste den frigjorda höjden
   tas upp av något, annars blir det en lucka mot skärmens underkant. Rapporten
   ligger sist och är den enda ruta som tål att bli högre utan att se konstig ut.
   --repgrow låter en styra det: 0 = som förr, ligger kvar i sin storlek. */
.kiosk .warnwrap{flex:0 0 auto;min-height:0;display:flex;margin:0}
/* v683: RAPPORTEN HAR FAST HÖJD för en textrad (växer inte längre — det gör
   knapparna i stället). Inställningen "rapporten växer" (--repgrow) gäller
   därför inte på väggplattan. */
.kiosk .warns.tick .wt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* KNAPPRADEN FYLLER DET SOM BLIR ÖVER: raderna delar på höjden, knapparna
   sträcks. */
/* Hög specificitet: .kiosk .controls längre ned sätter flex:0 0 auto. Raderna
   har grundhöjd auto — med 0 kollapsade de när rutan inte fick extra höjd. */
body.kiosk #view-flode>[data-sec="buttons"]{flex:1 1 auto;display:flex;flex-direction:column}
body.kiosk #view-flode>[data-sec="buttons"] .ctl-row{flex:1 1 auto}
body.kiosk #view-flode>[data-sec="buttons"] .ctl{height:auto}
/* Större förbrukningstal och förklaring på väggen. */
.kiosk .en-kw{font-size:34px}
.kiosk .en-mix-leg{font-size:12px}
.kiosk .warns.tick{flex:1 1 auto;width:100%;align-items:center}
.kiosk .warns.tick .wt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.kiosk #view-flode>.panel,.kiosk #view-flode>.grid{flex:0 0 auto}
/* Fast höjd, styrd av --ewh. Förut svalde den här raden allt överblivet
   utrymme, vilket gjorde det omöjligt att sätta dess höjd själv — och lämnade
   rapporten med en lucka under sig när spotpris krympts. Nu är rapporten den
   enda som växer. */
.kiosk .ew-row{flex:0 0 auto;min-height:0;margin:0;height:calc(var(--ewh,1)*38vh)}
.kiosk .ew-row>.panel{min-height:0;padding:11px 13px}
.kiosk .enpanel .rc-head,.kiosk .wx-card .rc-head{margin-bottom:8px}
.kiosk .en-body{gap:10px}
/* (v683: förbrukningstalet sätts längre ned, 34 px) */
.kiosk .en-chip{padding:9px 6px;border-radius:14px;--ch-ic-b:20px;--ch-v-b:16px}.kiosk .en-mix-leg{gap:10px}
.kiosk .wx{gap:9px}
.kiosk .wx-temp{font-size:25px}
.kiosk .wx-compass{width:64px;height:64px}.kiosk .wx-arrow{width:38px;height:38px}.kiosk .wx-hl-v{font-size:16px}
/* min-height är BORTTAGET. Det låste rutan vid 64 px och gjorde att inget hände
   när man drog storleken under noll — höjden räknades ut men golvet vann.
   Höjden styrs av --spbox, och overflow:hidden håller innehållet innanför. */
.kiosk .pband{flex:0 0 auto;padding:10px 15px 8px;margin:0;display:flex;flex-direction:column;justify-content:center}
.kiosk .pband-slim{padding:15px 16px}
.kiosk .pband .price-now .big{font-size:24px}
.kiosk .pband .tide{margin-top:0}
.kiosk .stats{flex:0 0 auto;margin:0;gap:var(--pg-gap)}
.kiosk .stat .v{margin:1px 0 0}.kiosk .stat-st{width:13px;height:13px}
/* Knapprutans innerkant är samma mått som mellanrummet mellan knapparna —
   7 px runt och 15 px emellan såg ut som ett misstag. */
.kiosk .controls{flex:0 0 auto;margin:0;padding:var(--pg-gap);gap:var(--pg-gap)}
/* Knapparna skalas med --knhojd (1 = som förut). Måtten står HÄR och inte i ett
   eget block högre upp: den här raden kommer sist i filen och hade annars
   skrivit över det. */
.kiosk .ctl{min-height:calc(48px*var(--knhojd,1));padding:calc(6px*var(--knhojd,1));gap:3px}
.kiosk .ctl-ic{width:calc(17px*var(--knhojd,1)*var(--knikon,1));
  height:calc(17px*var(--knhojd,1)*var(--knikon,1))}
.kiosk .ctl-l{font-size:calc(11px*var(--knhojd,1)*var(--kntext,1))}
.kiosk .ctl-s{font-size:calc(8.5px*var(--knhojd,1)*var(--kntext,1))}
.kiosk .foot{margin-top:0}
/* ===== v37 ===== */
.en-hero{align-items:center}
.en-top{margin-left:auto;align-self:flex-start;display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto}
.en-top .en-status{justify-content:flex-end}
.en-top .en-self{margin:0}
.warns.tick{gap:12px}
.warns.tick .wi{width:22px;height:22px}
.warns.tick .wt{font-size:15px;font-weight:650}
.warns.tick .lvl{font-size:13px}
.warns.tick .wdots i{width:6px;height:6px}
.kiosk .warns.tick{padding:12px 17px}
.kiosk .warns.tick .wt{font-size:15px}
.kiosk .warns.tick .wi{width:21px;height:21px}
.kiosk .warns.tick .lvl{font-size:13px}
/* ===== v38 ===== */
.en-top{flex-direction:row;align-items:center;gap:var(--pg-gap-y);flex-wrap:nowrap}
/* margin-left LÄGGS TILL gap:et — knapparna fick 8+8 px mellan sig medan
   notisen och live hade 8. Nu bär gap allt, så alla mellanrum är lika. */
.en-top .en-cmp{margin-left:0}
/* Notisen och live hålls ihop till höger; luften hamnar till vänster om dem. */

/* Notisen bär luften; live följer direkt efter. Klassväljare så att alla fyra
   vyerna beter sig lika utan att någon lista behöver hållas i synk. */
.en-top .en-notis{margin-left:auto}
.en-top .en-status{flex:0 0 auto;margin-left:0}
.en-chip{gap:var(--ch-gap,11px)}
.kiosk .en-chip{gap:var(--ch-gap,9px)}
.wx-hl{align-self:center}
/* ===== v39 ===== */
.secmv{display:flex;flex-direction:column;gap:7px;margin:6px 0 4px}
/* Dolt avsnitt: bort ur flödet helt, så kioskens höjdfördelning inte lämnar en
   lucka där det stod. */
.sec-dold{display:none!important}
/* Bandet inuti energipanelen: ingen egen bakgrund, ram eller marginal — det är
   en rad i panelen, inte ett kort. Ingen padding heller: avdelaren ovanför bär
   avståndet, och två luftrum på samma ställe blev dubbelt. */
.sp-inne{background:none!important;border:0!important;box-shadow:none!important;
  margin:0!important;padding:0!important;height:auto!important;
  min-height:0!important;overflow:visible!important;
  /* RAD, inte kolumn. .kiosk .pband sätter flex-direction:column för det gamla
     fristående bandet — inbäddat blev raden då en kolumn, och skalan krympte
     till innehållets bredd i stället för att fylla panelen. Det är därför
     väggplattan såg helt annorlunda ut än telefonen. */
  display:flex!important;flex-direction:row!important;align-items:center!important;
  width:100%!important}
/* Och innehållet ska ta hela bredden. */
.sp-inne .ds-live{flex:1 1 auto;min-width:0}
/* Avdelaren mellan panelens huvuddel och dess rutor. */
/* Samma mått lodrätt som vågrätt. Linjen går KANT TILL KANT, lika lång som
   remsans egen border-top — en indragen linje bredvid en genomgående såg ut som
   två olika sorters avdelare. */
.pn-del{height:1px;background:var(--line);opacity:.75;margin:var(--avd-pad) 0 0}
/* Avdelaren FÖRE spotbandet: rutraden ovanför bär redan sin nedre padding, så
   en marginal här blev dubbelt avstånd — linjen låg synligt längre ner än den
   över rutraden. Luften under linjen ligger i stället i bandets plats. */
#sp-del{margin-top:0}
#sp-plats{padding-top:var(--avd-pad)}
/* SOLREMSAN I VÄDERRUTAN (v674) — samma behandling som spotbandet i
   energipanelen. Väderremsan ovanför har ingen nedre padding, så avdelaren
   behåller sin vanliga marginal ovanför; luften under ligger i platsen. */
.sol-inne{background:none!important;border:0!important;box-shadow:none!important;
  margin:0!important;padding:0!important;height:auto!important;min-height:0!important;
  overflow:visible!important;width:100%!important}
/* Skrubbläget behöver luft under för klockslaget (.ds-time ligger absolut i
   botten) och sidoplats för −/+. */
.sol-inne.scrubbing{padding:6px 0 28px!important}
#sol-plats{padding-top:var(--avd-pad)}
/* Rutorna inuti panelen: ingen egen bakgrund eller ram, bara innehåll. */
/* Tightare: rutorna sitter redan i en panel med egen innerkant och behöver inte
   samma luft som när de var egna kort. */
/* Ingen marginal här: luften ligger som padding INUTI rutorna i stället, så
   avståndet från innehållet till linjen blir detsamma uppåt, nedåt och åt
   sidorna. En marginal på raden hade lagt sig ovanpå den paddingen. */
.pn-tiles{margin-top:0;background:none;border:0;box-shadow:none;padding:0;gap:0}
/* EGNA BASMÅTT för tre-kolumnsraderna. De sex rutorna ligger två i bredd och
   har gott om plats; energi- och väderraderna tre i bredd på samma yta. Med
   samma basmått klipptes "2.3 kW" och rubrikerna trunkerades till "LUFTFUKTI…".
   Skalreglagen verkar ovanpå det här, så 100 % ser rätt ut från början. */
/* Samma basmått i förhandsvisningen som i den riktiga raden. Låg den utanför
   .pn-tiles fick den de generella måtten och visade en annan storlek än den
   skulle förutsäga — en förhandsvisning som ljuger är värre än ingen. */
.pn-tiles,.cfg-prev.prev-chip{--tl-v-b:21px;--tl-ic-b:24px;--tl-name-b:10px;--tl-desc-b:10px}
/* v729: värdet 17 → 19 px på mobilen (Markus: Sol nu/Batteri/Elnät lite större). 20 px gick inte: "−2.6 kW" nådde avdelaren och "−11.4 kW" kortkanten. */
body.mobile .pn-tiles,body:not(.kiosk) .pn-tiles,
body.mobile .cfg-prev.prev-chip,body:not(.kiosk) .cfg-prev.prev-chip{--tl-v-b:19px;--tl-ic-b:20px;
  --tl-name-b:9.5px;--tl-desc-b:9.5px}
/* v730: platta i liggande (varken kiosk eller mobil) — gott om bredd, 23 px.
   v729:s 19 px ovan gällde av misstag även här (body:not(.kiosk)). Kiosk: 22 px. */
body:not(.kiosk):not(.mobile) .pn-tiles,body:not(.kiosk):not(.mobile) .cfg-prev.prev-chip{--tl-v-b:23px}
.kiosk .pn-tiles,.kiosk .cfg-prev.prev-chip{--tl-v-b:22px;--tl-ic-b:22px;--tl-name-b:9.5px;--tl-desc-b:9px}
/* Rubriken får plats: något glesare teckenavstånd kostar mer än det smakar när
   kolumnen är smal. */
.pn-tiles .label{letter-spacing:.02em}
/* Mellanrummet ikon–text som MARGINAL, inte som flex-gap. gap på flex stöds
   inte av äldre WebKit — och i en dashboard som körs i en webbläsarvy på en
   platta är det inte värt att gissa. Marginalen fungerar överallt.
   Gapet ligger kvar som reserv för radbrytande layouter. */
.stat>.stat-ic{margin-right:var(--tl-gap,14px)}
.kiosk .stat>.stat-ic{margin-right:var(--tl-gap,11px)}
/* Centrerat innehåll ska inte ha marginalen kvar på ena sidan. */
.stat.allt-mitt>.stat-ic{margin-right:calc(var(--tl-gap,14px)/2);
  margin-left:calc(var(--tl-gap,14px)/2)}
.pn-tiles>.stat{background:none;border:0;box-shadow:none}
/* Lodräta avdelare MELLAN rutorna i en panel — luftfukt | regn | tryck, och
   sol nu | batteri | elnät. Utan dem flyter tre tal ihop till en rad siffror.
   :not(:first-child) i stället för en egen klass, så inget behöver hållas i takt
   när rutorna byts ut. */
/* RAKA linjer. Rutorna har olika höjd — en med underrubrik är högre än en utan —
   och border-left följer sitt eget elements höjd. Linjerna började och slutade
   därför på olika ställen och böjde sig som parenteser. Ett pseudoelement som
   spänner hela rutnätets höjd ger raka linjer av samma längd. */
.pn-tiles{position:relative;align-items:stretch}
.pn-tiles>.stat{position:relative}
/* INDRAGET, INTE LANGDEN, AR DET SOM SKA VARA LIKA.
   Har stod tidigare en fast hojd pa 44 px, centrerad i raden, med motiveringen
   att linjerna annars blir olika langa i olika avsnitt - vaderraden har en
   46 px ikon, rutraden bara text. Det var fel sak att halla lika. Det man ser
   ar avstandet mellan det lodrata strecket och det vagrata ovanfor och nedanfor
   det, och med en fast hojd i en rad vars hojd varierar blir just det avstandet
   olika: matt i skarmdumpen 2026-08-30 lag strecket 50 bildpunkter under den
   ovre avdelaren och 38 over den undre, i en rad dar bada borde varit lika.
   Andrar man dessutom textstorleken vaxer raden medan de 44 px star still, och
   strecket ser kortare och kortare ut.
   Nu binds strecket till --avd-pad i vardera anden, precis som i rutnatet med
   de sex rutorna. Da ar avstandet till de vagrata avdelarna detsamma i alla
   avsnitt och foljer med nar innehallet skalas. Att linjerna darmed blir olika
   LANGA i olika rader ar meningen: de ar lika langa som sitt innehall. */
.pn-tiles>.stat+.stat::before{content:'';position:absolute;left:0;
  top:var(--avd-pad);bottom:var(--avd-pad);
  width:1px;background:var(--line)}
/* Sist i panelen bar raden ingen padding nedtill - da finns ingen vagrat
   avdelare under att halla avstand till, och panelens egen innerkant gor
   jobbet. Strecket far ga hela vagen ner till innehallets underkant. */
.pn-tiles:last-child>.stat+.stat::before{bottom:0}
/* Lika luft runt hela rutan — upp, ner och ut mot avdelarna. */
/* ===== RUTORNA =====
   Avsnittet var sex fristaende kort i ett rutnat och stack ut mot de ovriga,
   som alla ar paneler. Nu bar panelen ramen och rutorna ligger inuti utan egen
   bakgrund, avdelade med samma tunna streck som i Forbrukning nu.

   Strecken sitter pa rutorna sjalva, inte som egna element: ett rutnat med
   avdelare mellan cellerna gar inte att uttrycka med gap, och extra element
   hade brutit rutnatets radraknare. Darfor ::before for lodratt och ::after
   for vagratt, och nth-child avgor var de INTE ska finnas. */
.tileswrap{padding:var(--avd-pad)}
.fl-tiles{margin:0;background:none;border:0;box-shadow:none;padding:0;gap:0;
  grid-template-columns:repeat(3,minmax(0,1fr));position:relative;align-items:stretch}
.fl-tiles>.stat{background:none;border:0;box-shadow:none;position:relative;
  padding:var(--avd-pad)}
/* Den lodrata avdelaren spanner mellan radens kanter med SAMMA indrag upptill
   och nedtill. Forut var den 44 px hog och centrerad, vilket gav olika avstand
   till den vagrata linjen beroende pa hur hog raden rakade bli - overst i
   rutnatet stotte den nastan i den, langst ner blev det ett stort glapp.
   Indraget ar avdelarnas eget matt, samma som luften runt rutorna. */
.fl-tiles>.stat::before{content:'';position:absolute;left:0;
  top:var(--avd-pad);bottom:var(--avd-pad);
  width:1px;background:var(--line)}
/* AVDELARNA GAR INTE UT I KANTEN.
   Forut drogs de lodrata strecken anda ut till rutnatets over- och underkant
   (top:0 pa forsta raden, bottom:0 pa den sista). Nar panelens innerkant
   flyttades in i rutorna i v588 blev rutnatets kant samma sak som PANELENS
   kant, och da gick strecken hela vagen ut. Ingen annan panel gor sa: deras
   avdelare ar indragna.
   Matt i skarmdumpen fran plattan: avdelaren i energipanelen och den i
   vaderpanelen gar bada fran x=38 till x=761, med panelens ram pa 19 och 780.
   Alltsa 19 bildpunkter in fran ramen - vilket ar --avd-pad. Samma indrag
   galler nu har, upptill, nedtill och at sidorna, sa att avdelarnas andar
   ligger i linje med innehallets kanter. */
/* EN LINJE, INTE TRE HOPSATTA BITAR.
   Forsta forsoket lat varje ruta rita sin egen bit av den vagrata linjen och
   drog ut varje bit en bildpunkt at bada hallen, sa att de skulle mota varandra
   aven om kolumnbredden inte gick jamnt ut i tre. Bitarna motte varandra - men
   de LADE SIG OCKSA OVER varandra, tva bildpunkter i varje skarv. Linjefargen
   ar genomskinlig (--line har alfa 0,13), och dar tva bitar malar samma punkt
   blir det 0,24. Alltsa tva morkare prickar i linjen. I kiosklaget doldes det
   av att kolumngapet slet isar bitarna i stallet; pa mobilen, dar gapet var
   noll, syntes overlappet.

   Nu ritas linjen som EN rektangel: forsta rutan pa varje ny rad far ett
   ::after med width:300%. Kolumnerna ar minmax(0,1fr) och gapet ar noll, sa tre
   cellbredder ar exakt rutnatets bredd - inga skarvar att vare sig glappa eller
   overlappa, oavsett hur bredden faller. :not(:first-child) haller den borta
   fran allra forsta raden, som inte har nagon rad ovanfor sig. */
.fl-tiles>.stat::after{content:none}
.fl-tiles>.stat:nth-child(3n+1):not(:first-child)::after{content:'';display:block;
  position:absolute;top:0;left:var(--avd-pad);
  width:calc(300% - var(--avd-pad) * 2);height:1px;background:var(--line)}
/* Tre kolumner: inget lodratt streck forst pa raden. */
.fl-tiles>.stat:nth-child(3n+1)::before{display:none}
/* CENTRERINGEN maste vara mer specifik an rutnatets egna regler. ".ic-mitt"
   ensam ar en klass; ".fl-tiles>.stat" ar tva plus en kombinator, och aven med
   !important pa den forsta forlorade den nar bada satte samma egenskap pa
   olika element. Har star bada delarna i samma selektor. */
.fl-tiles>.stat.ic-mitt,.pn-tiles>.stat.ic-mitt,.en-stats>.stat.ic-mitt{align-items:center!important}
/* AVSTANGT LAGE MASTE OCKSA GORA NAGOT.
   Utanfor kiosklaget ar grundlaget "ikonen hogst upp" och installningen
   centrerar. I kiosk ar grundlaget redan centrerat, sa knappen slog pa nagot
   som redan var pa - den gjorde ingen synlig skillnad pa vaggplattan.
   Nu betyder av samma sak overallt: ikonen hogst upp. Star knappen pa forblir
   plattan som den ar; slar man av den flyttas ikonen upp, vilket ar vad
   "centrera" avstangt rimligen ska betyda. */
body.kiosk .fl-tiles>.stat:not(.ic-mitt):not(.allt-mitt),
body.kiosk .pn-tiles>.stat:not(.ic-mitt):not(.allt-mitt),
body.kiosk .en-stats>.stat:not(.ic-mitt):not(.allt-mitt){align-items:flex-start}

  justify-content:center!important;text-align:center!important;align-items:center!important}
 /* De tva raderna som tog bort ytterkanternas padding ar borta - se blocket
    "DE SEX RUTORNA" sist i filen. Alla sex rutor har nu samma padding runtom. */
/* TRE KOLUMNER OCKSA I HANDEN. Mobilen brot forut till tva kolumner och tre
   rader, vilket gav avsnittet en annan taktart an energipanelens rutrad strax
   ovanfor - tva rutrader med olika indelning under varandra las som tva olika
   sorters innehall. Nu ar det sex rutor i tre kolumner overallt, med samma
   avdelare som i energipanelen.
   Texten skalar efter bredden, sa tre kolumner ryms; blir det trangt ar det
   rutans egna matt som ska ner, inte antalet kolumner. */
body.mobile:not(.kiosk) .fl-tiles{--tl-v-b:17px;--tl-ic-b:19px;--tl-name-b:9px;--tl-desc-b:9px}
.pn-tiles>.stat{padding:var(--avd-pad) 0}
/* SIST I PANELEN: ingen luft nedåt. Rutradens padding lades annars till
   panelens egen innerkant, så botten blev dubbelt så djup som toppen — tydligast
   i energipanelen, där rutraden är sista elementet. Väderrutan slutar med
   remsan och drabbades inte, men regeln gäller båda så de följs åt. */
.pn-tiles:last-child>.stat{padding-bottom:0}
.pn-tiles>.stat+.stat{padding-left:var(--avd-pad)}
.pn-tiles>.stat:not(:last-child){padding-right:var(--avd-pad)}

/* Här stod tidigare att .st2 blir EN kolumn under 410px. Pixeln har 412px och
   klarade sig precis; en telefon med 360px – eller med förstorad skärmtext, som
   krymper CSS-bredden – hamnade under och fick rutorna staplade på höjden.
   Två kolumner ryms gott och väl även på 320px, så gränsen är borttagen. */

/* ===== Mobil: tightare, tydligare rutor och flikar ===== */
@media (max-width:600px){
  /* --- Topbar: allt får plats på en rad, inget kapas ---
     Hem visas som enbart husikon och live-läget som en enda prick. Det frigör
     precis den bredd som behövdes för att slippa både skroll och avklippning. */
  body:not(.kiosk) .statusbar{padding:10px 12px;align-items:center}
  body:not(.kiosk) .statusbar .en-top{flex-wrap:nowrap;overflow:visible;align-items:center;gap:6px;width:100%}
  body:not(.kiosk) .en-cmp{flex:0 1 auto;min-width:0;margin-left:0;padding:0 11px;font-size:12px;gap:5px;
    height:34px;box-sizing:border-box;align-items:center;justify-content:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body:not(.kiosk) .en-cmp-ic{width:15px;height:15px;flex:0 0 auto}
  /* Hem: bara huset. font-size:0 döljer texten, ikonen är en SVG och påverkas inte. */
  /* Huset ensamt: nollställ gapet så ikonen hamnar mitt i knappen */
  body:not(.kiosk) .en-hem{font-size:0;padding:0;gap:0;flex:0 0 auto;width:38px;height:34px;
    display:inline-flex;align-items:center;justify-content:center}
  body:not(.kiosk) .en-hem .en-cmp-ic{width:18px;height:18px;margin:0}
  /* Live-läget: bara en prick, grön när det är live och röd/gul annars */
  body:not(.kiosk) .statusbar .en-notis{margin-left:auto!important}
  body:not(.kiosk) .statusbar .en-status{margin-left:0!important;flex:0 0 auto;padding:0;border:0;background:none;
    width:24px;height:34px;display:inline-flex;align-items:center;justify-content:center}
  body:not(.kiosk) .statusbar .en-status>button,
  body:not(.kiosk) .statusbar .en-status>span:not(.dot){display:none!important}
  /* HÄR LÅG FELET. Den här regeln målade punkten grön oavsett klass, och den
     är mer specifik än .dot.cache — alltså kunde gult aldrig synas i mobilens
     topprad, hur rätt logiken än var. Grundfärgen är nu gul; grönt kräver
     klassen live, precis som överallt annars. */
  body:not(.kiosk) .statusbar .en-status .dot{width:13px;height:13px;border-radius:50%;margin:0;flex:0 0 auto;
    background:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 22%,transparent)}
  body:not(.kiosk) .statusbar .en-status .dot.live{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
  body:not(.kiosk) .statusbar .en-status .dot.stale{background:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 22%,transparent)}
  body:not(.kiosk) .statusbar .en-status .dot.dead{background:var(--hot);box-shadow:0 0 0 3px color-mix(in srgb,var(--hot) 22%,transparent)}

  /* Statusrutorna (Sol/Batteri/Elnät + luft/regn m.fl.): stående layout, inget kapat */
  /* Rubriken ligger på samma rad som ikonen, värdet under i hela textkolumnen */
  body:not(.kiosk) .stat{flex-direction:row;align-items:flex-start;gap:var(--tl-gap,8px);padding:12px 11px;text-align:left}
  /* BASMÅTT, inte fast storlek. Ett hårdkodat 19px här låg efter regeln med
     --tl-ic och skrev över den — reglaget för de sex rutorna ändrade variabeln
     men ingenting hände. Sätt basvärdet i stället, så multiplikatorn får verka. */
  body:not(.kiosk){--tl-ic-b:19px}
  body:not(.kiosk) .stat .stat-ic{flex:0 0 auto;margin-top:0}
  body:not(.kiosk) .stat-txt{flex:1 1 auto;min-width:0;gap:1px}
  /* Basmått, inte fast storlek — samma fälla som för ikonen och värdet. En
     hårdkodad px här ligger efter regeln med --tl-name och skriver över den. */
  body:not(.kiosk){--tl-name-b:10px}
  body:not(.kiosk) .stat .label{letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Basmått, inte fast storlek — se kommentaren vid --tl-ic-b ovan. */
  body:not(.kiosk){--tl-v-b:19px}
  body:not(.kiosk) .stat .v{white-space:nowrap;overflow:visible}
  body:not(.kiosk) .stat .v small{font-size:11px}
  body:not(.kiosk){--tl-desc-b:10.5px}
  body:not(.kiosk) .stat .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body:not(.kiosk) .stat-st{position:absolute;top:10px;right:10px;margin:0;width:15px;height:15px}



  /* --- Väderkortet: text ska radbryta, inte kapas --- */
  body:not(.kiosk) .wx2-now,body:not(.kiosk) .wx2-wind{min-width:0}
  body:not(.kiosk) .wx2-line{flex-wrap:wrap;row-gap:1px;align-items:baseline}
  body:not(.kiosk) .wx2-sub,body:not(.kiosk) .wx2-wl{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.25}
  body:not(.kiosk) .wx2-feels{flex-wrap:wrap;min-width:0}
  body:not(.kiosk) .wx2-ic{flex:0 0 auto}
  /* --- Knapparna: namnet får två rader i stället för att spilla ut --- */
  body:not(.kiosk) .ctl{min-width:0;overflow:hidden;padding:12px 6px;gap:6px;min-height:78px}
  /* Knappen krymper med hur många som delar raden – se --cs nedan. */
  body:not(.kiosk) .ctl-row .ctl{padding:calc(12px*var(--cs,1)) calc(6px*var(--cs,1));
    gap:calc(6px*var(--cs,1));min-height:calc(78px*var(--cs,1));border-radius:calc((var(--r) - 8px)*var(--cs,1))}
  body:not(.kiosk) .ctl-row .ctl-ic{width:calc(24px*var(--cs,1));height:calc(24px*var(--cs,1))}
  body:not(.kiosk) .ctl-row .ctl-l{font-size:calc(11px*var(--cs,1))}
  body:not(.kiosk) .ctl-l{width:100%;min-width:0;font-size:11px;line-height:1.2;white-space:normal;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* --- Startsidan: text ska aldrig spilla ut ur sin ruta --- */
  /* Effekt, självförsörjning och dom ryms på en rad tack vare den korta domtexten */
  body:not(.kiosk) .en-hero{flex-wrap:nowrap;gap:8px;align-items:center}
  body:not(.kiosk) .en-hero-main{flex:1 1 auto;min-width:0}
  body:not(.kiosk) .en-spot{margin-left:auto;flex:0 1 auto;min-width:0;gap:6px;align-items:center}
  body:not(.kiosk) .en-spot .verdict{min-width:0;white-space:nowrap;font-size:11.5px;padding:6px 11px;height:30px}
  /* Overkanterna i linje med vardet: reglerna ligger sist i filen,
     utanfor alla mediafragor. Se kommentaren dar. */
  body:not(.kiosk) .en-self{font-size:11px;padding:6px 9px;white-space:nowrap}
  body:not(.kiosk) .en-kw{font-size:24px}
  body:not(.kiosk) .en-self{flex:0 0 auto}
  body:not(.kiosk) .en-kw{font-size:26px}
  /* Generellt skydd: flexbarn med text måste få krympa */
  body:not(.kiosk) .panel .en-mix-leg{gap:10px}
  body:not(.kiosk) .ins-hero-txt,body:not(.kiosk) .wxi-t,body:not(.kiosk) .wxm-cap{overflow-wrap:anywhere}
  /* Energi-chipsen (Sol/Batteri/Nät i mixen) likaså stående och luftiga */
  body:not(.kiosk) .en-chip{flex-direction:column!important;align-items:flex-start!important;gap:5px;padding:12px 11px}
  body:not(.kiosk) .en-chip-v{font-size:19px}
  body:not(.kiosk) .en-chip-l{font-size:10px;letter-spacing:.05em}
  body:not(.kiosk) .en-chip-s{font-size:10.5px}
}
@media (max-width:400px){
  body:not(.kiosk){--tl-v-b:18px}
}
