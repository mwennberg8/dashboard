.rl-rad{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.rl-rad:last-child{border-bottom:0}
.rl-kl{flex:0 0 auto;font-weight:800;color:var(--dim);min-width:40px}
.rl-txt{flex:1 1 auto;min-width:0;font-weight:700}
.rl-txt small{display:block;font-size:11.5px;font-weight:600;color:var(--dim);margin-top:1px}
.rl-ok{color:var(--ok)}
.regelrad.visa{display:flex;align-items:center;gap:10px;margin:8px 0 2px;padding:8px 8px 8px 11px;border-radius:14px;
  background:rgba(235,203,139,.13);border:1px solid rgba(235,203,139,.45)}
.regelrad .rr-ic{flex:0 0 auto;width:20px;height:20px;color:var(--gold);display:flex}
.regelrad .rr-ic svg{width:100%;height:100%}
.regelrad .rr-t{flex:1 1 auto;min-width:0;font-size:13px;line-height:1.3;font-weight:800;color:var(--ink)}
/* Två rader, var och en på en rad med … — rubriken är kort nog att alltid synas. */
.regelrad .rr-t>span,.regelrad .rr-t small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.regelrad .rr-t small{font-size:11px;font-weight:650;color:var(--dim)}
.regelrad .rr-b{flex:0 0 auto;display:flex;gap:6px}
.regelrad button{height:30px;padding:0 12px;border-radius:999px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
.regelrad .rr-ja{background:var(--gold);color:#2e3440;border:1px solid var(--gold)}
.regelrad .rr-nej{background:none;color:var(--dim);border:1px solid var(--line)}
/* Telefonen: Ignorera blir ett ✕ — annars får meningen bara ~90 px på en
   360 px-skärm och rubriken klipps. */
.regelrad .rr-kort{display:none}
body.mobile .regelrad .rr-lang{display:none}
body.mobile .regelrad .rr-kort{display:inline}
body.mobile .regelrad .rr-nej{width:30px;padding:0;font-size:13px}
body.kiosk .regelrad .rr-t{font-size:13.5px}
body.kiosk .regelrad button{height:34px;font-size:13px}
/* ⋯ i belysningsrutans nedre hörn: Auto, Skivspelare och resten. Nere i
   stället för uppe, så rubriken "BELYSNING" får plats på en smal telefon;
   lägesraden slutar före knappen. */
body.panu-pa .fl-tiles>.stat.har-mer .stat-sub,body.panu-pa #stats-energy>.stat.har-mer .stat-sub{padding-right:calc(30px*var(--kk))!important}
.tile-mer{display:none}
/* v713: lägg till knapp i belysningspopupen */
.hem-ny{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.hem-ny span{font-size:11.5px;color:var(--faint)}
body.panu-pa .fl-tiles>.stat .tile-mer,body.panu-pa #stats-energy>.stat .tile-mer{display:flex;position:absolute;bottom:calc(7px*var(--kk));right:calc(7px*var(--kk));
  width:calc(26px*var(--kk));height:calc(22px*var(--kk));align-items:center;justify-content:center;border-radius:999px;
  border:1px solid var(--line);background:var(--panel-a);color:var(--dim);font:inherit;font-size:calc(14px*var(--kk));
  font-weight:800;line-height:1;padding:0;cursor:pointer;grid-column:auto}
/* Kortet är ett rutnät: ikon och rubrik på första raden, värdet och lägesraden
   över hela bredden under. .stat-txt får display:contents så dess rader blir
   rutnätets egna — då linjerar ikonen med rubriken och värdet med kortets
   vänsterkant, utan absoluta positioner som inte följer med skalan. */
body.panu-pa .fl-tiles>.stat,body.panu-pa #stats-energy>.stat{display:grid!important;grid-template-columns:calc(16px*var(--kk)) minmax(0,1fr);
  column-gap:calc(6px*var(--kk));row-gap:0;align-content:start;justify-items:stretch;align-items:center!important;
  position:relative;min-width:0;min-height:0;height:auto!important;width:auto!important;margin:0!important;
  background:var(--panel-b)!important;border:1px solid var(--line)!important;border-radius:calc(14px*var(--kk))!important;
  padding:calc(10px*var(--kk))!important;box-shadow:none!important;text-align:left!important}
body.panu-pa .fl-tiles>.stat::before,body.panu-pa .fl-tiles>.stat::after,body.panu-pa #stats-energy>.stat::before,body.panu-pa #stats-energy>.stat::after{display:none!important;content:none!important}
body.panu-pa .fl-tiles>.stat>*,body.panu-pa #stats-energy>.stat>*{grid-column:1/-1}
body.panu-pa .fl-tiles>.stat .stat-ic,body.panu-pa #stats-energy>.stat .stat-ic{position:relative!important;grid-column:1;grid-row:1;
  width:calc(16px*var(--kk))!important;height:calc(16px*var(--kk))!important;margin:0!important;align-self:center!important;
  display:flex;align-items:center;justify-content:center;transform:none}
body.panu-pa .fl-tiles>.stat .stat-ic svg,body.panu-pa #stats-energy>.stat .stat-ic svg{width:100%;height:100%}
/* Bilens markering (inkopplad, laddar) hör till ikonen — nere till höger om
   den, i ikonens skala. Förut hamnade den i kortets nedre hörn. */
body.panu-pa .fl-tiles>.stat .stat-ic .ik-mark,body.panu-pa #stats-energy>.stat .stat-ic .ik-mark{right:calc(-6px*var(--kk));bottom:calc(-5px*var(--kk));
  width:calc(11px*var(--kk));height:calc(11px*var(--kk))}
body.panu-pa .fl-tiles>.stat .stat-txt,body.panu-pa #stats-energy>.stat .stat-txt{display:contents!important}
body.panu-pa .fl-tiles>.stat .label,body.panu-pa #stats-energy>.stat .label{grid-column:2;grid-row:1;padding:0!important;font-size:calc(10px*var(--kk))!important;font-weight:800!important;
  letter-spacing:.07em;text-transform:uppercase;color:var(--faint)!important;line-height:calc(16px*var(--kk))!important;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0!important;text-align:left!important}
body.panu-pa .fl-tiles>.stat .v,body.panu-pa #stats-energy>.stat .v{grid-column:1/-1;grid-row:2;font-size:calc(22px*var(--kk))!important;font-weight:800!important;line-height:1.1!important;
  margin:calc(6px*var(--kk)) 0 0!important;white-space:nowrap;overflow:hidden;text-align:left!important}
body.panu-pa .fl-tiles>.stat .v small,body.panu-pa #stats-energy>.stat .v small{font-size:calc(12px*var(--kk))!important;font-weight:700;color:var(--dim);margin-left:2px}
body.panu-pa .fl-tiles>.stat .stat-sub,body.panu-pa #stats-energy>.stat .stat-sub{grid-column:1/-1;grid-row:3;font-size:calc(11.5px*var(--kk))!important;line-height:1.3;color:var(--dim)!important;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:calc(3px*var(--kk)) 0 0!important;text-align:left!important}
body.panu-pa .fl-tiles>.stat .meta,body.panu-pa #stats-energy>.stat .meta{display:none!important}
/* (v693: ingen grön ton för aktiva rutor — glöden är borttagen.) */
/* Väggplattan: samma kort, större skala. Raderna fyller höjden, innehållet
   centreras i höjdled. */
/* --kk 1,1: avsnittet har redan väggplattans grundzoom (120 %), så korten blir
   ~26 % större än på telefonen (1,05 × 1,2). 1,3 och 1,1 gick inte in — korten svämmade ut under
   avsnittet (uppmätt i Chromium 800×1280). Raderna får krympa (minmax 0) och
   korten klipper hellre än att tränga ut rapporten. */
body.kiosk.panu-pa .fl-tiles{grid-auto-rows:minmax(0,1fr)!important}
body.kiosk.panu-pa .fl-tiles>.stat,body.kiosk.panu-pa #stats-energy>.stat{overflow:hidden}
body.kiosk.panu-pa .fl-tiles>.stat,body.kiosk.panu-pa #stats-energy>.stat{align-content:center}
/* v733: SOL NU, BATTERI OCH ELNÄT SOM KORT – samma stil som de sex rutorna
   (reglerna ovan gäller båda). Tre lika breda kort med samma mellanrum, och
   kanterna i linje med korten nedanför: panelens egen kantluft dras av så att
   kortet hamnar 8 px (× --kk) från panelkanten, precis som i rutavsnittet.
   Raderna är så höga som innehållet – de fyller inte höjden som de sex gör på
   väggplattan. --kk-z sätts av applySecScale: rutavsnittets zoom delat med
   energipanelens, så att korten blir lika stora på skärmen trots att
   avsnitten har olika grundzoom (väggplattan 1,2 mot 1,25). */
body.panu-pa #stats-energy{--kk:var(--kk-z,1);display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;
  grid-auto-rows:auto!important;gap:calc(8px*var(--kk))!important;column-gap:calc(8px*var(--kk))!important;row-gap:calc(8px*var(--kk))!important;
  padding:0!important;margin:calc(10px*var(--kk)) calc(8px*var(--kk) - clamp(16px,2vw,21px)) 0!important}
body.kiosk.panu-pa #stats-energy{--kk:calc(1.05*var(--kk-z,1));margin:calc(10px*var(--kk)) calc(8px*var(--kk) - 13px) 0!important}
/* Avdelarna runt korten behövs inte – kortens kanter avgränsar redan. Den
   undre låg dessutom precis på kortens nederkant. */
body.panu-pa #en-del,body.panu-pa #stats-energy~#sp-del{display:none!important}
/* Bokningen (lås + tid) står sist på rubrikraden i en egen kolumn. Kolumnen
   måste vara EXPLICIT – annars räknas "1/-1" bara över ikon och rubrik, och
   värdet och underraden klipptes vid brickans vänsterkant ("−…"). */
body.panu-pa .fl-tiles>.stat.har-bokrad,body.panu-pa #stats-energy>.stat.har-bokrad{
  grid-template-columns:calc(16px*var(--kk)) minmax(0,1fr) auto}
/* Telefonen: kortet är ~100 px brett – rubrik, lås och klockslag får inte plats
   (rubriken blev "BA…"). Bara låset där; klockslaget finns i rutans popup och
   i hovringstexten. */
body.mobile:not(.kiosk).panu-pa .fl-tiles>.stat .stat-bok .bok-kort,
body.mobile:not(.kiosk).panu-pa #stats-energy>.stat .stat-bok .bok-kort{display:none}
body.kiosk.panu-pa .panu-c{height:34px;font-size:13.5px;padding:0 14px}
/* v727: PÅ NU-RADEN TRYCKS INTE IHOP. Avsnittet är en flexkolumn med fast höjd
   och raden hade min-height:0 och standardkrympning – när utrymmet tröt (två
   rader brickor, större mått) krympte raden och brickorna ritades UNDER
   rutorna. Nu behåller raden sin höjd; det är rutorna som får dela på resten,
   och räcker inte det skalar fitScreen ned hela sidan. */
body.kiosk.panu-pa .tileswrap>.panu{flex:0 0 auto}
.hem-pop{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.hem-pop .ctl-row{display:flex;gap:8px}
/* v719: knapprader i popuper går kant i kant med raderna och graferna, utan
   knappavsnittets innerkant. Id-väljaren slår body.mobile:not(.kiosk) .controls. */
#dlg-body .controls.hem-pop{padding:0;margin:12px 0 4px;gap:8px;overflow:visible}
#dlg-body .controls.hem-pop:first-child{margin-top:4px}
#dlg-body .hem-pop .ctl-row{gap:8px}
/* FLIKAR NERE (v675, bara mobilläget). Hem, Insikter, Jämför och Väder flyttar
   från toppraden till en rad längst ned, inom räckhåll för tummen. Uppe blir
   klockan, inställningarna, växlingen och statusen kvar. Under popuper (50)
   och helskärmarna (60, 2000), så de täcker raden. */
body.mobile .flikrad{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;
  background:var(--panel-a);border-top:1px solid var(--line);
  padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -8px 20px -14px rgba(0,0,0,.35)}
.flik{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:50px;border:0;background:none;color:var(--faint);font:inherit;font-size:10.5px;font-weight:700;
  cursor:pointer;padding:2px 0;-webkit-tap-highlight-color:transparent}
.flik .ic{width:22px;height:22px;margin-bottom:3px}
.flik.akt{color:var(--blue)}
body.mobile .flikrad{transition:transform .22s ease}
body.mobile .flikrad.dold{transform:translateY(110%)}
/* Toppraden: bara i historikläget på mobilen. */
body.topp-flyttad:not(.histmod) .statusbar{display:none!important}
/* Brickgruppen uppe till höger i energirutan: Självförsörjt, Elpris och — i
   mobilläget — notisklockan och liveprickan. En grupp, så de bryts aldrig isär. */
.en-hoger{margin-left:auto;display:flex;align-items:center;gap:6px;flex:0 1 auto;min-width:0}
.en-hoger>.en-spot{margin-left:0}
.en-hogra{display:none}
body.topp-flyttad .en-hogra{display:flex;align-items:center;gap:6px;flex:0 0 auto}
/* Alternativ A: rad 1 talet + klocka/prick, rad 2 de två brickorna lika breda. */
/* v684: väljarna har body.mobile/body.kiosk framför sig igen. I v683 tog jag
   bort body.mobile för att reglerna skulle gälla på väggplattan också — då
   vann mobilens äldre bricksregler (body:not(.kiosk) .en-self m.fl.) och
   brickorna blev smala och högerställda med text utanför kanten. */
body.mobile .en-hero-a,body.kiosk .en-hero-a{flex-wrap:wrap;align-items:center}
body.mobile .en-hero-a>.en-hogra,body.kiosk .en-hero-a>.en-hogra{margin-left:auto;align-self:flex-start}
body.mobile .en-hero-a>.en-spot,body.kiosk .en-hero-a>.en-spot{flex:1 0 100%;margin-left:0;display:flex;gap:0;min-width:0}
body.mobile .en-hero-a>.en-spot>.verdict,body.kiosk .en-hero-a>.en-spot>.verdict{margin-left:8px}
body.mobile .en-hero-a>.en-spot>.en-self,body.mobile .en-hero-a>.en-spot>.verdict,
body.kiosk .en-hero-a>.en-spot>.en-self,body.kiosk .en-hero-a>.en-spot>.verdict{flex:1 1 0;min-width:0;justify-content:center;text-align:center;
  height:32px;box-sizing:border-box;padding:0 10px;font-size:12px;overflow:hidden;white-space:nowrap}
/* KLOCKAN I SAMMA STIL SOM BRICKORNA: samma höjd, rundning, kantlinje och
   textstorlek som .en-self och .verdict i mobilläget. Färgen är klockans egen
   (blå, guld med olästa, blå fylld i historikläget). */
body.topp-flyttad .en-hogra .en-notis{height:30px;box-sizing:border-box;padding:6px 10px;border-radius:999px;
  font-size:11.5px;line-height:1;gap:5px;margin:0;flex:0 0 auto;min-width:0}
body.topp-flyttad .en-hogra .en-notis .en-cmp-ic{width:14px;height:14px}
/* v734: VÄDRET I RUBRIKEN – bricka i samma höjd och form som notisklockan. */
.en-wx{display:none}
body.wx-rubrik .en-wxrad .en-wx{display:inline-flex;align-items:center;gap:5px;height:30px;box-sizing:border-box;
  padding:0 10px 0 8px;border-radius:999px;margin:0;flex:0 0 auto;min-width:0;white-space:nowrap;cursor:pointer;
  font:inherit;font-size:15px;font-weight:800;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.en-wx .en-wx-ic{display:inline-flex;width:18px;height:18px;color:var(--gold);flex:0 0 auto}
.en-wx .en-wx-ic svg{width:100%;height:100%}
.en-wx .en-wx-v{font-size:11px;font-weight:700;color:var(--dim);margin-left:1px}
body.kiosk.wx-rubrik .en-wxrad .en-wx{height:32px;font-size:16px}
body.wx-rubrik #view-flode>[data-sec="weather"]{display:none!important}
.en-wxrad{display:none}
body.wx-rubrik .en-wxrad{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto}
body.wx-rubrik .en-wxrad .en-wx{display:inline-flex}
/* v736: rumsrutorna – varningstext i rutan och varningsrader i popupen. */
.stat-sub .zk-varn{color:var(--warm);font-weight:800}
.stat-sub .zk-larm{color:var(--hot);font-weight:850}
.zk-varnlista{display:flex;flex-direction:column;gap:6px;margin:2px 0 10px}
.zk-varnrad{display:flex;gap:8px;align-items:center;padding:8px 11px;border-radius:12px;font-size:13px;font-weight:800;line-height:1.3;
  color:var(--ink);background:color-mix(in srgb,var(--warm) 13%,transparent);border:1px solid color-mix(in srgb,var(--warm) 40%,transparent)}
.zk-varnrad.larm{background:color-mix(in srgb,var(--hot) 13%,transparent);border-color:color-mix(in srgb,var(--hot) 45%,transparent)}
.zk-varnrad .ic{width:18px;height:18px;flex:0 0 auto;color:var(--warm)}
.zk-varnrad.larm .ic{color:var(--hot)}
/* v735: soluppgång och solnedgång i samma bricka. */
.en-sol{gap:8px!important}
.en-sol .sol-r{display:inline-flex;align-items:center;gap:4px}
.en-sol .en-wx-t{font-size:14px}
.en-sol .en-wx-ic{width:16px;height:16px}
.en-sol .sol-r.ned .en-wx-ic{color:var(--violet,#b48ead)}
/* Stegen när raden blir trång (wxRubrikPassa). */
.en-wxrad.st1 .en-sol{flex-direction:column;align-items:flex-start;justify-content:center;gap:1px!important;padding:0 8px 0 7px}
.en-wxrad.st1 .en-sol .en-wx-t{font-size:11px}
.en-wxrad.st1 .en-sol .en-wx-ic{width:11px;height:11px}
.en-wxrad.st1 .en-sol .sol-r{gap:3px;line-height:1}
.en-wxrad.st2 .en-wx-v{display:none}
.en-wxrad.st3 #en-wx .en-wx-ic{display:none}
.en-hogra .en-status{flex:0 0 auto;padding:0;border:0;background:none;width:18px;height:30px;margin:0;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.en-hogra .en-status>button,.en-hogra .en-status>span:not(.dot){display:none!important}
.en-hogra .en-status .dot{width:12px;height:12px;border-radius:50%;margin:0;flex:0 0 auto;
  background:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 22%,transparent)}
.en-hogra .en-status .dot.live{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.en-hogra .en-status .dot.dead{background:var(--hot);box-shadow:0 0 0 3px color-mix(in srgb,var(--hot) 22%,transparent)}
body.mobile{padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
body.mobile .en-top .en-nav{display:none!important}
/* ===== PLATTAN (v680): samma startsida som mobilen, anpassad för den större
   skärmen. Flikraden ligger sist i den låsta ramen (inte fast över innehållet),
   lite större mål. Klockan och pricken i brickgruppen på samma rad som talet,
   brickorna i plattans storlek (32 px). */
body:not(.mobile) .flikrad{display:flex;flex:0 0 auto;margin-top:var(--pg-gap,7px);border-radius:20px;
  position:relative;z-index:6;
  background:linear-gradient(180deg,var(--panel-a),var(--panel-b));border:1px solid var(--line);padding:5px 8px}
body:not(.mobile) .flik{min-height:56px;font-size:12.5px}
body:not(.mobile) .flik .ic{width:24px;height:24px}
body:not(.mobile).topp-flyttad .en-hogra .en-notis{height:32px;padding:6px 12px;font-size:12.5px}
body:not(.mobile) .en-hogra .en-status{width:22px;height:32px}
body:not(.mobile) .en-hogra .en-status .dot{width:14px;height:14px}
/* Kiosken: vyerna är flex-kolumner i ramen — Jämför och Insikter skrollar
   inne i sig själva som förut, flikraden ligger kvar under. */
body.kiosk.cmp-open .flikrad{position:sticky;bottom:0;z-index:6}
/* Plattan i liggande läge (ingen kiosk, sidan skrollar): flikraden fastnar i
   underkant när man skrollar, i stället för att hamna efter rapporten. */
body:not(.mobile):not(.kiosk) .flikrad{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:40;
  box-shadow:0 8px 24px -10px rgba(0,0,0,.35)}
/* Prickens meny på plattan (hålltryck när husvakten är på). */
#prick-meny{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(20,24,30,.35)}
#prick-meny .pm-ruta{background:var(--panel-a);border:1px solid var(--line);border-radius:20px;padding:14px;min-width:240px;
  box-shadow:0 12px 40px rgba(0,0,0,.3)}
#prick-meny .pm-ruta button{display:block;width:100%;min-height:52px;margin:0 0 8px;border-radius:14px;border:1px solid var(--line);
  background:var(--inset);color:var(--ink);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
#prick-meny .pm-ruta button:last-child{margin-bottom:0}
body.mobile #rum-toast,body.mobile .sync-note{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
.dlg-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.dlg-back.open{display:flex}
.dlg{background:linear-gradient(180deg,var(--panel-a),var(--panel-b));border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 60px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);width:100%;padding:20px 20px 10px;position:relative;animation:dlgin .2s ease;
  min-width:0;overflow-x:hidden}
@keyframes dlgin{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.dlg-x{position:absolute;top:10px;right:10px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--inset);color:var(--ink);opacity:.92;cursor:pointer;padding:0;z-index:6;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.dlg-x:hover{opacity:1;background:var(--panel-a,var(--card))}
.dlg-x:active{transform:scale(.94)}
.dlg-x:active{opacity:.9}
.dlg.nohead .dlg-body{padding-top:14px}
.dlg.nohead .dlg-h{display:none}
.dlg-x .ic{width:18px;height:18px}
.dlg-h{display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:740;margin-bottom:15px}
.dlg-ic{width:24px;height:24px}.dlg-ic .ic{width:100%;height:100%}
.dlg-body .drow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.ww-head{display:flex;align-items:stretch;gap:0;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.ww-box{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:10px;padding:2px}
.ww-box:last-child{padding-left:14px}
.ww-div{flex:0 0 auto;width:1px;align-self:stretch;background:var(--line);margin:2px 6px}
.ww-bt{min-width:0}
.ww-ic{width:38px;height:38px;flex:0 0 auto;color:var(--gold)}.ww-ic .ic{width:100%;height:100%}
.ww-box .wx-arrow{flex:0 0 auto}
.ww-line{display:flex;align-items:baseline;min-width:0}
.ww-big{font-size:22px;font-weight:770;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto}
.ww-big small{font-size:.46em;font-weight:600;color:var(--dim);margin-left:.14em}
.ww-beside,.ww-dir{margin-left:7px;white-space:nowrap;font-size:12px;line-height:1;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
.ww-beside{color:var(--dim);font-weight:600}.ww-beside b{color:var(--ink);font-weight:730}
.ww-dir{color:var(--ink);font-weight:730}
.ww-sub{font-size:11px;color:var(--dim);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ww-cols{display:flex;flex-wrap:wrap;gap:0 22px}
.ww-col{flex:1 1 240px;min-width:0}
.ww-h{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);margin:18px 0 9px;text-align:center}
.ww-fcbtn{margin-top:14px}
.drow-t{cursor:pointer}
.di-q{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1px solid var(--line);color:var(--faint);font-size:9px;font-weight:800;font-style:normal;margin-left:5px;vertical-align:middle}
.drow-info{display:none;font-size:11.5px;color:var(--dim);line-height:1.42;padding:2px 0 9px}
.dlg-body .enh{border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-bottom:7px;
  background:var(--inset)}
.dlg-body .enh.jag{border-color:rgba(235,203,139,.45)}
.dlg-body .enh-h{display:flex;align-items:center;gap:8px;font-size:13px}
.dlg-body .enh-du{font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  color:var(--gold);border:1px solid rgba(235,203,139,.45);border-radius:7px;padding:1px 6px}
.dlg-body .enh-t{margin-left:auto;font-size:11px;color:var(--faint);font-weight:650}
.dlg-body .enh-m{font-size:11px;color:var(--faint);margin-top:3px}
.dlg-body .enh-id{font:10.5px/1.4 ui-monospace,Menlo,monospace;color:var(--dim);margin-top:3px;
  word-break:break-all}
.dlg-body .enh-in{width:100%;box-sizing:border-box;margin-top:7px;background:var(--inset);
  border:1px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;font-size:13px;padding:9px 11px}
.dlg-body .prog-exp{width:100%;height:150px;box-sizing:border-box;margin-top:6px;
  background:var(--inset);border:1px solid var(--line);border-radius:10px;color:var(--dim);
  font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;padding:8px;resize:vertical}
.dlg-body .fas-r{display:flex;align-items:center;gap:9px;padding:5px 0}
.dlg-body .fas-n{font-size:11px;font-weight:800;color:var(--faint);width:20px;flex:0 0 auto}
.dlg-body .fas-b{flex:1 1 auto;height:7px;border-radius:4px;background:var(--inset);
  border:1px solid var(--line);overflow:hidden;box-sizing:border-box}
.dlg-body .fas-b i{display:block;height:100%;border-radius:3px;transition:width .5s ease}
.dlg-body .fas-v{font-size:12px;font-weight:750;font-variant-numeric:tabular-nums;
  width:52px;text-align:right;flex:0 0 auto}
.dlg-body .dsec{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);padding:13px 0 3px;border-bottom:1px solid var(--line)}
/* v759: info-texten i en avsnittsrubrik ärvde rubrikens versaler, spärrning och
   fetstil – grafernas förklaringar stod i versaler när man öppnade dem. */
.dlg-body .dsec .drow-info{text-transform:none;letter-spacing:0;font-weight:500;padding:6px 0 4px}
.dlg-body .dsec-x{text-transform:none;font-style:normal;letter-spacing:0;opacity:.7;font-weight:700}
.eff-top{display:flex;align-items:center;gap:10px;margin:10px 0 8px}
.eff-sel{flex:0 0 auto;width:auto;min-width:96px}
.eff-ar{flex:1 1 auto;text-align:right;min-width:0}
.eff-arv{display:block;font-size:19px;font-weight:850;line-height:1.15}
.eff-arl{display:block;font-size:10.5px;color:var(--faint);font-weight:650}
.eff-l{display:flex;flex-direction:column}
.eff-r{display:flex;align-items:center;gap:8px;padding:5px 0;
  border-bottom:1px solid var(--line)}
.eff-r:last-child{border-bottom:0}
.eff-m{flex:0 0 68px;font-size:12px;font-weight:700;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.eff-b{flex:1 1 auto;height:7px;background:var(--inset);border-radius:99px;overflow:hidden;min-width:24px}
.eff-r.inm .eff-b i{background:var(--faint)}
.eff-i{font-style:normal;color:var(--faint);margin-left:3px;font-weight:800}
.eff-b i{display:block;height:100%;background:var(--blue);border-radius:99px}
.eff-w{flex:0 0 auto;font-size:13px;font-weight:800;white-space:nowrap;min-width:56px;text-align:right}
.eff-k{flex:0 0 auto;font-size:10.5px;color:var(--faint);white-space:nowrap;min-width:56px;text-align:right}
/* Ärver en-cmp: samma pillform, kantfärg och storlek som Insikter, Jämför och
   live-indikatorn. Bara innehållet och tillståndsfärgen skiljer. */
.en-notis{padding:6px 10px;gap:5px}
.en-notis .en-cmp-ic{width:15px;height:15px}
/* Med olästa byter den till guld — samma sätt som resten av dashboarden
   markerar "något att göra". */
/* Fast rgba, inte color-mix — grannknapparna (.en-cmp, .en-status-btn) använder
   samma mönster med rgba(129,161,193,…), och det här är samma sak i guld.
   Dessutom tolkas color-mix inte av alla verktyg, vilket gör regeln svår att
   kontrollera. */
.en-notis.har{border-color:rgba(235,203,139,.42);
  background:rgba(235,203,139,.16);color:var(--gold)}
.en-notis-n{font-size:11px;font-weight:850;line-height:1;font-variant-numeric:tabular-nums}
/* Pulsen drar blicken en gång i minuten i stället för att blinka — en ikon som
   blinkar oavbrutet blir en sak man slutar se. */
.en-notis.har.puls{animation:notispuls 4s ease-in-out infinite}
@keyframes notispuls{0%,88%,100%{box-shadow:0 0 0 0 transparent}
  92%{box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 26%,transparent)}}
/* Klockan i tillbaka-läge: samma pill, men blå som de andra knapparna så att
   den läses som navigering och inte som en notis. */
.en-notis.bak{color:var(--blue);border-color:rgba(129,161,193,.28);
  background:rgba(129,161,193,.16)}
.kr-c.kan{cursor:pointer}
.kr-c.kan:active{background:var(--line)}
.krpop-bak{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;padding:20px}
.krpop{position:relative;background:var(--panel-a);border:1px solid var(--line);
  border-radius:16px;padding:18px 18px 16px;max-width:360px;width:100%;
  box-shadow:0 18px 50px rgba(0,0,0,.4);max-height:86vh;overflow:auto}
/* Bredare när innehållet är ett rutnät — två kolumner behöver plats. */
.krpop-bred{max-width:440px}
/* TVÅ kolumner alltid. auto-fill med minmax gav en enda kolumn på telefonen —
   popupen är smalare än sidan, och 118 px plus gap fick inte plats två gånger.
   Ett fast tvåspaltigt rutnät är dessutom lugnare att läsa. */
.krpop .kr-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.krpop .kr-c{height:auto;min-height:54px;padding:7px 9px}
.krpop .kr-v{font-size:14px}
.krpop .kr-l{font-size:8.5px}
.krpop .kr-x{font-size:9.5px}
/* SAMMA KRYSS SOM I ALLA ANDRA POPUPAR. Det här var en naken textteckenknapp i
   faint-grått medan .dlg-x är en rund, inramad knapp med gränssnittets egen
   ikon — och batteriet-tomt-rutan är en krpop, så den stack ut mot resten.
   Reglerna är kopierade ur .dlg-x i stället för att delas via en gemensam
   selektor: krpop och dlg ligger långt ifrån varandra i filen, och en delad
   regel hade varit lätt att råka ändra för bara den ena. */
.krpop-x{position:absolute;top:10px;right:10px;width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);background:var(--inset);color:var(--ink);
  opacity:.92;cursor:pointer;padding:0;z-index:6;border-radius:999px;
  box-shadow:0 2px 8px rgba(0,0,0,.25);line-height:1}
.krpop-x .ic{width:18px;height:18px}
.krpop-x:hover{opacity:1;background:var(--panel-a,var(--card))}
.krpop-x:active{transform:scale(.94);opacity:.9}
.krpop-h{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:800;
  color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.krpop-i{width:16px;height:16px;color:var(--gold);display:inline-flex}
.krpop-i .ic{width:100%;height:100%}
.krpop-v{font-size:27px;font-weight:850;margin:7px 0 12px;line-height:1.1}
.krpop-l{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.krpop-r{display:flex;justify-content:space-between;gap:12px;padding:6px 0;
  font-size:12.5px;color:var(--dim);border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.krpop-r:last-child{border-bottom:0}
.krpop-r b{color:var(--ink);font-weight:800;text-align:right}
/* Dagsnotisens text. Korta rader, en iakttagelse per rad. */
.dn-t{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.dn-r{position:relative;margin:0;padding:9px 0 9px 30px;font-size:14px;line-height:1.55;
  color:var(--ink);font-weight:600}
/* Hårfin linje mellan raderna, inte runt dem. En ram gör det till en tabell. */
.dn-r+.dn-r{border-top:1px solid rgba(255,255,255,.05)}
/* Reservmarkeringen: en asterisk i marginalen, ingen text som förklarar sig. */
.dn-res{padding:6px 0 0 30px;font-size:13px;color:var(--faint);line-height:1}
/* Första raden bär tonen: något större, resten linjerar under. */
.dn-r.forst{font-size:15px;font-weight:700;padding-top:2px}
.dn-i{position:absolute;left:0;top:9px;width:22px;font-size:15px;line-height:1.4;
  text-align:left;opacity:.95}
.dn-r.forst .dn-i{top:2px}
.dn-x{display:block}
/* Talen får tyngd, texten runt dem lugn — det är siffrorna man letar efter. */
.dn-x .kr-n2{font-weight:800;color:var(--ink)}
.dn-r:not(.forst){color:var(--dim)}
.mgraf{width:100%;height:auto;margin-top:12px;display:block}
.mg-ax{font-size:9px;fill:var(--faint);font-weight:600}
/* Prognosgrafens egna etiketter. Grafen är 1000 enheter bred mot skärmens
   bredd, så 9 px i viewBox blir under 4 px på en telefon — oläsligt. */
.chart .mg-ax{font-size:34px;fill:var(--dim);font-weight:700}
.mgraf-l{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);margin-top:2px}
.krpop-bred{max-width:440px}
.krpop-grid{margin-top:12px}
/* Svaret på frågan, i klartext ovanför rutorna. */
.krpop-svar{margin:9px 0 2px;font-size:14px;font-weight:750;line-height:1.45}
.krpop-svar.ja{color:var(--gold)}
.krpop-svar.nej{color:var(--ok)}
.krpop-t{margin-top:11px;padding-top:10px;border-top:1px solid var(--line);
  font-size:11.5px;line-height:1.55;color:var(--faint)}
/* Underrubrik inne i artikeln — samma familj som rubriken, mindre. */
.kr-h2{font-size:13px;font-weight:850;letter-spacing:-.005em;margin:2px 0 9px;
  color:var(--ink)}
/* Stycke som inleds med en emoji. Samma grepp som höjdpunkterna: tecknet hänger
   i vänsterkanten och texten linjerar med resten av artikeln. */
.kr-emo{position:relative;padding-left:27px}
.kr-emi{position:absolute;left:0;top:1px;width:19px;font-size:14px;
  color:var(--gold);display:inline-flex}
.kr-emi .ic{width:16px;height:16px}
.kul{margin-top:16px;padding-top:13px;border-top:1px solid var(--line)}
.kul-h{font-size:10px;font-weight:800;color:var(--faint);text-transform:uppercase;
  letter-spacing:.07em;margin-bottom:7px}
.kul-r{display:flex;align-items:flex-start;gap:9px;padding:5px 0;font-size:12.5px;
  line-height:1.5;color:var(--dim)}
.kul-i{flex:0 0 17px;height:17px;color:var(--gold);display:inline-flex;margin-top:1px}
.kul-i .ic{width:100%;height:100%}
.kul-r b{color:var(--ink);font-weight:800}
.not-diag{margin:9px 0 2px;padding:9px 11px;border-radius:11px;font-size:12px;line-height:1.5;
  background:rgba(129,161,193,.10);color:var(--dim);border-left:3px solid var(--blue)}
.not-diag.varning{background:rgba(235,203,139,.10);border-left-color:var(--gold);color:var(--ink)}
.not-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:10px 0 4px;font-size:12px;font-weight:750;color:var(--gold)}
.not-l{display:flex;flex-direction:column}
.not-r{border-bottom:1px solid var(--line);touch-action:pan-y;will-change:transform}
.not-r:last-child{border-bottom:0}
.not-in{display:flex;align-items:center;gap:11px;padding:11px 2px;cursor:pointer}
.not-ic{flex:0 0 auto;width:19px;height:19px;color:var(--faint);display:inline-flex}
.not-ic .ic{width:100%;height:100%}
/* Oläst syns på FYRA sätt, inte bara på en prick: guldton i bakgrunden, en
   guldstapel i vänsterkanten, guldfärgad ikon och tjockare rubrik. En 8 px
   prick längst till höger räckte inte — den försvann bland chevronerna, och på
   en lång lista var skillnaden mellan fet 700 och 850 knappt synlig. */
.not-r.ny{background:rgba(235,203,139,.09)}
.not-r.ny .not-in{border-left:3px solid var(--gold);padding-left:9px;margin-left:-2px}
.not-r:not(.ny) .not-in{border-left:3px solid transparent;padding-left:9px;margin-left:-2px}
.not-r.ny .not-ic{color:var(--gold)}
.not-tx{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.not-h{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.not-r.ny .not-h{font-weight:850;color:var(--ink)}
.not-s{font-size:11px;color:var(--faint);white-space:nowrap;display:flex;min-width:0}
/* Texten kortas, tiden aldrig — flex:0 0 auto håller den hel. */
.not-s-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.not-s-n{flex:0 0 auto;white-space:nowrap}
.not-p{flex:0 0 auto;display:flex;align-items:center;gap:7px;color:var(--faint);font-size:15px}
.not-dot{width:9px;height:9px;border-radius:50%;background:var(--gold);display:inline-block;
  box-shadow:0 0 0 3px rgba(235,203,139,.18)}
/* Läst tonas ned i stället för att bara sakna markering — kontrasten mot de
   olästa är det som gör dem lätta att hitta. */
.not-r:not(.ny) .not-h{color:var(--dim)}
.not-r:not(.ny) .not-ic{opacity:.55}
.kr-sec{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);padding:14px 0 4px}
.kr-r{display:flex;align-items:center;gap:10px;padding:11px 2px;cursor:pointer;
  border-bottom:1px solid var(--line)}
.kr-r.on{border-bottom-color:transparent}
.kr-r.kr-y{background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 9%,transparent),transparent);
  border-radius:10px;padding-left:10px;padding-right:10px;margin-top:6px}
.kr-r.kr-y .kr-n{font-weight:850;font-size:15px}
.kr-r.kr-y.on{border-bottom-color:transparent;margin-bottom:0}
/* Månaderna dras in under sitt år, så nivåerna syns utan streck och ramar. */
.kr-yo{padding-left:11px;border-left:2px solid var(--line);margin:0 0 4px 4px}
.kr-r.kr-at .kr-n{font-weight:800}
.kr-mn{display:inline-block;margin-left:7px;font-size:10px;color:var(--faint);font-weight:650}
.kr-n{flex:1 1 auto;min-width:0;font-size:13.5px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kr-s{flex:0 0 auto;font-size:12px;color:var(--dim);font-weight:650;white-space:nowrap}
.kr-p{flex:0 0 auto;font-size:10px;color:var(--faint);width:12px;text-align:right}
.kr-o{padding:4px 2px 16px;border-bottom:1px solid var(--line)}
.kr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:7px;
  /* Fast radhöjd: rutor med och utan underrad ska vara lika höga, annars blir
     rutnätet ojämnt så fort en siffra saknar datum. */
  grid-auto-rows:58px}
.kr-c{background:var(--inset);border:1px solid var(--line);border-radius:11px;
  padding:8px 10px;min-width:0;display:flex;align-items:center;gap:9px;overflow:hidden;
  /* Höjden sätts på rutan SJÄLV, inte bara via grid-auto-rows. En ruta utan
     underrad blir annars lägre än sina grannar, och rutnätet ojämnt så fort en
     siffra saknar datum. */
  height:58px;box-sizing:border-box}
.kr-ic{flex:0 0 auto;width:17px;height:17px;display:inline-flex}
.kr-ic .ic{width:100%;height:100%}
/* min-width:0 på både behållare och barn — utan det vägrar flexbox krympa och
   texten svämmar över kanten i stället för att kortas av. */
.kr-tx{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center}
.kr-l{font-size:9px;color:var(--faint);font-weight:750;text-transform:uppercase;
  letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kr-v{font-size:15px;font-weight:850;line-height:1.15;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kr-x{font-size:10px;color:var(--dim);line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* v758: POPUPERNAS DATARADER SOM RUTOR. Raderna (dRow) byggs som förut och görs
   om till rutor av drRutor() när de hamnar i en popup. Rutnätet har sex kolumner:
   en ruta tar 2 (tre per rad), 3 (två per rad) eller 6 (ensam), så att varje rad
   går jämnt ut. Fördelningen görs i drFordela(). */
.dr-grid{display:grid;gap:6px;margin:6px 0 10px;grid-auto-rows:auto}
.kr-grid.dr-grid,.krpop .kr-grid.dr-grid{grid-template-columns:repeat(6,minmax(0,1fr))}
.dr-grid>.kr-c{grid-column:span 3;height:auto;min-height:52px;padding:7px 9px}
.dr-grid .kr-l{font-size:8.5px}
.dr-grid .kr-v{font-size:14px}
.dr-grid .kr-x{font-size:9.5px}
.dr-grid .kr-x .ic{width:11px;height:11px;vertical-align:-1px;margin-right:2px}
.dr-grid .kr-l .di-q{margin-left:3px}
.dr-grid>.kr-c.dr-t{cursor:pointer}
.dr-grid>.kr-c.pa{border-color:rgba(163,190,140,.45)}
.kr-jmf{font-size:11.5px;color:var(--dim);margin-top:10px;line-height:1.7}
.kr-j{white-space:nowrap;margin-right:6px}
.kr-t{font-size:13.5px;line-height:1.65;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--line);color:var(--ink)}
.kr-rap{font-size:13.5px}
/* Rubrikraden: större, med sin emoji intill i stället för hopklistrad. */
.kr-rh{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:850;
  letter-spacing:-.01em;line-height:1.3;margin:0 0 10px;padding-bottom:9px;
  border-bottom:1px solid var(--line)}
.kr-rhi{font-size:19px;line-height:1;flex:0 0 auto}
/* En rad per ämne. Emojin i egen kolumn med fast bredd — annars börjar raderna
   på olika ställen beroende på om tecknet är brett eller smalt. */
/* Ingressen bär tonen — större, ljusare, lite luft under. */
.kr-ing{margin:0 0 12px;font-size:14.5px;line-height:1.6;color:var(--ink);font-weight:650}
/* Brödtext i stycken, som i en artikel. Heter kr-txt eftersom kr-p redan var
   upptagen av listans chevron — en namnkrock som gav 12 px breda stycken. */
.kr-txt{margin:0 0 11px;font-size:13.5px;line-height:1.68;color:var(--dim)}
.kr-txt:last-child{margin-bottom:0}
/* Höjdpunkt. Ingen list, ingen ram — den skiljer sig genom att vara något
   mörkare i tonen och ha sin emoji hängande i vänsterkanten. En rad med streck
   framför läses som en punktlista, och det var precis vad texten inte skulle
   vara. */
.kr-rr{display:block;position:relative;padding:2px 0 2px 27px;margin:0 0 11px;
  font-size:13.5px;line-height:1.68;color:var(--ink);font-weight:600}
.kr-rri{position:absolute;left:0;top:2px;width:19px;text-align:left;
  font-size:14px;line-height:1.55}
.kr-rrt{display:inline}
/* Den gamla flex-varianten borttagen. Den låg SENARE i filen och vann över den
   nya, så emojin fortsatte sitta i en centrerad kolumn — och raden såg ut som
   en punktlista trots att stilen bytts. */
.kr-n2{font-weight:800;color:var(--ink)}
.kr-t.saknas{color:var(--faint);font-style:italic}
/* Nyss skriven post. Notisen säger bara ATT den finns; markeringen visar VAR. */
.kr-r.ny .kr-n::after{content:'NY';margin-left:7px;padding:1px 5px;border-radius:5px;
  background:var(--gold);color:#1c1f24;font-size:8.5px;font-weight:850;
  letter-spacing:.06em;vertical-align:1px}
.prog-b{display:flex;align-items:stretch;gap:3px;height:96px;margin:10px 0 4px}
.prog-c{flex:1 1 0;display:flex;flex-direction:column;min-width:0}
.prog-w{flex:1 1 auto;position:relative;border-top:0;border-bottom:0;
  background:linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat}
.prog-s{position:absolute;left:12%;right:12%;border-radius:3px}
.prog-s.upp{bottom:50%;background:var(--ok)}
.prog-s.ner{top:50%;background:var(--hot)}
.prog-d{flex:0 0 auto;text-align:center;font-size:9px;color:var(--faint);padding-top:3px}
/* Listen följer vinkällarens eget tema, inte dashboardens – annars möts två
   olika färgvärldar i samma bild. Värdena är hämtade ur vinkallare.html:s

.extfr{--vk-ink:#0F1214;--vk-stone:#191E21;--vk-line:#2F383D;--vk-chalk:#E8E4DA;
  position:fixed;inset:0;z-index:450;background:var(--vk-ink);display:none;flex-direction:column}

.extfr-bar{flex:0 0 auto;position:relative;display:flex;align-items:center;

/* Rubriken centreras mot LISTEN, inte mot ytan bredvid knappen – därav den
   absoluta placeringen. Den tar inte emot tryck, så knappen når hela vägen. */
.extfr-t{position:absolute;left:0;right:0;text-align:center;pointer-events:none;
  font-family:"Fraunces",Georgia,"Times New Roman",serif;font-weight:600;font-size:19px;

/* jämför-navknapp bredvid självförsörjning */
.en-cmp{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-family:inherit;border:1px solid rgba(129,161,193,.28);background:rgba(129,161,193,.16);color:var(--blue);font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;white-space:nowrap;margin-left:8px;text-transform:none;letter-spacing:0}

.kiosk #view-jamfor,.kiosk #view-insikter{overflow-y:auto;height:100%}
.kiosk #view-jamfor,.kiosk #view-insikter{max-width:none;margin:0;width:100%}
/* RATTAT v180: kioskslage gor .wrap till flex-kolumn, och da ligger vyerna som flexobjekt.
   Basregeln ovan ger dem margin:0 auto for att centrera 560px-spalten pa en bred skarm.
   I en flex-KOLUMN ar horisontalled tvarsaxeln, och auto-marginaler pa tvarsaxeln
   STANGER AV stretch - objektet krymper till sitt innehalls bredd och centreras.
   Kiosk lyfte max-width men aldrig marginalen, sa bada undersidorna krympte till
   innehallet i stallet for att fylla. Startsidan har ingen marginal och fyllde alltid.
   Att det syntes mest pa Jamfor ar en innehallsfraga: Insikters texter och tabeller ar
   breda nog att na kanten anda, Jamfors diagram och korta etiketter ar det inte. */
body.kiosk.cmp-open{height:auto;overflow:auto}
body.tabprev.cmp-open{overflow:auto}
.kiosk.cmp-open .wrap{height:auto;overflow:visible}
.kiosk.cmp-open .view{overflow:visible;height:auto;min-height:0}
.kiosk.cmp-open #view-jamfor,.kiosk.cmp-open #view-insikter{height:auto;overflow:visible}

#cmp-body>.panel,#ins-body>.panel,#vdr-body>.panel,#not-body>.panel{margin-bottom:var(--pg-gap-y);padding:clamp(16px,2vw,21px)}
.kiosk #cmp-body>.panel,.kiosk #ins-body>.panel,.kiosk #vdr-body>.panel,.kiosk #not-body>.panel{padding:11px 13px}
.kiosk #view-jamfor>.panel,.kiosk #view-insikter>.panel{padding:11px 13px}
