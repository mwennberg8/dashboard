<!DOCTYPE html>
<html lang="sv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inbäddningsprov 1.2.0 · så här skulle det se ut</title>
<style>
/* Dashboardens egna färger och mått, hämtade ur index.html. Poängen med den
   här versionen är att se hur en inbäddad karta SKULLE se ut på plats i
   dashboarden — inte bara om den laddar. Panelen, rubriken, hörnradien och
   knapparna är desamma som i vädersektionen. */
:root{--bg:#2e3440;--panel-b:#2f3643;--line:rgba(216,222,233,.12);--ink:#eceff4;
  --dim:#cdd6e2;--faint:#8b93a3;--inset:#3b4252;--gold:#ebcb8b;--blue:#81a1c1;
  --avd-pad:16px;--pg-gap:15px;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;padding:var(--pg-gap);background:var(--bg);color:var(--ink);
  font:14px/1.5 var(--sans)}
h1{font-size:15px;margin:0 0 4px;letter-spacing:-.01em}
p.sub{margin:0 0 6px;color:var(--faint);font-size:12px}
.urs{font:11px/1.4 ui-monospace,Menlo,monospace;color:var(--faint);margin-bottom:14px}

/* Så här ser ett avsnitt ut i dashboarden. */
.panel{background:var(--panel-b);border:1px solid var(--line);border-radius:18px;
  padding:clamp(16px,2vw,21px);margin-bottom:var(--pg-gap)}
.rc-head{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.rc-t{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint)}
.st{margin-left:auto;font-size:11px;font-weight:700}
.ok{color:#a3be8c}.nej{color:#bf616a}.vantar{color:var(--faint)}
a.ny{color:var(--blue);font-size:11px;text-decoration:none;border:1px solid var(--line);
  border-radius:9px;padding:3px 9px;font-weight:700}
.karta{border-radius:14px;overflow:hidden;background:#0e1013;position:relative}
iframe{display:block;width:100%;border:0;background:#0e1013}
.cap{font-size:11px;color:var(--faint);margin-top:8px;line-height:1.45}

/* Reglagen under kartan, som i dashboarden — för att se hur mycket plats som
   blir kvar när kartan delar avsnitt med något annat. */
.wxm-opt{display:flex;align-items:center;gap:9px;margin-top:9px}
.wxm-ol{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.wxm-b{appearance:none;border:1px solid var(--line);background:var(--inset);color:var(--dim);
  font:inherit;font-size:12px;font-weight:700;border-radius:12px;padding:7px 12px;cursor:pointer}
.wxm-b.on{background:rgba(129,161,193,.18);border-color:var(--blue);color:var(--blue)}
.rad{display:flex;gap:7px;flex-wrap:wrap}

/* Helskärmsläget, som väderkartan redan har. */
.fs{position:fixed;inset:0;z-index:60;background:var(--bg);display:none}
.fs.on{display:block}
.fs iframe{width:100%;height:100%}
.fs-h{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;gap:9px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 12px 22px;
  background:linear-gradient(180deg,rgba(0,0,0,.5),transparent);pointer-events:none}
.fs-h>*{pointer-events:auto}
.fs-b{appearance:none;border:1px solid var(--line);background:var(--inset);color:var(--dim);
  font-family:var(--sans);font-size:12.5px;font-weight:700;border-radius:12px;padding:8px 13px;cursor:pointer}
.fs-t{font-size:14px;font-weight:800;letter-spacing:-.01em}
</style></head><body>
<h1>Inbäddningsprov 1.2.0</h1>
<p class="sub">Varje kandidat ritas som ett riktigt avsnitt i dashboarden — samma panel, samma
rubrikstil, samma hörnradie. Så ser det ut om det byggs in.</p>
<div class="urs" id="urs"></div>
<div id="ut"></div>

<div class="fs" id="fs">
  <div class="fs-h"><button class="fs-b" onclick="fsStang()">← Tillbaka</button>
    <span class="fs-t" id="fs-t"></span></div>
  <iframe id="fs-fr" src="about:blank"></iframe>
</div>

<script>
/* Ingen kod kan avgöra om en sajt tillåter inbäddning — X-Frame-Options och
   frame-ancestors går inte att läsa för en annan sajt, och load-händelsen
   fyras av även när innehållet blockerats. Statusen säger bara att ramen
   laddade något. Ögat avgör. */
document.getElementById('urs').textContent='Ursprung: '+location.origin;

const HOJD=300;   /* ungefär vad väderkartan tar i dashboarden */
const PROV=[
  ['Windy','Radar med nowcast — den enda gratiskandidaten som ger prognos.',
   'https://embed.windy.com/embed2.html?lat=57.39&lon=12.02&zoom=7&level=surface&overlay=radar&menu=&message=&marker=&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=m%2Fs&metricTemp=%C2%B0C&radarRange=-1'],
  ['Windy · avskalad','Utan menyer och reglage. Mindre att titta på, mindre att råka trycka på.',
   'https://embed.windy.com/embed2.html?lat=57.39&lon=12.02&zoom=8&overlay=radar&menu=false&message=false&marker=&calendar=&pressure=false&type=map&location=coordinates&detail=false'],
  ['Ventusky','Egen inbäddningsparameter.',
   'https://www.ventusky.com/?p=57.39;12.02;8&l=radar&embed=1'],
  ['RainViewer','Samma radar dashboarden redan visar. Ingen prognos i den fria versionen.',
   'https://www.rainviewer.com/map.html?loc=57.39,12.02,7&oFa=0&oC=0&oU=0&oCS=1&oF=0&oAP=1&c=3&o=83&lm=1&layer=radar&sm=1&sn=1'],
  ['DMI','Har 90-minutersframskrivningen. Blockerade över http.',
   'https://www.dmi.dk/vejrradar/'],
  ['SMHI','Svensk radarkomposit.',
   'https://www.smhi.se/vader/nederbord-molnighet/radar-blixt-sverige'],
  ['Yr','met.no och NRK.',
   'https://www.yr.no/nb/kart/radar/1-2296569/Sverige/V%C3%A4stra%20G%C3%B6taland/Kungsbacka/Onsala']
];

const ut=document.getElementById('ut');
PROV.forEach(function(p,i){
  const d=document.createElement('section');
  d.className='panel';
  d.innerHTML='<div class="rc-head"><span class="rc-t">'+p[0]+'</span>'
    +'<span class="st vantar" id="st'+i+'">laddar…</span></div>'
    +'<div class="karta"><iframe id="fr'+i+'" src="'+p[2]+'" loading="eager" '
    +'referrerpolicy="no-referrer-when-downgrade" style="height:'+HOJD+'px"></iframe></div>'
    +'<div class="wxm-opt"><span class="wxm-ol">Visa</span><div class="rad">'
    +'<button class="wxm-b on">Radar</button>'
    +'<button class="wxm-b" onclick="fsOppna('+i+')">Helskärm</button>'
    +'<a class="ny" href="'+p[2]+'" target="_blank" rel="noreferrer">öppna direkt</a>'
    +'</div></div>'
    +'<div class="cap">'+p[1]+'</div>';
  ut.appendChild(d);
  const fr=document.getElementById('fr'+i), st=document.getElementById('st'+i);
  let klar=false;
  fr.addEventListener('load',function(){
    klar=true;st.className='st ok';st.textContent='laddade — titta i rutan';
  });
  setTimeout(function(){
    if(!klar){st.className='st nej';st.textContent='ingen laddning — troligen blockerad';}
  },12000);
});

/* Helskärm: ramen får sin adress först när den öppnas, och töms när den stängs.
   En karttjänst som ligger och laddar i bakgrunden kostar batteri och data. */
function fsOppna(i){
  document.getElementById('fs-t').textContent=PROV[i][0];
  document.getElementById('fs-fr').src=PROV[i][2];
  document.getElementById('fs').classList.add('on');
}
function fsStang(){
  document.getElementById('fs').classList.remove('on');
  document.getElementById('fs-fr').src='about:blank';
}
document.addEventListener('keydown',function(e){if(e.key==='Escape')fsStang();});
</script></body></html>
