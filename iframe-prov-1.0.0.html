<!DOCTYPE html>
<html lang="sv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inbäddningsprov · väderkartor</title>
<style>
body{margin:0;padding:14px;background:#14161a;color:#e6e8ec;
  font:14px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif}
h1{font-size:15px;margin:0 0 4px}
p.sub{margin:0 0 14px;color:#8b919b;font-size:12px}
.kort{border:1px solid #2b2f36;border-radius:12px;margin-bottom:14px;overflow:hidden}
.hd{display:flex;align-items:center;gap:8px;padding:9px 11px;background:#1b1e24;font-size:13px}
.hd b{font-weight:700}
.st{margin-left:auto;font-size:12px;font-weight:700}
.ok{color:#5fce7d}.nej{color:#e0524e}.vantar{color:#8b919b}
iframe{display:block;width:100%;height:260px;border:0;background:#0e1013}
.url{font:11px/1.4 ui-monospace,Menlo,monospace;color:#6f7681;padding:6px 11px;word-break:break-all}
</style></head><body>
<h1>Inbäddningsprov</h1>
<p class="sub">Kör från 192.168.50.147:8000, samma ursprung som dashboarden.
Syns en karta i rutan går den att bädda in. Är rutan tom eller vit blockerar sajten det.</p>
<div id="ut"></div>
<script>
/* Kan en sida bäddas in? Det avgörs av svarshuvudena X-Frame-Options och
   Content-Security-Policy: frame-ancestors, och dem kan en webbsida INTE läsa
   för en annan sajt. Därför finns ingen kod som kan svara på frågan - man
   måste titta.

   load-händelsen ljuger dessutom: den fyras av även när webbläsaren blockerat
   innehållet och visat en tom sida i stället. Statusen nedan säger alltså bara
   om ramen laddade NÅGOT, inte om det gick bra. Ögat avgör.

   Sidan körs över http och ramarna över https. Det är tillåtet - det omvända
   är det som blockeras. */
const PROV=[
  ['Windy · radar','Officiell inbäddning, byggd för iframe. Radar med nowcast.',
   'https://embed.windy.com/embed2.html?lat=57.39&lon=12.02&zoom=7&level=surface&overlay=radar&menu=&message=&marker=&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=m%2Fs&metricTemp=%C2%B0C&radarRange=-1'],
  ['Ventusky · radar','Tjeckisk vädertjänst, brukar tillåta inbäddning.',
   'https://www.ventusky.com/?p=57.39;12.02;7&l=radar&embed=1'],
  ['DMI · vejrradar','Har 90-minutersframskrivningen vi letat efter.',
   'https://www.dmi.dk/vejrradar/'],
  ['SMHI · radar','Svensk radarkomposit.',
   'https://www.smhi.se/vader/nederbord-molnighet/radar-blixt-sverige'],
  ['Yr · kart','Norska met.no och NRK.',
   'https://www.yr.no/nb/kart/radar/1-2296569/Sverige/V%C3%A4stra%20G%C3%B6taland/Kungsbacka/Onsala']
];

const ut=document.getElementById('ut');
PROV.forEach(function(p,i){
  const d=document.createElement('div');
  d.className='kort';
  d.innerHTML='<div class="hd"><b>'+p[0]+'</b><span style="color:#8b919b;font-size:11px">'+p[1]+'</span>'
    +'<span class="st vantar" id="st'+i+'">laddar…</span></div>'
    +'<iframe id="fr'+i+'" src="'+p[2]+'" referrerpolicy="no-referrer-when-downgrade" '
    +'sandbox="allow-scripts allow-same-origin allow-popups"></iframe>'
    +'<div class="url">'+p[2].slice(0,120)+'</div>';
  ut.appendChild(d);
  const fr=document.getElementById('fr'+i), st=document.getElementById('st'+i);
  let klar=false;
  fr.addEventListener('load',function(){
    klar=true;
    st.className='st ok';st.textContent='ramen laddade — titta i rutan';
  });
  /* Blockeras sidan kommer ofta ingen load alls. Efter tolv sekunder är det
     svar nog. */
  setTimeout(function(){
    if(!klar){st.className='st nej';st.textContent='ingen laddning — troligen blockerad';}
  },12000);
});
</script></body></html>
